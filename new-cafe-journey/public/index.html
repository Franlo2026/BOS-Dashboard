<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Café &amp; Franchisee Journey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap');
:root{
  --gold:#c8ae79; --gold-light:rgba(200,174,121,0.12);
  --black:#1a1a1a; --white:#ffffff;
  --grey-100:#f7f7f7; --grey-200:#ebebeb; --grey-300:#d4d4d4; --grey-500:#999999; --grey-700:#555555;
  --green:#2e7d32; --green-bg:rgba(46,125,50,0.10);
  --amber:#e65100; --amber-bg:rgba(230,81,0,0.10);
  --red:#c62828; --red-bg:rgba(198,40,40,0.10);
  --font:'Montserrat',Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--grey-100);color:var(--black);min-height:100vh;font-size:13px}
nav.topnav{background:var(--black);min-height:52px;position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:0 24px;flex-wrap:wrap}
.brand{color:var(--white);font-weight:700;font-size:13px;letter-spacing:0.2em;text-transform:uppercase;white-space:nowrap;padding:14px 0}
.brand span{color:var(--gold)}
.topnav-right{display:flex;align-items:center;gap:14px;color:var(--grey-500);font-size:10px;letter-spacing:0.08em;text-transform:uppercase}
.container{max-width:1200px;width:100%;margin:0 auto;padding:28px 24px 80px}
.page-header{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--gold);padding-bottom:14px;margin-bottom:24px;flex-wrap:wrap;gap:10px}
.page-title{font-size:18px;font-weight:700;text-transform:uppercase;letter-spacing:0.03em}
.page-subtitle{font-size:11px;color:var(--grey-500);text-transform:uppercase;letter-spacing:0.06em;margin-top:4px}
.card{background:var(--white);border:1px solid var(--grey-200);padding:20px 22px;margin-bottom:16px}
.section-title{font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:14px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;font-family:var(--font);font-size:11px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;cursor:pointer;border:none;border-radius:0}
.btn.gold{background:var(--gold);color:var(--black)}
.btn.gold:hover{background:#b89a63}
.btn.ghost{background:transparent;color:var(--grey-700);border:1px solid var(--grey-300)}
.btn.ghost:hover{border-color:var(--gold);color:var(--black)}
.btn.small{padding:5px 10px;font-size:9px}
.btn.danger{background:transparent;color:var(--red);border:1px solid var(--red-bg)}
.badge{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;padding:3px 8px;border-radius:0;display:inline-block;white-space:nowrap}
.badge.green{background:var(--green-bg);color:var(--green)}
.badge.amber{background:var(--amber-bg);color:var(--amber)}
.badge.red{background:var(--red-bg);color:var(--red)}
.badge.grey{background:var(--grey-200);color:var(--grey-700)}
.badge.gold{background:var(--gold-light);color:#8a7238}
label{display:block;font-size:9px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--grey-500);margin-bottom:4px}
input,select,textarea{width:100%;font-family:var(--font);font-size:12px;padding:8px 10px;border:1px solid var(--grey-300);border-radius:0;background:var(--white);color:var(--black)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.field{margin-bottom:0}

/* café list */
.cafe-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.cafe-card{background:var(--white);border:1px solid var(--grey-200);border-left:3px solid var(--gold);padding:16px 18px;cursor:pointer;transition:border-color .15s}
.cafe-card:hover{border-left-color:var(--black)}
.cafe-card h3{font-size:14px;font-weight:700;margin-bottom:4px}
.cafe-meta{font-size:10px;color:var(--grey-500);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:12px}
.progress{height:6px;background:var(--grey-200);border-radius:0;overflow:hidden;margin:8px 0 6px}
.progress > div{height:100%;background:var(--gold)}
.cafe-card-foot{display:flex;justify-content:space-between;align-items:center;font-size:10px;color:var(--grey-700);margin-top:8px}

/* detail */
.back-link{background:none;border:none;color:var(--gold);font-family:var(--font);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;cursor:pointer;padding:0;margin-bottom:16px}
.kpi-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));background:var(--white);border:1px solid var(--grey-200);margin-bottom:20px}
.kpi-strip > div{padding:14px 18px;border-right:1px solid var(--grey-200)}
.kpi-strip > div:last-child{border-right:none}
.card-label{font-size:9px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--grey-500);margin-bottom:6px}
.card-value{font-size:22px;font-weight:700}
.stage-tabs{display:flex;gap:2px;flex-wrap:wrap;margin-bottom:16px;border-bottom:1px solid var(--grey-200)}
.stage-tab{background:none;border:none;border-bottom:2px solid transparent;font-family:var(--font);font-size:10px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:var(--grey-500);cursor:pointer;padding:10px 12px;white-space:nowrap}
.stage-tab:hover{color:var(--black)}
.stage-tab.active{color:var(--gold);border-bottom-color:var(--gold)}
.stage-tab .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-left:6px;vertical-align:middle}
.stage-tab .dot.red{background:var(--red)}
.stage-tab .dot.green{background:var(--green)}

.stage-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.stage-role{font-size:11px;color:var(--grey-700);margin-bottom:14px;font-style:italic}

/* step rows */
.step{border:1px solid var(--grey-200);border-left:3px solid var(--grey-300);padding:12px 14px;margin-bottom:8px;background:var(--white)}
.step.done{border-left-color:var(--green);background:var(--green-bg)}
.step.overdue{border-left-color:var(--red);background:var(--red-bg)}
.step.ref{border-left-color:var(--gold);background:var(--gold-light)}
.step-top{display:flex;align-items:flex-start;gap:10px}
.step-check{margin-top:2px}
.step-check input{width:16px;height:16px;cursor:pointer}
.step-body{flex:1;min-width:0}
.step-title{font-size:12px;font-weight:600;line-height:1.35}
.step-desc{font-size:11px;color:var(--grey-700);margin-top:4px;line-height:1.4}
.step-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.step-dates{font-size:10px;color:var(--grey-500);text-transform:uppercase;letter-spacing:0.04em;white-space:nowrap;text-align:right}
.step-dates b{color:var(--black)}
.step-extra{margin-top:10px;padding-top:10px;border-top:1px dashed var(--grey-300);display:none}
.step.editing .step-extra{display:block}
.step-extra .form-grid{margin-bottom:8px}
.muted{color:var(--grey-500)}
.hidden{display:none!important}
.empty{padding:40px;text-align:center;color:var(--grey-500);font-size:12px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--black);color:var(--white);padding:10px 18px;font-size:11px;letter-spacing:0.05em;text-transform:uppercase;z-index:100;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
.note-line{font-size:10px;color:var(--grey-700);margin-top:6px}
.overdue-banner{background:var(--red-bg);border:1px solid var(--red);color:var(--red);padding:10px 14px;margin-bottom:16px;font-size:11px;font-weight:600}
details.addform{margin-bottom:20px}
details.addform > summary{cursor:pointer;list-style:none;font-size:11px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:var(--gold);padding:6px 0}
details.addform > summary::-webkit-details-marker{display:none}
.disclaimer{font-size:10px;color:var(--grey-500);margin-top:24px;padding-top:12px;border-top:1px solid var(--grey-200);line-height:1.5}
</style>
</head>
<body>
<nav class="topnav">
  <div class="brand">NEW CAFÉ <span>&amp;</span> FRANCHISEE JOURNEY</div>
  <div class="topnav-right"><span id="nav-version">v1.0</span></div>
</nav>

<div class="container">
  <!-- ============ LIST VIEW ============ -->
  <div id="list-view">
    <div class="page-header">
      <div>
        <div class="page-title">Opening Pipeline</div>
        <div class="page-subtitle">Sign-up → 4-week post-opening sign-off · 8-stage FSM workflow</div>
      </div>
      <div><span class="badge gold" id="cafe-count">0 cafés</span></div>
    </div>

    <div id="overdue-banner"></div>

    <details class="addform" id="addform">
      <summary>+ Add a new café</summary>
      <div class="card">
        <div class="section-title">New Café</div>
        <div class="form-grid">
          <div class="field"><label>Café name *</label><input id="f-name" placeholder="e.g. Walmer Park"></div>
          <div class="field"><label>Region</label><input id="f-region" placeholder="e.g. EC"></div>
          <div class="field"><label>Franchisee</label><input id="f-franchisee" placeholder="Franchisee name"></div>
          <div class="field"><label>FSM</label><input id="f-fsm" placeholder="Assigned FSM"></div>
          <div class="field"><label>Created / sign-up date *</label><input id="f-created" type="date"></div>
          <div class="field"><label>Handover date</label><input id="f-handover" type="date"></div>
          <div class="field"><label>Target open date</label><input id="f-open" type="date"></div>
        </div>
        <div style="margin-top:14px;display:flex;gap:8px">
          <button class="btn gold" onclick="createCafe()">Create café &amp; generate journey</button>
          <button class="btn ghost" onclick="document.getElementById('addform').open=false">Cancel</button>
        </div>
      </div>
    </details>

    <div id="cafe-grid" class="cafe-grid"></div>
  </div>

  <!-- ============ DETAIL VIEW ============ -->
  <div id="detail-view" class="hidden">
    <button class="back-link" onclick="showList()">← Back to pipeline</button>
    <div class="page-header">
      <div>
        <div class="page-title" id="d-name"></div>
        <div class="page-subtitle" id="d-meta"></div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn ghost small" onclick="toggleEditCafe()">Edit dates</button>
        <button class="btn danger small" onclick="deleteCafe()">Delete</button>
      </div>
    </div>

    <div class="card hidden" id="edit-cafe-card">
      <div class="section-title">Edit anchors &amp; details</div>
      <div class="form-grid">
        <div class="field"><label>Café name</label><input id="e-name"></div>
        <div class="field"><label>Region</label><input id="e-region"></div>
        <div class="field"><label>Franchisee</label><input id="e-franchisee"></div>
        <div class="field"><label>FSM</label><input id="e-fsm"></div>
        <div class="field"><label>Created / sign-up</label><input id="e-created" type="date"></div>
        <div class="field"><label>Handover</label><input id="e-handover" type="date"></div>
        <div class="field"><label>Open</label><input id="e-open" type="date"></div>
        <div class="field"><label>Status</label><select id="e-status"><option value="active">Active</option><option value="completed">Completed</option></select></div>
      </div>
      <div style="margin-top:14px">
        <button class="btn gold" onclick="saveCafe()">Save &amp; recompute planned dates</button>
        <span class="muted" style="margin-left:10px;font-size:10px">Changing an anchor moves planned dates; confirmed dates are preserved.</span>
      </div>
    </div>

    <div class="kpi-strip" id="d-kpis"></div>
    <div class="stage-tabs" id="stage-tabs"></div>
    <div id="stage-panel"></div>

    <div class="disclaimer" id="content-disclaimer"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = '';
let CAFES = [];
let CURRENT = null;      // full café detail {cafe, summary, stages}
let ACTIVE_STAGE = '01';
let STAGE_META = null;

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1800);
}
async function api(method, path, body){
  const r = await fetch(API+path,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
  const txt = await r.text();
  let data; try{data=txt?JSON.parse(txt):null}catch{data=txt}
  if(!r.ok) throw new Error((data&&data.error)||('HTTP '+r.status));
  return data;
}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtDate(iso){ if(!iso) return 'TBC'; const d=new Date(iso+'T00:00:00Z'); return d.toLocaleDateString('en-ZA',{day:'2-digit',month:'short',year:'2-digit',timeZone:'UTC'}); }

/* ---------- LIST ---------- */
async function loadList(){
  try{
    CAFES = await api('GET','/api/cafes');
  }catch(e){ toast('Load failed: '+e.message); CAFES=[]; }
  renderList();
  loadOverdue();
}
function renderList(){
  document.getElementById('cafe-count').textContent = CAFES.length+' café'+(CAFES.length===1?'':'s');
  const grid=document.getElementById('cafe-grid');
  if(!CAFES.length){ grid.innerHTML='<div class="empty">No cafés yet. Add one above to generate its opening journey.</div>'; return; }
  grid.innerHTML = CAFES.map(c=>{
    const s=c.summary||{total:0,done:0,overdue:0,pct:0};
    const statusBadge = c.status==='completed'?'<span class="badge green">Completed</span>'
      : (s.overdue>0?'<span class="badge red">'+s.overdue+' overdue</span>':'<span class="badge grey">Active</span>');
    return `<div class="cafe-card" onclick="openCafe(${c.id})">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
        <h3>${esc(c.name)}</h3>${statusBadge}
      </div>
      <div class="cafe-meta">${esc(c.region||'—')} · ${esc(c.fsm||'No FSM')}</div>
      <div class="progress"><div style="width:${s.pct}%"></div></div>
      <div class="cafe-card-foot">
        <span>${s.done}/${s.total} steps · ${s.pct}%</span>
        <span>Open: ${fmtDate(c.openDate)}</span>
      </div>
    </div>`;
  }).join('');
}
async function loadOverdue(){
  let od=[]; try{ od = await api('GET','/api/overdue'); }catch{}
  const b=document.getElementById('overdue-banner');
  if(!od.length){ b.innerHTML=''; return; }
  const byCafe={};
  od.forEach(x=>{ byCafe[x.cafeName]=(byCafe[x.cafeName]||0)+1; });
  const parts=Object.entries(byCafe).map(([n,c])=>`${esc(n)} (${c})`).join(', ');
  b.innerHTML=`<div class="overdue-banner">⚠ ${od.length} overdue step${od.length===1?'':'s'} across active cafés — ${parts}</div>`;
}
async function createCafe(){
  const name=document.getElementById('f-name').value.trim();
  if(!name){ toast('Café name is required'); return; }
  const payload={
    name, region:document.getElementById('f-region').value.trim(),
    franchiseeName:document.getElementById('f-franchisee').value.trim(),
    fsm:document.getElementById('f-fsm').value.trim(),
    createdDate:document.getElementById('f-created').value||null,
    handoverDate:document.getElementById('f-handover').value||null,
    openDate:document.getElementById('f-open').value||null,
  };
  try{
    const c=await api('POST','/api/cafes',payload);
    toast('Café created — journey generated');
    document.getElementById('addform').open=false;
    ['f-name','f-region','f-franchisee','f-fsm','f-created','f-handover','f-open'].forEach(id=>document.getElementById(id).value='');
    await loadList();
    openCafe(c.id);
  }catch(e){ toast('Create failed: '+e.message); }
}

/* ---------- DETAIL ---------- */
async function openCafe(id){
  try{ CURRENT = await api('GET','/api/cafes/'+id); }
  catch(e){ toast('Load failed: '+e.message); return; }
  const firstWithSteps = (CURRENT.stages.find(s=>s.steps.length)||CURRENT.stages[0]);
  ACTIVE_STAGE = firstWithSteps ? firstWithSteps.id : '01';
  document.getElementById('list-view').classList.add('hidden');
  document.getElementById('detail-view').classList.remove('hidden');
  document.getElementById('edit-cafe-card').classList.add('hidden');
  renderDetail();
  window.scrollTo(0,0);
}
function showList(){
  document.getElementById('detail-view').classList.add('hidden');
  document.getElementById('list-view').classList.remove('hidden');
  loadList();
}
function renderDetail(){
  const c=CURRENT.cafe, s=CURRENT.summary;
  document.getElementById('d-name').textContent=c.name;
  document.getElementById('d-meta').textContent=
    `${c.region||'—'} · Franchisee: ${c.franchiseeName||'—'} · FSM: ${c.fsm||'—'} · ${c.status==='completed'?'COMPLETED':'ACTIVE'}`;
  document.getElementById('d-kpis').innerHTML=`
    <div><div class="card-label">Overall progress</div><div class="card-value">${s.pct}%</div></div>
    <div><div class="card-label">Steps done</div><div class="card-value">${s.done}/${s.total}</div></div>
    <div><div class="card-label">Overdue</div><div class="card-value" style="color:${s.overdue?'var(--red)':'inherit'}">${s.overdue}</div></div>
    <div><div class="card-label">Created</div><div class="card-value" style="font-size:14px">${fmtDate(c.createdDate)}</div></div>
    <div><div class="card-label">Handover</div><div class="card-value" style="font-size:14px">${fmtDate(c.handoverDate)}</div></div>
    <div><div class="card-label">Open</div><div class="card-value" style="font-size:14px">${fmtDate(c.openDate)}</div></div>`;

  // stage tabs
  document.getElementById('stage-tabs').innerHTML=CURRENT.stages.map(st=>{
    const sm=st.summary; let dot='';
    if(!st.referenceOnly){
      if(sm.overdue>0) dot='<span class="dot red"></span>';
      else if(sm.total>0 && sm.done===sm.total) dot='<span class="dot green"></span>';
    }
    return `<button class="stage-tab ${st.id===ACTIVE_STAGE?'active':''}" onclick="setStage('${st.id}')">${st.id} · ${esc(st.name)}${dot}</button>`;
  }).join('');
  renderStage();
  document.getElementById('content-disclaimer').textContent =
    'Stage 01 (Recruitment & Opening Admin) is fully populated from the FSM New Store Opening Guide. Stages 00 and 02–07 are placeholder stubs pending extraction of their source documents; Stage 08 is reference-only. Step wording should be validated against the live source documents.';
}
function setStage(id){ ACTIVE_STAGE=id; renderDetail(); }
function renderStage(){
  const st=CURRENT.stages.find(x=>x.id===ACTIVE_STAGE);
  const panel=document.getElementById('stage-panel');
  if(!st){ panel.innerHTML=''; return; }
  const sm=st.summary;
  const concurrent = st.concurrentWith&&st.concurrentWith.length?` · runs concurrently with Stage ${st.concurrentWith.join(', ')}`:'';
  let head=`<div class="card"><div class="stage-head">
      <div>
        <div class="section-title">Stage ${st.id} — ${esc(st.name)}</div>
        <div class="stage-role">${esc(st.fsmRole||'')}${concurrent}</div>
      </div>
      <div>${st.referenceOnly?'<span class="badge gold">Reference only</span>':`<span class="badge ${sm.overdue?'red':(sm.done===sm.total&&sm.total?'green':'grey')}">${sm.done}/${sm.total} · ${sm.pct}%</span>`}</div>
    </div>`;
  if(!st.steps.length){ head+='<div class="empty">No steps yet — this stage is a stub pending source-document extraction.</div></div>'; panel.innerHTML=head; return; }
  head+='</div>';
  const rows=st.steps.map(renderStepRow).join('');
  panel.innerHTML=head+rows;
}
function renderStepRow(step){
  const cls=step.isReference?'ref':(step.confirmed?'done':(step.overdue?'overdue':''));
  const respBadge = step.responsible?`<span class="badge grey">${esc(step.responsible)}</span>`:'';
  const srcBadge = step.sourceDoc?`<span class="badge gold" title="Source document">${esc(step.sourceDoc)}</span>`:'';
  const overdueBadge = step.overdue?'<span class="badge red">Overdue</span>':'';
  const notesLine = step.notes?`<div class="note-line">📝 ${esc(step.notes)}</div>`:'';
  const overrideLine = step.overrideReason?`<div class="note-line muted">Override: ${esc(step.overrideReason)}</div>`:'';
  const confBy = step.confirmedBy?` by ${esc(step.confirmedBy)}`:'';
  if(step.isReference){
    return `<div class="step ref"><div class="step-top"><div class="step-body">
      <div class="step-title">${esc(step.title)}</div>
      <div class="step-desc">${esc(step.description||'')}</div>
      <div class="step-tags">${srcBadge}<span class="badge gold">Reference</span></div>
    </div></div></div>`;
  }
  return `<div class="step ${cls}" id="step-${step.id}">
    <div class="step-top">
      <div class="step-check"><input type="checkbox" ${step.confirmed?'checked':''} onchange="toggleStep(${step.id},this.checked)"></div>
      <div class="step-body">
        <div class="step-title">${esc(step.title)}</div>
        <div class="step-desc">${esc(step.description||'')}</div>
        <div class="step-tags">${respBadge}${srcBadge}${overdueBadge}
          <button class="btn ghost small" onclick="toggleEdit(${step.id})">Details</button>
        </div>
        ${notesLine}${overrideLine}
      </div>
      <div class="step-dates">
        <div>Planned: <b>${fmtDate(step.plannedDate)}</b></div>
        <div class="${step.confirmed?'':'muted'}">Actual: <b>${step.confirmed?fmtDate(step.actualDate):'—'}</b>${confBy}</div>
      </div>
    </div>
    <div class="step-extra">
      <div class="form-grid">
        <div class="field"><label>Actual / confirmed date</label><input type="date" id="ad-${step.id}" value="${step.actualDate||''}"></div>
        <div class="field"><label>Confirmed by</label><input id="cb-${step.id}" value="${esc(step.confirmedBy||'')}" placeholder="Name"></div>
        <div class="field"><label>Attachment URL (proof)</label><input id="au-${step.id}" value="${esc(step.attachmentUrl||'')}" placeholder="https://…"></div>
      </div>
      <div class="field" style="margin-bottom:8px"><label>Notes</label><textarea id="nt-${step.id}" rows="2">${esc(step.notes||'')}</textarea></div>
      <div class="field" style="margin-bottom:8px"><label>Override reason (if actual differs from planned)</label><input id="or-${step.id}" value="${esc(step.overrideReason||'')}"></div>
      <button class="btn gold small" onclick="saveStep(${step.id})">Save step</button>
    </div>
  </div>`;
}
function toggleEdit(id){ document.getElementById('step-'+id).classList.toggle('editing'); }

async function toggleStep(id,checked){
  try{
    const body = checked ? {confirmed:true} : {confirmed:false};
    await api('PATCH','/api/steps/'+id,body);
    await refreshCurrent();
    toast(checked?'Step confirmed':'Step un-confirmed');
  }catch(e){ toast('Save failed: '+e.message); refreshCurrent(); }
}
async function saveStep(id){
  const body={
    actualDate:document.getElementById('ad-'+id).value||null,
    confirmedBy:document.getElementById('cb-'+id).value.trim()||null,
    attachmentUrl:document.getElementById('au-'+id).value.trim()||null,
    notes:document.getElementById('nt-'+id).value.trim()||null,
    overrideReason:document.getElementById('or-'+id).value.trim()||null,
  };
  if(body.actualDate) body.confirmed=true;
  try{ await api('PATCH','/api/steps/'+id,body); await refreshCurrent(); toast('Step saved'); }
  catch(e){ toast('Save failed: '+e.message); }
}
async function refreshCurrent(){
  if(!CURRENT) return;
  CURRENT = await api('GET','/api/cafes/'+CURRENT.cafe.id);
  renderDetail();
}

/* café edit */
function toggleEditCafe(){
  const card=document.getElementById('edit-cafe-card');
  card.classList.toggle('hidden');
  if(!card.classList.contains('hidden')){
    const c=CURRENT.cafe;
    document.getElementById('e-name').value=c.name||'';
    document.getElementById('e-region').value=c.region||'';
    document.getElementById('e-franchisee').value=c.franchiseeName||'';
    document.getElementById('e-fsm').value=c.fsm||'';
    document.getElementById('e-created').value=c.createdDate||'';
    document.getElementById('e-handover').value=c.handoverDate||'';
    document.getElementById('e-open').value=c.openDate||'';
    document.getElementById('e-status').value=c.status||'active';
  }
}
async function saveCafe(){
  const body={
    name:document.getElementById('e-name').value.trim(),
    region:document.getElementById('e-region').value.trim(),
    franchiseeName:document.getElementById('e-franchisee').value.trim(),
    fsm:document.getElementById('e-fsm').value.trim(),
    createdDate:document.getElementById('e-created').value||null,
    handoverDate:document.getElementById('e-handover').value||null,
    openDate:document.getElementById('e-open').value||null,
    status:document.getElementById('e-status').value,
  };
  try{
    await api('PATCH','/api/cafes/'+CURRENT.cafe.id,body);
    document.getElementById('edit-cafe-card').classList.add('hidden');
    await refreshCurrent();
    toast('Saved — planned dates recomputed');
  }catch(e){ toast('Save failed: '+e.message); }
}
async function deleteCafe(){
  if(!confirm('Delete this café and its entire journey? This cannot be undone.')) return;
  try{ await api('DELETE','/api/cafes/'+CURRENT.cafe.id); toast('Café deleted'); showList(); }
  catch(e){ toast('Delete failed: '+e.message); }
}

/* boot */
(async function(){
  try{ STAGE_META = await api('GET','/api/stages'); document.getElementById('nav-version').textContent=STAGE_META.templateVersion; }catch{}
  document.getElementById('f-created').value=new Date().toISOString().slice(0,10);
  loadList();
})();
</script>
</body>
</html>
