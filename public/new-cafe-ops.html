:root {

}
* , *::before, *::after { box-sizing: border-box; margin:0; padding:0; }
body { font-family: var(--font); background: var(--grey-100); color: var(--black); min-height:100vh; font-size:13px; }
nav.topnav { background: var(--black); min-height: 52px; position: sticky; top:0; z-index: 50; display:flex; align-items:center; justify-content:space-between; padding: 0 24px; flex-wrap:wrap; }

.period-badge { border:1px solid var(--gold); background:var(--gold-light); color:var(--gold); font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; padding:6px 12px; white-space:nowrap; }

.btn { display:inline-flex; align-items:center; gap:6px; padding:9px 16px; font-family:var(--font); font-size:11px; font-weight:700; letter-spacing:0.04em; text-transform:uppercase; cursor:pointer; border:none; border-radius:2px; }
.btn-gold { background:var(--gold); color:var(--black); }

.active-cafe-banner { background:var(--black); color:var(--gold); padding:12px 18px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; margin-bottom:18px; display:flex; justify-content:space-between; align-items:center; }

.subsection-title { font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--grey-700); margin:18px 0 8px; padding-top:10px; border-top:1px solid var(--grey-200); }

.grid-5 { display:grid; grid-template-columns:repeat(5,1fr); border:1px solid var(--grey-200); background:var(--white); }

<script>
// ---------- Shared BOS session + storage shim ----------
window.storage = {
  async get(key) {
    const token = localStorage.getItem('bos_token');
    const res = await fetch('/api/storage/' + encodeURIComponent(key), { headers: token ? { 'Authorization': 'Bearer ' + token } : {} });
    if (res.status === 404) return null;
    if (!res.ok) throw new Error('storage get failed: ' + res.status);
    return res.json();
  },
  async set(key, value) {
    const token = localStorage.getItem('bos_token');
    const res = await fetch('/api/storage/' + encodeURIComponent(key), {
      method: 'POST',
      headers: Object.assign({ 'Content-Type': 'application/json' }, token ? { 'Authorization': 'Bearer ' + token } : {}),
      body: JSON.stringify({ value })
    });
    if (!res.ok) throw new Error('storage set failed: ' + res.status);
    return res.json();
  }
};

async function checkBosSession() {
  const token = localStorage.getItem('bos_token');
  if (!token) return null;
  try {
    const res = await fetch('/api/me', { headers: { 'Authorization': 'Bearer ' + token } });
    if (!res.ok) { localStorage.removeItem('bos_token'); return null; }
    return await res.json();
  } catch (e) { return null; }
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>{ t.style.display='none'; }, 2600);
}
function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function uid(prefix){ return (prefix||'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function slugify(s){ return String(s||'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'') || 'cafe'; }

// ---------- Deep get/set helper for dotted paths ----------
function deepGet(obj, path){
  return path.split('.').reduce((o,k) => (o==null ? undefined : o[k]), obj);
}
function deepSet(obj, path, val){
  const keys = path.split('.');
  let cur = obj;
  for (let i=0;i<keys.length-1;i++){
    const k = keys[i];
    if (cur[k] == null || typeof cur[k] !== 'object') cur[k] = /^\d+$/.test(keys[i+1]) ? [] : {};
    cur = cur[k];
  }
  cur[keys[keys.length-1]] = val;
}

  const res = await fetch(pathUrl, { headers: authHeaders() });
  if (!res.ok) throw new Error('Request failed: ' + res.status);
  return res.json();
}

// CPA Timeline milestone engine — every milestone date is derived from
// three anchors (Created, Handover = Opening-7d, Opening), each overridable
// per café via store.cpaOverrides. Ported verbatim from BOS's index.html.
function calcCPA(store){
  if (!store || !store.openDate) return null;
  const open = new Date(store.openDate + 'T00:00:00');
  if (isNaN(open)) return null;
  const add = (d, days) => { const r = new Date(d); r.setDate(r.getDate() + days); return r; };
  const sub = (d, days) => add(d, -days);
  const fmt = (d) => d.toISOString().slice(0, 10);
  const overrides = Object.assign({ handoverDate: store.handoverDate, trainingStart: store.trainingStartDate }, store.cpaOverrides || {});
  const ov = (key) => {
    const v = overrides[key];
    if (!v) return null;
    const d = new Date(v + 'T00:00:00');
    return isNaN(d) ? null : d;
  };
  const handover = ov('handoverDate') || sub(open, 7);
  const createdRaw = store.createdDate || (typeof store.id === 'number' ? new Date(store.id).toISOString().slice(0, 10) : null);
  const created = createdRaw ? new Date(createdRaw + 'T00:00:00') : sub(handover, 98);
  const franchiseeMeeting1 = ov('franchiseeMeeting1') || add(created, 14);
  const base = [
    { key: 'welcomeMail', label: 'Welcome Mail Sent, Masterfile Created/Updated', date: add(created, 2) },
    { key: 'franchiseeMeeting1', label: 'Franchisee Meeting 1', date: franchiseeMeeting1 },
    { key: 'cafeInfoCaptured', label: 'Café Info Captured & Communicated (Contact Numbers, Trading Hours, Google/App/Marketing) — Masterfile Updated', date: add(created, 21) },
    { key: 'cafeEmailsCreated', label: 'Café E-mails Created & Orderflow Profiles Live', date: add(created, 14) },
    { key: 'acctAppDocsReceived', label: 'Account Application Supporting Documents Received', date: add(created, 14) },
    { key: 'acctAppCompletion', label: 'Account Application Completion', date: sub(handover, 35) },
    { key: 'appEncryptionSetup', label: 'Bootlegger App Applications Completed & Encryption Key Shared/Set Up', date: sub(handover, 42) },
    { key: 'handoverDate', label: 'Handover Date', date: handover },
    { key: 'openingOrdersPlaced', label: 'Opening Orders Placed & Delivery Dates Confirmed', date: sub(handover, 28) },
    { key: 'openingOrdersReceived', label: 'Opening Orders Received', date: add(handover, 2) },
    { key: 'topUpOrders', label: 'Top Up Orders Completed', date: add(handover, 4) },
    { key: 'recruitmentArtwork', label: 'Recruitment Artwork Ready, Shared & Posted (incl. Brand Socials)', date: add(created, 21) },
    { key: 'interviewsScheduled', label: 'Interviews Scheduled', date: add(created, 35) },
    { key: 'staffSecuredMgmt', label: 'Staff Positions Secured — GM, Managers, Baristas & Kitchen Supervisors', date: sub(handover, 56) },
    { key: 'staffSecuredSupport', label: 'Staff Positions Secured — Kitchen Assistants, Scullers, Waitrons & Cashiers', date: sub(handover, 42) },
    { key: 'trainingScheduleCommunicated', label: 'Training Schedule Communicated & Training Café Allocated', date: sub(handover, 56) },
    { key: 'trainingCommencesMgmt', label: 'Training Commences — GM, Managers, Baristas & Kitchen Supervisors', date: sub(handover, 28) },
    { key: 'trainingCommencesSupport', label: 'Training Commences — Kitchen Assistants, Scullers, Waitrons & Cashiers', date: sub(handover, 14) },
    { key: 'bbetterCompletion', label: 'Online B.Better Training Completion — 100% All Sections', date: sub(handover, 7) },
    { key: 'trainingEndAdjustments', label: 'Training End & Additional Training Period Adjustments (Delays)', date: sub(handover, 1) },
    { key: 'inStoreTraining1', label: 'In-Store Training Day 1 — Clean & Set-Up', date: sub(handover, 7) },
    { key: 'inStoreTraining2', label: 'In-Store Training Day 2 — Prep & Roleplay', date: sub(handover, 6) },
    { key: 'inStoreTraining3', label: 'In-Store Training Day 3 — Prep & Roleplay', date: sub(handover, 5) },
    { key: 'inStoreTraining4', label: 'In-Store Training Day 4 — All Dishes Prepped & Discussed', date: sub(handover, 4) },
    { key: 'inStoreTraining5', label: 'In-Store Training Day 5 — All Dishes Prepped & Discussed (Problem Items)', date: sub(handover, 3) },
    { key: 'inStoreTraining6', label: 'In-Store Training Day 6 — Full Mock Service 1 (Friends, Family, Tenants, LL)', date: sub(handover, 2) },
    { key: 'inStoreTraining7', label: 'In-Store Training Day 7 — Full Mock Service 2 (Public)', date: sub(handover, 1) },
    { key: 'staffRecruitmentCommences', label: 'Staff Recruitment Commences', date: add(created, 21) },
    { key: 'baristaSignOff', label: 'Barista Sign Off', date: sub(open, 2) },
    { key: 'openingReadinessChecklist', label: 'Opening Readiness Checklist Complete', date: sub(open, 1) },
    { key: 'openDate', label: 'Opening Date', date: open },
    { key: 'completeBusinessEssentials', label: 'Complete Business Essentials', date: add(open, 7) },
    { key: 'fullPostOpeningReport', label: 'Full Post-Opening Summary/Report', date: add(open, 28) },
    { key: 'postSupportWk1', label: 'Post-Support Week 1', date: open },
    { key: 'postSupportWk2', label: 'Post-Support Week 2', date: add(open, 14) },
    { key: 'postSupportWk3', label: 'Post-Support Week 3', date: add(open, 21) },
    { key: 'postSupportWk4', label: 'Post-Support Week 4', date: add(open, 28) },
  ];
  const milestones = base.map(m => ({ key: m.key, label: m.label, date: fmt(ov(m.key) || m.date) }));
  let cursor = add(franchiseeMeeting1, 14);
  let n = 2;
  while (cursor < open) {
    const key = `franchiseeMeeting${n}`;
    milestones.push({ key, label: `Franchisee Meeting ${n}`, date: fmt(ov(key) || cursor) });
    cursor = add(cursor, 14);
    n++;
  }
  milestones.sort((a, b) => a.date.localeCompare(b.date));
  return {
    createdDate: fmt(created),
    openDate: fmt(open),
    handoverDate: fmt(handover),
    archiveDate: fmt(add(open, 28)),
    milestones,
  };
}

  function normalizeTrainingWeeks(weeks){
    const arr = Array.isArray(weeks) ? weeks.slice(0, 4) : [];
    while (arr.length < 4) arr.push('');

  // Training Start Date (Week 1) is uniform across every role: the café's
  // own Opening Date minus 5 weeks — this is also the exact CPA "Training
  // Commences" milestone, so the 4-week calendar runs training-start →
  // handover (1 week prior to opening). A trainee's own start date can be
  // manually overridden (e.g. someone starting later than the café norm)
  // via `startDateOverride` on their row, which takes priority when set.
  function computeTrainingStartDate(openDateIso, startOverride){
    if (startOverride) {
      const d = new Date(startOverride + 'T00:00:00');
      if (!isNaN(d.getTime())) return d;
    }
    if (!openDateIso) return null;
    const d = new Date(openDateIso + 'T00:00:00');
    if (isNaN(d.getTime())) return null;
    d.setDate(d.getDate() - 35);
    return d;
  }
  function fmtDayMonth(date){
    if (!date || isNaN(date.getTime())) return '';
    const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    return date.getDate() + ' ' + months[date.getMonth()];
  }
  function isoDate(date){
    if (!date || isNaN(date.getTime())) return '';

  // How far a trainee has progressed through the 4-week training calendar,
  // based on their (possibly overridden) start date vs today. Whole weeks
  // elapsed count as "completed" — someone in their 3rd week has completed
  // 2 of 4 weeks (50%), matching how the recruitment/training split is
  // meant to read together (e.g. "60% of required staff have completed
  // 50% of training").
  function trainingWeekProgress(startDate){
    if (!startDate || isNaN(startDate.getTime())) return { currentWeek: 0, completedWeeks: 0, pct: 0 };
    const diffDays = Math.floor((new Date(today) - startDate) / 86400000);
    if (diffDays < 0) return { currentWeek: 0, completedWeeks: 0, pct: 0 };
    const completedWeeks = Math.min(Math.floor(diffDays / 7), 4);
    const currentWeek = Math.min(completedWeeks + 1, 4);
    return { currentWeek, completedWeeks, pct: (completedWeeks / 4) * 100 };
  }
  // Recruitment tracking: every training-calendar row with a position typed
  // in is a "slot" for that role — a blank Name next to it is a vacancy.
  // Recruitment % = named rows / total rows with a position set.
  function recruitmentStats(cal){
    const relevant = cal.staff.filter(p => (p.position||'').trim());
    if (!relevant.length) return null;
    const totalRequired = relevant.length;
    const totalFilled = relevant.filter(p => (p.name||'').trim()).length;
    return { totalRequired, totalFilled, pct: (totalFilled/totalRequired)*100 };
  }
  function trainingProgressStats(cal, openDate){
    const filled = cal.staff.filter(p => (p.name||'').trim());
    if (!filled.length) return { pct: 0, avgWeek: 0 };
    let pctSum = 0, weekSum = 0;
    filled.forEach(p => {
      const startDate = computeTrainingStartDate(openDate, p.startDateOverride);
      const prog = trainingWeekProgress(startDate);
      pctSum += prog.pct; weekSum += prog.currentWeek;
    });
    return { pct: pctSum / filled.length, avgWeek: weekSum / filled.length };

  function computeCafeProgress(cal, openDate){
    const rec = recruitmentStats(cal);
    const trn = trainingProgressStats(cal, openDate);
    const recruitmentPct = rec ? rec.pct : null;
    const trainingPct = trn.pct;
    const overallPct = (recruitmentPct !== null) ? (recruitmentPct/100) * (trainingPct/100) * 100 : null;
    return {

      totalRequired: rec ? rec.totalRequired : 0,
      totalFilled: rec ? rec.totalFilled : 0,
      avgWeek: trn.avgWeek,
    };
  }

  // Small dependency-free CSV parser (handles quoted fields with embedded
  // commas) — avoids pulling in an external library for this one form.
  // Auto-detects comma vs semicolon (Excel in many non-US locales exports
  // semicolon-delimited CSVs), and normalizes line endings so a lone \r
  // (old Mac-style) doesn't merge every row into one.
  function detectCsvDelimiter(text) {
    const firstLine = (text.split(/\r\n|\r|\n/)[0]) || '';
    const commas = (firstLine.match(/,/g) || []).length;
    const semis = (firstLine.match(/;/g) || []).length;
    return semis > commas ? ';' : ',';
  }
  function parseCsvText(text, delimiter){
    delimiter = delimiter || ',';
    // Excel commonly saves UTF-8 CSVs with a leading BOM — left in place,
    // it silently attaches itself to the first header cell ("\uFEFFPosition"),
    // which then fails to match "position" and breaks the whole import.
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
    text = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
    const rows = [];
    let row = [], field = '', inQuotes = false;
    for (let i = 0; i < text.length; i++){
      const c = text[i];
      if (inQuotes) {
        if (c === '"') { if (text[i+1] === '"') { field += '"'; i++; } else { inQuotes = false; } }
        else field += c;
      } else {
        if (c === '"') inQuotes = true;
        else if (c === delimiter) { row.push(field); field = ''; }
        else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
        else field += c;
      }
    }
    if (field.length || row.length) { row.push(field); rows.push(row); }
    return rows.filter(r => r.some(f => f.trim() !== ''));
  }

  // Expected CSV format: header row of Position, Name, Store, Wk 1, Wk 2,
  // Wk 3, Wk 4 (only the first 4 columns starting with "week"/"wk" are used
  // — Start Date isn't part of the CSV since it's calculated automatically
  // from the café's Open Date and the role's standard lead time).
  function importTrainingCsv(storeName, file){
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        const rawText = String(reader.result);
        const delimiter = detectCsvDelimiter(rawText);
        const rows = parseCsvText(rawText, delimiter);
        if (rows.length < 2) { toast('CSV looks empty — needs a header row plus at least one staff row'); return; }
        const header = rows[0].map(h => h.trim().toLowerCase());
        // Tolerant of common real-world header variants — "Positions",
        // "Postion", "Postions" (a typo that's shown up in an actual
        // template used here) — anything starting with "pos" matches.
        const posIdx = header.findIndex(h => h.startsWith('pos'));
        const nameIdx = header.findIndex(h => h === 'name');
        const storeIdx = header.findIndex(h => h === 'store');
        const weekCols = header.map((h,i) => ({h,i})).filter(({h}) => h.startsWith('week') || h.startsWith('wk')).slice(0, 4);
        if (posIdx === -1 || nameIdx === -1) {
          const found = rows[0].map(h => h.trim()).filter(Boolean).join(', ') || '(no headers detected)';
          toast(`CSV needs "Position" and "Name" column headers. Found instead: ${found}`);
          return;
        }
        const staff = rows.slice(1).map(r => ({
          position: (r[posIdx]||'').trim(),
          name: (r[nameIdx]||'').trim(),
          store: storeIdx > -1 ? (r[storeIdx]||'').trim() : '',
          weeks: normalizeTrainingWeeks(weekCols.map(({i}) => (r[i]||'').trim())),
        })).filter(p => p.position || p.name);
        trainingCalendars[storeName] = { weekLabels: [...TRAINING_WEEK_LABELS], staff };
        renderStoreList();
        await saveTrainingCalendars();
        toast(`Imported ${staff.length} training staff for ${storeName}`);
      } catch(e) { toast('Could not parse that CSV — check the format and try again. (' + e.message + ')'); }
    };
    reader.readAsText(file);
  }

  // Case/punctuation-insensitive lookup — the Beeline Groups Report names
  // don't always match the café's exact record name (e.g. "Clara-Anna" vs
  // "Clara Anna").
  function newCafeBBetterFor(storeName){
    if (newCafeBBetter[storeName]) return newCafeBBetter[storeName];
    const norm = (s) => (s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
    const target = norm(storeName);
    const matchKey = Object.keys(newCafeBBetter).find(k => norm(k) === target);
    return matchKey ? newCafeBBetter[matchKey] : null;
  }
  // Expects the Beeline "Groups Report" .xlsx export as-is: Name, Average
  // Completion (%), Onboarded Members, Onboarded (%).
  function importBBetterWorkbook(file){
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        if (!window.XLSX) { toast('Excel reader failed to load — refresh the page and try again'); return; }
        const wb = XLSX.read(new Uint8Array(reader.result), { type: 'array' });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });
        let count = 0;
        rows.forEach(r => {
          const name = String(r['Name'] || '').trim();
          if (!name) return;
          newCafeBBetter[name] = {
            avgCompletion: Number(r['Average Completion (%)']) || 0,
            onboardedMembers: Number(r['Onboarded Members']) || 0,
            onboardedPct: Number(r['Onboarded (%)']) || 0,
            uploadedAt: today,
          };
          count++;
        });
        if (!count) { toast('No rows found — expected a "Name" column from the Beeline Groups Report'); return; }
        await saveNewCafeBBetter();
        renderStoreList();
        toast(`Imported B.Better status for ${count} group(s)`);
      } catch(e) { toast('Could not read that file — expected the Beeline Groups Report .xlsx export. (' + e.message + ')'); }
    };
    reader.readAsArrayBuffer(file);
  }

    const defaults = { confirmed:false, comment:'', fileUrl:'', fileName:'', title:'', description: MILESTONE_DEFAULT_DESCRIPTIONS[key] || '' };
    if (raw && typeof raw === 'object') return Object.assign({}, defaults, raw);
    return Object.assign({}, defaults, { confirmed: !!raw });
  }
  async function loadCpaConfirmations(){
    try {
      const r = await apiGet('/api/storage/cpa-confirmations-v1');
      cpaConfirmations = JSON.parse(r.value || '{}');

  async function uploadCpaMilestoneFile(storeName, key, file){
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        const res = await fetch('/api/upload-file', {
          method:'POST', headers: Object.assign({'Content-Type':'application/json'}, authHeaders()),
          body: JSON.stringify({ dataUrl: String(reader.result), subfolder: 'cpa-milestones' })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Upload failed');
        const meta = getMilestoneMeta(storeName, key);
        const storeConf = Object.assign({}, cpaConfirmations[storeName] || {}, { [key]: Object.assign({}, meta, { fileUrl: data.url, fileName: file.name }) });
        cpaConfirmations = Object.assign({}, cpaConfirmations, { [storeName]: storeConf });
        renderStoreList();
        await saveCpaConfirmations();
        toast('File attached');
      } catch(e) { toast(e.message || 'Could not upload that file'); }
    };
    reader.readAsDataURL(file);
  }
  async function removeCpaMilestoneFile(storeName, key){
    const meta = getMilestoneMeta(storeName, key);
    const storeConf = Object.assign({}, cpaConfirmations[storeName] || {}, { [key]: Object.assign({}, meta, { fileUrl:'', fileName:'' }) });
    cpaConfirmations = Object.assign({}, cpaConfirmations, { [storeName]: storeConf });
    renderStoreList();
    await saveCpaConfirmations();
  }

  // One-time, additive-only enrichment: fills in blank Franchisee & Store
  // Details fields from the MASTER Store Info Sheet workbook (14 July
  // 2026) for cafés already being tracked. Never touches Opening Date or
  // Handover Date — the workbook's dates disagreed with what's already
  // tracked for most stores and there's no reliable way to tell which
  // source is more current, so those stay exactly as they are; Franlo/
  // Tarryn can adjust them by hand using the editable field already in
  // place. Also never overwrites a field someone has already filled in.
  async function migrateStoreDetailsFromMasterSheetIfNeeded(){
    try {
      const flag = await apiGet('/api/storage/store-details-master-migrated-v1');
      if (flag && flag.value === 'true') return;
    } catch(e) { /* flag not set yet — proceed */ }
    let changed = false;
    Object.entries(STORE_DETAILS_MASTER_SEED).forEach(([name, fields]) => {
      if (!storeDetails[name]) storeDetails[name] = {};
      Object.entries(fields).forEach(([k, v]) => {
        if (!storeDetails[name][k]) { storeDetails[name][k] = v; changed = true; }
      });
    });
    if (changed) await saveStoreDetails();
    try {
      await fetch('/api/storage/store-details-master-migrated-v1', {
        method:'POST', headers: Object.assign({'Content-Type':'application/json'}, authHeaders()),
        body: JSON.stringify({ value: 'true' })
      });
    } catch(e) { /* safe to retry next load — additive/idempotent */ }
  }

  function setStoreDetailField(storeName, field, value){
    if (!storeDetails[storeName]) storeDetails[storeName] = {};
    storeDetails[storeName][field] = value;
    saveStoreDetails();
  }

  // Editing a café's Open Date here directly changes the same value that
  // drives calcCPA() — every milestone in the CPA Timeline and the
  // Post-Support Schedule recomputes from it on the next render. Only
  // works for extraStores (manually added or approved from a submission);
  // the original hardcoded pipeline entries don't carry an id and aren't
  // editable through the UI.
  async function setStoreOpenDate(storeName, value){
    const store = extraStores.find(s => s.name === storeName);
    if (!store) return;
    store.openDate = value;
    await saveExtraStores();
    renderStoreList();
  }

  // Café Created Date drives the Franchisee Check-in cadence and the Account
  // Application milestone (calcCPA) — many existing/migrated cafés never had
  // a real creation date recorded, so it defaults to today (or the record's
  // own id/submission timestamp) until set here manually.
  async function setStoreCreatedDate(storeName, value){
    const store = extraStores.find(s => s.name === storeName);
    if (!store) return;
    store.createdDate = value;
    await saveExtraStores();
    renderStoreList();
  }

  function setPendingField(id, field, value){
    const sub = cafeSubmissions.find(s => s.id === id);
    if (!sub) return;
    sub[field] = value;

  // Turns an approved pending request into a real tracked café: adds it to
  // extraStores (so it gets a CPA timeline immediately, using the submitted
  // Handover Date if one was given), files everything else — franchisee,
  // landlord, and store details — under storeDetails for the new
  // "🏢 Franchisee & Store Details" section, then drops it from the queue.
  async function approveCafeSubmission(id){
    const sub = cafeSubmissions.find(s => s.id === id);
    if (!sub) return;
    if (!sub.storeName || !sub.storeName.trim()) { toast('Store Name is required before approving'); return; }
    if (!sub.openDate) { toast('Store Opening Date is required before approving'); return; }
    const name = sub.storeName.trim();
    extraStores.push({
      id: Date.now(),
      name,
      type: sub.type || 'Full Store',
      region: sub.region || '',
      openDate: sub.openDate,
      createdDate: sub.submittedAt ? new Date(sub.submittedAt).toISOString().slice(0,10) : todayISO(),
      fsm: sub.fsm || '',
      notes: '',
    });
    await saveExtraStores();
    storeDetails[name] = {
      location: sub.location || '',
      seats: sub.seats || '',
      turnover: sub.turnover || '',
      address: sub.address || '',
      invoicingDetails: sub.invoicingDetails || '',
      representative: sub.representative || '',
      representativeEmail: sub.representativeEmail || '',
      representativeContactNumber: sub.representativeContactNumber || '',
      fsmEmail: sub.fsmEmail || '',
      fsmContactNumber: sub.fsmContactNumber || '',
      pm: sub.pm || '',
      pmEmail: sub.pmEmail || '',
      pmContactNumber: sub.pmContactNumber || '',
      landlordContact: sub.landlordContact || '',
      landlordEmail: sub.landlordEmail || '',
      landlordContactNumber: sub.landlordContactNumber || '',
    };
    await saveStoreDetails();
    cafeSubmissions = cafeSubmissions.filter(s => s.id !== id);
    await saveCafeSubmissions();
    toast(`${name} approved and added to New Cafés`);
    subTab = 'active';
    document.querySelectorAll('#otlSubTab .segmented-btn').forEach(b => b.classList.toggle('active', b.dataset.sub === 'active'));
    document.getElementById('otlFilterRow').style.display = '';
    document.getElementById('otlStoreList').style.display = '';
    document.getElementById('otlPendingList').style.display = 'none';
    renderAll();
  }

    renderPendingList();
  }

  function allStores(){
    return extraStores.map(s => {
      const cal = getTrainingCalendar(s.name);
      return {

        cpa: calcCPA(s),

      };
    });

  function renderAll(){
    const regionSel = document.getElementById('otlRegion');
    if (!regionSel) return; // dashboard shell no longer in the DOM
    const stores = allStores().filter(s => !isArchived(s));
    const regions = ['All', ...Array.from(new Set(stores.map(s=>s.region))).sort()];
    if (regionSel.options.length === 0) regionSel.innerHTML = regions.map(r=>`<option>${r}</option>`).join('');

    const upcoming90 = stores.filter(s => s.openDate && (new Date(s.openDate)-new Date(today))/86400000 <= 90 && (new Date(s.openDate)-new Date(today))/86400000 >= 0).length;
    const thisMonth = stores.filter(s => s.openDate && s.openDate.slice(0,7) === today.slice(0,7)).length;
    const overallAvgVals = stores.map(s => s.training && s.training.overallPct).filter(v => v !== null && v !== undefined);
    const overallAvg = overallAvgVals.length ? overallAvgVals.reduce((a,b)=>a+b,0)/overallAvgVals.length : 0;
    const cpaAlerts = [];
    stores.forEach(s => {
      if (!s.cpa) return;
      s.cpa.milestones.forEach(({label, date}) => {
        const diff = Math.ceil((new Date(date)-new Date(today))/86400000);
        if (diff >= 0 && diff <= 30) cpaAlerts.push({label, date, store:s.name, daysLeft:diff});
      });
    });
    cpaAlerts.sort((a,b)=>a.daysLeft-b.daysLeft);

    document.getElementById('otlKpis').innerHTML = [
      ['Total Stores', stores.length], ['Opening ≤90 Days', upcoming90],
      ['CPA Alerts (30d)', cpaAlerts.length], ['Avg Training %', Math.round(overallAvg)+'%'], ['This Month', thisMonth]
    ].map(([l,v]) => `<div><div class="card-label">${l}</div><div class="card-value">${v}</div></div>`).join('');

    document.getElementById('otlUpcoming').innerHTML = stores
      .filter(s=>s.openDate && s.openDate >= today).sort((a,b)=>a.openDate.localeCompare(b.openDate)).slice(0,12)
      .map(s => {
        const days = Math.ceil((new Date(s.openDate)-new Date(today))/86400000);
        return `<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--grey-200);">
          <div><div style="font-size:13px;font-weight:600;">${s.name}</div><div style="font-size:11px;color:var(--grey-500);">${s.type} · ${s.region} · FSM: ${s.fsm||'—'}</div></div>
          <div style="text-align:right;"><div style="font-size:12px;font-weight:700;color:${days<=14?'var(--amber)':'var(--green)'}">${days===0?'Today!':days+'d'}</div></div>
        </div>`;
      }).join('') || '<div class="empty-state">No upcoming openings.</div>';

    document.getElementById('otlAlerts').innerHTML = cpaAlerts.slice(0,15).map(a => `
      <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--grey-200);">
        <div><div style="font-size:12px;font-weight:600;">${a.store}</div><div style="font-size:11px;color:var(--grey-500);">${a.label}</div></div>
        <span class="badge ${a.daysLeft<=7?'red':'amber'}">${a.daysLeft===0?'Today':a.daysLeft+'d'}</span>
      </div>`).join('') || '<div class="empty-state">No CPA milestones in the next 30 days.</div>';

    renderStoreList();

    if (isEditor()) {
      document.getElementById('otlAddedList').innerHTML = extraStores.length ? extraStores.map(s => `
        <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--grey-200);">
          <div><b>${s.name}</b> — ${s.openDate||'TBC'}</div>
          <button class="btn btn-outline otlRemove" data-id="${s.id}">Remove</button>
        </div>`).join('') : '';
      document.querySelectorAll('.otlRemove').forEach(btn => btn.addEventListener('click', async () => {
        extraStores = extraStores.filter(s => String(s.id) !== btn.dataset.id);
        await saveExtraStores(); renderAll();
      }));
    } else {
      document.getElementById('otlAddCard').style.display = 'none';
    }
  }

      <input type="date" ${isEditableStore ? `class="odField" data-store="${escTC(s.name)}"` : 'disabled'} value="${escTC(s.openDate||'')}" style="width:100%;padding:5px 6px;border:1px solid var(--grey-200);border-radius:2px;font-size:11.5px;box-sizing:border-box;${isEditableStore?'':'background:var(--grey-100);color:var(--grey-500);'}">

    const customRows = det.customFields.map((c, ci) => `
      <div style="display:flex;align-items:center;gap:6px;font-size:12px;padding:4px 6px;border-bottom:1px solid var(--grey-200);">
        <span style="width:160px;font-style:italic;">${escTC(c.label)}</span>
        <input type="text" class="detailsCustomValue" data-store="${escTC(s.name)}" data-idx="${ci}" value="${escTC(c.value||'')}" style="flex:1;font-size:11.5px;padding:5px 7px;border:1px solid var(--grey-200);">

      <input type="text" class="detailsCustomLabelInput" data-store="${escTC(s.name)}" placeholder="Custom field name..." style="flex:1;min-width:160px;font-size:11.5px;padding:6px 8px;border:1px solid var(--grey-300);">
      <button type="button" class="btn btn-outline btn-mini detailsCustomAddBtn" data-store="${escTC(s.name)}">+ Add Manual Entry</button>

  function readinessSectionContent(s){
    if (!READINESS_STATE) return { html: '<div class="empty-state">Loading…</div>', pct: 0 };
    if (!Array.isArray(READINESS_STATE.customItems)) READINESS_STATE.customItems = [];
    const prog = readinessProgress();
    let body = `<div class="section-title" style="margin-bottom:0;">✅ Project Readiness Checklist</div>
      <div class="progress-track" style="margin:10px 0 20px;"><div class="progress-fill" id="readinessProgressFill" style="width:${prog.pct}%;"></div></div>`;
    READINESS_CONFIG.phases.forEach((phase, pi) => {
      body += `<div class="section-divider">${escapeHtml(phase.title)}</div>`;
      phase.subsections.forEach((sub, si) => {
        if (sub.group_only) { body += `<div class="subsection-title">${escapeHtml(sub.title)}</div>`; return; }
        if (sub.title) body += `<div class="subsection-title">${escapeHtml(sub.title)}</div>`;
        const rows = sub.items.map((it, ii) => {
          const key = pi + '_' + si + '_' + ii;
          const rowState = (READINESS_STATE.items||{})[key] || {};
          const cols = READINESS_CONFIG.item_columns.map(col => `<td>${inputHtml(col, 'items.' + key + '.' + col.key, rowState[col.key])}</td>`).join('');
          return `<tr><td style="width:34px;color:var(--grey-500);">${ii+1}</td><td>${escapeHtml(it.label)}</td>${cols}</tr>`;
        }).join('');
        const headCols = READINESS_CONFIG.item_columns.map(c => `<th>${escapeHtml(c.label)}</th>`).join('');
        body += `<div class="table-wrap"><table class="data-table"><thead><tr><th style="width:34px;">#</th><th>Item / Task / Service</th>${headCols}</tr></thead><tbody>${rows}</tbody></table></div>`;
        if (sub.has_comments) {
          const cKey = pi + '_' + si;
          const cVal = (READINESS_STATE.subComments||{})[cKey] || '';
          body += `<div class="field" style="margin-top:8px;margin-bottom:14px;"><label>Comments</label><textarea rows="2" data-path="subComments.${cKey}" data-kind="text">${escapeHtml(cVal)}</textarea></div>`;
        }
      });
    });
    const customRows = READINESS_STATE.customItems.map((c, ci) => `
      <tr><td style="width:34px;color:var(--grey-500);">${ci+1}</td>
      <td><input type="text" data-path="customItems.${ci}.label" data-kind="text" value="${escapeHtml(c.label)}" style="font-style:italic;"></td>
      <td><select data-path="customItems.${ci}.status" data-kind="select"><option value="">—</option>${['Pending','Yes','No','N/A'].map(o=>`<option value="${o}" ${c.status===o?'selected':''}>${o}</option>`).join('')}</select></td>
      <td><input type="text" data-path="customItems.${ci}.comment" data-kind="text" value="${escapeHtml(c.comment)}"></td>
      <td><button type="button" class="readinessCustomRemove" data-idx="${ci}" style="border:none;background:none;color:var(--red);cursor:pointer;font-size:14px;">×</button></td></tr>`).join('');
    body += `<div class="section-divider">Manual Entries</div>
      <div class="table-wrap"><table class="data-table"><thead><tr><th style="width:34px;">#</th><th>Item</th><th>Status</th><th>Comment</th><th></th></tr></thead><tbody>${customRows || `<tr><td colspan="5" class="empty-state">No manual entries yet.</td></tr>`}</tbody></table></div>
      <button class="btn btn-outline btn-mini readinessCustomAddBtn" style="margin-top:8px;">+ Add Manual Entry</button>`;
    body += `<div class="section-divider">Sign-Off</div><div class="card">${
      (() => {
        const fields = READINESS_CONFIG.signoff_fields.map(f => {
          const v = (READINESS_STATE.signoff||{})[f.key];
          return `<div class="field"><label>${escapeHtml(f.label)}</label>${inputHtml(f, 'signoff.' + f.key, v)}</div>`;
        }).join('');
        return `<div class="form-grid two">${fields}</div>`;
      })()

  function training7dayProgress(){
    let total = 7, doneWeighted = 0;
    Object.keys(TRAINING7DAY_CONFIG.days).forEach(dnum => {
      const day = TRAINING_STATE.days && TRAINING_STATE.days[dnum];
      const signoff = day && day.sections && day.sections['d'+dnum+'_signoff'];
      if (signoff && signoff.overall_status === 'Pass') doneWeighted += 1;
      else if (signoff && signoff.overall_status === 'Needs Follow-up') doneWeighted += 0.5;
    });
    const custom = Array.isArray(TRAINING_STATE.customItems) ? TRAINING_STATE.customItems : [];
    total += custom.length;
    custom.forEach(it => { if (it.status && it.status !== 'Pending') doneWeighted += 1; });
    return { total, done: doneWeighted, pct: total ? Math.round((doneWeighted/total)*100) : 0 };
  }

  function training7daySectionContent(s){
    if (!TRAINING_STATE) return { html: '<div class="empty-state">Loading…</div>', pct: 0 };
    if (!Array.isArray(TRAINING_STATE.customItems)) TRAINING_STATE.customItems = [];
    const prog = training7dayProgress();
    const dayTabs = Object.keys(TRAINING7DAY_CONFIG.days).map(dnum => {
      const dot = dayCompletionDot(dnum);
      return `<button class="day-tab ${String(ACTIVE_DAY)===dnum?'active':''}" data-day="${dnum}"><span class="dot ${dot}"></span>Day ${dnum}</button>`;
    }).join('');
    const day = TRAINING7DAY_CONFIG.days[String(ACTIVE_DAY)];
    const dayStatePath = 'days.' + ACTIVE_DAY;
    if (!deepGet(TRAINING_STATE, dayStatePath)) deepSet(TRAINING_STATE, dayStatePath, { header:{}, sections:{} });
    let sectionsHtml = '';
    day.sections.forEach(section => {
      const statePath = dayStatePath + '.sections.' + section.id;
      if (!deepGet(TRAINING_STATE, statePath)) deepSet(TRAINING_STATE, statePath, section.kind === 'dynamic' ? {rows:[]} : (section.kind==='signoff' ? {} : {rows:{}}));
      sectionsHtml += renderSectionBlock(section, statePath, TRAINING_STATE);
    });
    const headerState = deepGet(TRAINING_STATE, dayStatePath + '.header') || {};
    const headerFields = day.header_fields.map(f => `<div class="field"><label>${escapeHtml(f.label)}</label>${inputHtml(f, dayStatePath + '.header.' + f.key, headerState[f.key])}</div>`).join('');
    const customRows = TRAINING_STATE.customItems.map((c, ci) => `
      <tr><td style="width:34px;color:var(--grey-500);">${ci+1}</td>
      <td><input type="text" data-path="customItems.${ci}.label" data-kind="text" value="${escapeHtml(c.label)}" style="font-style:italic;"></td>
      <td><select data-path="customItems.${ci}.status" data-kind="select"><option value="">—</option>${['Pending','Done','N/A'].map(o=>`<option value="${o}" ${c.status===o?'selected':''}>${o}</option>`).join('')}</select></td>
      <td><input type="text" data-path="customItems.${ci}.notes" data-kind="text" value="${escapeHtml(c.notes)}"></td>

    const html = `
      <div class="section-title" style="margin-bottom:0;">🎯 7-Day On-Site Training</div>
      <div class="progress-track" style="margin:10px 0 16px;"><div class="progress-fill" style="width:${prog.pct}%;"></div></div>
      <div class="day-tabs">${dayTabs}</div>
      <div class="form-grid two" style="margin-bottom:16px;">${headerFields}</div>
      <div class="day-focus-box"><b>Day Focus:</b> ${escapeHtml(day.focus)}</div>
      ${sectionsHtml}
      <div class="section-divider">Manual Entries (café-wide)</div>
      <div class="table-wrap"><table class="data-table"><thead><tr><th style="width:34px;">#</th><th>Item</th><th>Status</th><th>Notes</th><th></th></tr></thead><tbody>${customRows || `<tr><td colspan="5" class="empty-state">No manual entries yet.</td></tr>`}</tbody></table></div>
      <button class="btn btn-outline btn-mini training7dayCustomAddBtn" style="margin-top:8px;">+ Add Manual Entry</button>
    `;
    return { html, pct: prog.pct };

  // ---------- Snapshot (Pipeline list) ----------
  function readinessProgress(){
    let total = 0, done = 0;
    READINESS_CONFIG.phases.forEach((p, pi) => p.subsections.forEach((s, si) => {
      if (s.group_only) return;
      (s.items||[]).forEach((it, ii) => {
        total++;
        const key = pi + '_' + si + '_' + ii;
        const v = (READINESS_STATE.items||{})[key];
        if (v && v.status && v.status !== 'Pending') done++;
      });
    }));
    (READINESS_STATE.customItems||[]).forEach(it => { total++; if (it.status && it.status !== 'Pending') done++; });
    return { total, done, pct: total ? Math.round((done/total)*100) : 0 };
  }

  function snapshotForStore(s){
    // Readiness/Training snapshot use whatever's currently cached for the
    // ACTIVE profile café only (loading all cafés' checklists up front for
    // a whole list would mean dozens of extra API calls) — for any other
    // café in the list we show '—' until you open its profile once.
    const isActiveProfileCafe = String(s.id) === String(PROFILE_CAFE_ID);
    const cpa = cpaSectionContent(s);
    const trainingRec = trainingRecSectionContent(s);
    const details = detailsSectionContent(s);
    const readinessPct = (isActiveProfileCafe && READINESS_STATE) ? readinessProgress().pct : (CAFE_READINESS_CACHE[s.id] != null ? CAFE_READINESS_CACHE[s.id] : null);
    const trainingPct = (isActiveProfileCafe && TRAINING_STATE) ? training7dayProgress().pct : (CAFE_TRAINING7_CACHE[s.id] != null ? CAFE_TRAINING7_CACHE[s.id] : null);
    const parts = [cpa.pct, trainingRec.pct, details.pct];
    if (readinessPct !== null) parts.push(readinessPct);
    if (trainingPct !== null) parts.push(trainingPct);
    const overall = parts.length ? Math.round(parts.reduce((a,b)=>a+b,0)/parts.length) : 0;
    return { cpaPct: cpa.pct, trainingRecPct: trainingRec.pct, detailsPct: details.pct, readinessPct, trainingPct, overall };
  }

  function renderStoreList(){
    const searchEl = document.getElementById('otlSearch');

    let rows = allStores()
      .filter(s => subTab === 'archive' ? isArchived(s) : !isArchived(s))
      .filter(s => (!search || s.name.toLowerCase().includes(search)) && (!region || region==='All' || s.region===region));
    rows.sort((a,b) => (a.openDate||'9999').localeCompare(b.openDate||'9999'));

    document.getElementById('otlStoreList').innerHTML = rows.map(s => {
      const isExp = expanded === s.name;
      const days = s.openDate ? Math.ceil((new Date(s.openDate)-new Date(today))/86400000) : null;
      const status = days===null?'TBD':days<0?'Opened':days===0?'Today!':days+'d';
      let detail = '';
      if (isExp) {
        const snap = snapshotForStore(s);
        const rag = (pct) => pct>=80?'var(--green)':pct>=50?'var(--gold)':'var(--red)';
        const miniBar = (label, pct, sectionId) => `
          <button type="button" class="snapshotSectionBtn" data-store-id="${s.id}" data-section="${sectionId}" style="display:block;width:100%;text-align:left;border:none;background:none;cursor:pointer;padding:6px 0;">
            <div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px;"><span>${label}</span><b>${pct===null?'—':pct+'%'}</b></div>
            ${progressBar(pct, rag(pct||0))}
          </button>`;
        detail = `<div style="border-top:1px solid var(--grey-200);padding:16px;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
            <div style="font-size:12px;font-weight:700;">Opening Status Snapshot</div>
            <div style="font-size:20px;font-weight:800;color:${rag(snap.overall)};">${snap.overall}%</div>
          </div>
          ${miniBar('📅 CPA Timeline', snap.cpaPct, 'cpa')}
          ${miniBar('🎓 Training & Recruitment', snap.trainingRecPct, 'trainingrec')}
          ${miniBar('🏢 Franchisee & Store Details', snap.detailsPct, 'details')}
          ${miniBar('✅ Project Readiness', snap.readinessPct, 'readiness')}
          ${miniBar('🎯 7-Day Training', snap.trainingPct, 'training7day')}
          <div style="font-size:10px;color:var(--grey-500);margin-top:10px;">Click any row above, or "Opening Status →", to open the full profile.</div>
        </div>`;
      }
      const assignedSupport = supportAllocations[s.name] || [];
      return `<div class="card" style="margin-bottom:8px;padding:0;">
        <div style="display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;" data-toggle="${s.name}">
          <div style="flex:1;"><b>${s.name}</b><div style="font-size:11px;color:var(--grey-500);">${s.type} · ${s.region} · FSM: ${s.fsm||'—'} · Support: ${assignedSupport.length ? assignedSupport.join(', ') : '—'}</div></div>
          <div style="font-size:12px;font-weight:700;">${status}</div>
          <div style="font-size:11px;color:var(--grey-500);">${s.openDate||'Date TBC'}</div>
          <button class="btn btn-outline btn-mini" data-open-checklists="${s.id}" style="white-space:nowrap;">Opening Status →</button>
        </div>
        ${detail}
      </div>`;
    }).join('') || (subTab==='archive' ? '<div class="empty-state">No archived cafés yet — stores move here 4 weeks after opening.</div>' : '<div class="empty-state">No stores match your filters.</div>');

    document.querySelectorAll('[data-open-checklists]').forEach(el => el.addEventListener('click', async (e) => {
      e.stopPropagation();
      await enterProfile(el.dataset.openChecklists, 'cpa');
    }));
    document.querySelectorAll('.snapshotSectionBtn').forEach(el => el.addEventListener('click', async (e) => {
      e.stopPropagation();
      await enterProfile(el.dataset.storeId, el.dataset.section);

    document.querySelectorAll('[data-toggle]').forEach(el => el.addEventListener('click', () => {

  loadCpaConfirmations().then(renderStoreList);
  loadSupportAllocations().then(renderStoreList);

  if (PROFILE_CAFE_ID) {

  loadSupportAllocations().then(renderStoreList);
  loadTrainingCalendars().then(renderStoreList);

  loadStoreDetails().then(() => migrateStoreDetailsFromMasterSheetIfNeeded().then(renderStoreList));

  renderNewStoreSupportChips();
  loadExtraStores().then(renderAll);
}

// ==================================================================
// GENERIC CHECKLIST TABLE RENDERERS
// ==================================================================
function inputHtml(col, path, val){
  const v = val == null ? '' : val;
  if (col.type === 'checkbox') {
    return `<input type="checkbox" data-path="${path}" data-kind="checkbox" ${v ? 'checked' : ''}>`;
  }
  if (col.type === 'select') {
    const opts = (col.options||[]).map(o => `<option value="${escapeHtml(o)}" ${v===o?'selected':''}>${escapeHtml(o)}</option>`).join('');
    return `<select data-path="${path}" data-kind="select"><option value="">—</option>${opts}</select>`;
  }
  if (col.type === 'number') {
    return `<input type="number" data-path="${path}" data-kind="number" value="${escapeHtml(v)}">`;
  }
  if (col.type === 'date') {
    return `<input type="date" data-path="${path}" data-kind="text" value="${escapeHtml(v)}">`;
  }
  return `<input type="text" data-path="${path}" data-kind="text" value="${escapeHtml(v)}">`;
}

// Fixed-item section: pre-defined rows (task/owner or role), keyed by index.
function renderFixedSection(section, statePath, stateRoot){
  const rowsState = deepGet(stateRoot, statePath + '.rows') || {};
  const rows = section.fixed_items.map((item, i) => {
    const row = rowsState[i] || {};
    const labelCell = item.editable_label
      ? `<input type="text" data-path="${statePath}.rows.${i}.label" data-kind="text" value="${escapeHtml(row.label)}" placeholder="Name">`
      : `${escapeHtml(item.label)}`;
    const metaCell = item.meta ? `<span class="meta-badge">${escapeHtml(item.meta)}</span>` : '';
    const cols = section.columns.map(c => `<td>${inputHtml(c, statePath + '.rows.' + i + '.' + c.key, row[c.key])}</td>`).join('');
    return `<tr><td style="width:34px;color:var(--grey-500);">${i+1}</td><td>${labelCell}</td><td>${metaCell}</td>${cols}</tr>`;
  }).join('');
  const headCols = section.columns.map(c => `<th>${escapeHtml(c.label)}</th>`).join('');
  return `<div class="table-wrap"><table class="data-table">
    <thead><tr><th style="width:34px;">#</th><th>${escapeHtml(section.label_col_name)}</th><th>Role</th>${headCols}</tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

// Dynamic section: user-typed label rows, extensible.
function renderDynamicSection(section, statePath, stateRoot){
  let rows = deepGet(stateRoot, statePath + '.rows');
  if (!Array.isArray(rows)) { rows = []; deepSet(stateRoot, statePath + '.rows', rows); }
  while (rows.length < section.blank_rows) rows.push({});
  const bodyRows = rows.map((row, i) => {
    const cols = section.columns.map(c => `<td>${inputHtml(c, statePath + '.rows.' + i + '.' + c.key, row[c.key])}</td>`).join('');
    return `<tr><td style="width:34px;color:var(--grey-500);">${i+1}</td><td><input type="text" data-path="${statePath}.rows.${i}.label" data-kind="text" value="${escapeHtml(row.label)}" placeholder="${escapeHtml(section.label_col_name)}"></td>${cols}</tr>`;
  }).join('');
  const headCols = section.columns.map(c => `<th>${escapeHtml(c.label)}</th>`).join('');
  return `${section.note ? `<div class="note-text">${escapeHtml(section.note)}</div>` : ''}
    <div class="table-wrap"><table class="data-table">
    <thead><tr><th style="width:34px;">#</th><th>${escapeHtml(section.label_col_name)}</th>${headCols}</tr></thead>
    <tbody data-dynrows="${statePath}">${bodyRows}</tbody></table></div>
    <button class="btn btn-outline btn-mini" data-addrow="${statePath}" style="margin-top:8px;">+ Add Row</button>`;
}

function renderSignoffSection(section, statePath, stateRoot){
  const state = deepGet(stateRoot, statePath) || {};
  const fields = section.fields.map(f => {
    const path = statePath + '.' + f.key;
    return `<div class="field"><label>${escapeHtml(f.label)}</label>${inputHtml(f, path, state[f.key])}</div>`;
  }).join('');
  return `<div class="form-grid two">${fields}</div>`;
}

function renderSectionBlock(section, statePath, stateRoot){
  let body = '';
  if (section.kind === 'fixed') body = renderFixedSection(section, statePath, stateRoot);
  else if (section.kind === 'dynamic') body = renderDynamicSection(section, statePath, stateRoot);
  else if (section.kind === 'signoff') body = renderSignoffSection(section, statePath, stateRoot);
  return `<div class="section-title" style="margin-top:22px;">${escapeHtml(section.title)}</div>${body}`;
}

// Delegated input handler shared by both checklist views.
function wireGenericInputs(container, stateRoot, saveKind){
  container.addEventListener('input', (e) => {
    const el = e.target;
    if (!el.dataset || !el.dataset.path) return;
    if (el.dataset.kind === 'checkbox') return; // handled by 'change'
    let val = el.value;
    if (el.dataset.kind === 'number') val = val === '' ? null : Number(val);
    deepSet(stateRoot, el.dataset.path, val);
    scheduleSave(saveKind);
  });
  container.addEventListener('change', (e) => {
    const el = e.target;
    if (!el.dataset || !el.dataset.path) return;
    if (el.dataset.kind === 'checkbox') { deepSet(stateRoot, el.dataset.path, el.checked); scheduleSave(saveKind); }
    else if (el.dataset.kind === 'select') { deepSet(stateRoot, el.dataset.path, el.value); scheduleSave(saveKind); }
  });
  container.querySelectorAll('[data-addrow]').forEach(btn => btn.addEventListener('click', () => {
    const path = btn.dataset.addrow;
    const rows = deepGet(stateRoot, path + '.rows') || [];
    rows.push({});
    deepSet(stateRoot, path + '.rows', rows);
    render();
  }));
}

// ==================================================================
// PROJECT READINESS VIEW
// ==================================================================
async function loadCafeChecklists(){
  const rKey = 'newcafe-readiness-' + ACTIVE_CAFE_ID;
  const tKey = 'newcafe-training7day-' + ACTIVE_CAFE_ID;
  try { const r = await window.storage.get(rKey); READINESS_STATE = r && r.value ? JSON.parse(r.value) : {items:{}, subComments:{}, signoff:{}}; }
  catch(e){ READINESS_STATE = {items:{}, subComments:{}, signoff:{}}; }
  try { const r = await window.storage.get(tKey); TRAINING_STATE = r && r.value ? JSON.parse(r.value) : {days:{}}; }
  catch(e){ TRAINING_STATE = {days:{}}; }
}

// ==================================================================
// (readinessProgress/training7dayProgress and the section renderers now
// live nested inside viewPipeline() as cpaSectionContent/readinessSectionContent/
// training7daySectionContent etc — see the Profile view. dayCompletionDot
// stays here since it only touches module-level TRAINING_STATE/TRAINING7DAY_CONFIG.)
// ==================================================================
function dayCompletionDot(dnum){
  const day = TRAINING_STATE.days && TRAINING_STATE.days[dnum];
  if (!day) return '';
  const signoff = day.sections && day.sections['d'+dnum+'_signoff'];
  if (signoff && signoff.overall_status === 'Pass') return 'done';
  if (signoff && signoff.overall_status === 'Needs Follow-up') return 'partial';
  return '';
}

// ==================================================================
// RENDER DISPATCH
// ==================================================================
function render(){
  renderNavTabs();
  viewPipeline();
}

// ==================================================================
// INIT
// ==================================================================
async function startApp(){
  await loadExtraStores();
  render();
}

checkBosSession().then(me => {
  if (!me) {
    document.getElementById('gateMsg').textContent = 'Sign in on the main BOS Dashboard first — this page shares that login.';
    document.getElementById('gateLink').style.display = 'block';
    return;
  }
  document.getElementById('bosGate').style.display = 'none';
  document.getElementById('topNav').style.display = 'flex';
  document.getElementById('app').style.display = 'block';
  window.__ME = me;
  startApp();
});
