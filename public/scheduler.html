   TAB: CAFÉ DIRECTORY
   ============================================================ */
function cafeVisitStats(site) {
  // Find which roster bucket (if any) this site belongs to, across both managers
  for (const mgrKey of Object.keys(ROSTER)) {
    const person = ROSTER[mgrKey].find(p => p.sites.some(s => s.id === site.id));
    if (person) {
      const effectivePlan = getEffectivePlan(mgrKey, person.label, person.plan);
      const scheduledDays = [];
      effectivePlan.forEach((names, absDay) => { if (names.includes(site.name)) scheduledDays.push(absDay); });
      // Every café also gets the manager's own quarterly visit — merge that
      // in too, so a café is never truly "zero visits" even if it were ever
      // dropped from the support rotation for some reason.
      const managerPlan = getEffectivePlan(mgrKey, MANAGER_LABEL, MANAGER_COMBINED_PLANS[mgrKey]);
      const managerDays = [];
      managerPlan.forEach((names, absDay) => { if (names.includes(site.name)) managerDays.push(absDay); });
      // Support-team members (Siphesihle/Mini/Aphiwe/Addright) each cover
      // their whole region independently of the FSM bucket split above — so
      // a café can be confirmed-visited by one of them too, not just by
      // whoever its FSM bucket happens to be. Collecting every distinct
      // visitor here (not just the FSM bucket owner) is what lets the
      // Directory's "Confirmed" column actually add those up correctly.
      // The manager themselves (Franlo/Tarryn) must be included too — they
      // can personally confirm a visit under their own MANAGER_LABEL
      // bucket, and that confirmation needs to count just as much as any
      // FSM's or support member's.
      const visitors = [{ managerKey: mgrKey, personLabel: person.label }, { managerKey: mgrKey, personLabel: MANAGER_LABEL }];
      const supportDays = [];
      (SUPPORT_TEAM_PLANS[mgrKey] || []).forEach(sp => {
        if (sp.sites.some(s => s.id === site.id)) {
          visitors.push({ managerKey: mgrKey, personLabel: sp.label });
          // A support-team member's own scheduled days for this café must
          // be counted here too — otherwise their confirmed visits (which
          // DO get counted, via visitors above) could exceed "scheduled",
          // since scheduledDays previously only reflected the FSM bucket
          // owner's and manager's plans, not each support member's own.
          const spPlan = getEffectivePlan(mgrKey, sp.label, sp.plan);
          spPlan.forEach((names, absDay) => { if (names.includes(site.name)) supportDays.push(absDay); });
        }
      });
      // Also fold in the actual date of every confirmed visit for this
      // café, even if the CURRENT rotation plan no longer shows a visit on
      // that day — a rotation regenerating after a visit was confirmed
      // shouldn't be able to make a real, confirmed visit vanish from
      // "scheduled" and get miscounted as "out of cycle" or push confirmed
      // above scheduled.
      const confirmedDays = visitors.flatMap(v => confirmedVisitsForSite(site, v.managerKey, v.personLabel))
        .map(c => slotToAbsDay(c.scheduledSlot))
        .filter(d => d !== null);
      const allDays = Array.from(new Set([...scheduledDays, ...managerDays, ...supportDays, ...confirmedDays])).sort((a, b) => a - b);
      return { managerKey: mgrKey, personLabel: person.label, scheduledDays: allDays, visitors };
    }
  }
  return { managerKey: null, personLabel: null, scheduledDays: [], visitors: [] };
}
function absDayToDate(absDay) {
  const weekNum = Math.floor(absDay / 5) + 1;
  const dayIdx = absDay % 5;
  const d = weekStartDate(weekNum);
  d.setDate(d.getDate() + dayIdx);
  return d;
}
// The plan's absDay counts only weekdays (5 per week), so it can't be
// compared against a raw calendar-day difference from YEAR_ANCHOR (which
// includes weekends) — that mismatch was under-counting "today" by however
// many weekends had passed, making genuinely-upcoming visits look like
// they'd already happened. This converts "now" into that same weekday-only
// numbering instead.
function nowAbsDayIndex() {
  const wn = currentWeekNum();
  const ws = weekStartDate(wn);
  const diffDays = Math.floor((new Date() - ws) / 86400000); // 0=Mon..6=Sun within this week
  const dayIdx = Math.min(Math.max(diffDays, 0), 4);
  return absoluteWeekdayIndex(wn, dayIdx);
}
// Converts a picked calendar date back into the plan's weekday-only absDay
// numbering. Returns null for a weekend date — Sat/Sun cells use a separate
// key scheme (slotKeyFor) that doesn't fit this numbering, so a manual
// reschedule can only target a Mon–Fri date.
function dateToAbsDay(date) {
  const diffDays = Math.floor((date - YEAR_ANCHOR) / 86400000);
  const weekNum = Math.floor(diffDays / 7) + 1;
  const ws = weekStartDate(weekNum);
  const dayOfWeek = Math.round((date - ws) / 86400000); // 0=Mon..6=Sun
  if (dayOfWeek < 0 || dayOfWeek > 4) return null;
  return absoluteWeekdayIndex(weekNum, dayOfWeek);
}
function absDayToInputValue(absDay) {
  const d = absDayToDate(absDay);
  return d.toISOString().slice(0, 10);
}
// Converts a CONFIRM_LOG slot key back to the actual calendar date that
// visit was SCHEDULED for — needed because "confirmedAt" only records
// when someone clicked the confirm button, which can genuinely differ
// from the scheduled date (a late confirmation, or someone catching up
// on several weeks of confirmations in one sitting). Using confirmedAt
// alone let "confirmed this month" include visits scheduled in earlier
// months, which is how confirmed could end up exceeding scheduled and
// produce a >100% completion figure.
function slotToDate(slot) {
  const weekendMatch = /^W(\d+)-(SAT|SUN)$/.exec(slot);
  if (weekendMatch) {
    const weekNum = Number(weekendMatch[1]);
    const d = weekStartDate(weekNum);
    d.setDate(d.getDate() + (weekendMatch[2] === 'SAT' ? 5 : 6));
    return d;
  }
  return absDayToDate(Number(slot));
}
function confirmedVisitsForSite(site, managerKey, personLabel) {
  const prefix = managerKey + '|' + personLabel + '|';
  return Object.entries(CONFIRM_LOG)
    .filter(([k]) => k.startsWith(prefix) && k.endsWith('|' + site.name))
    .map(([k, v]) => {
      const slot = k.slice(prefix.length, k.length - ('|' + site.name).length);
      return Object.assign({}, v, { scheduledDate: slotToDate(slot), scheduledSlot: slot });
    });
}
// Converts a slot back to its absDay number for weekday slots (the same
// representation scheduledDays uses) — returns null for weekend override
// slots, which don't have a natural absDay and are a rare edge case.
function slotToAbsDay(slot) {
  return /^W\d+-(SAT|SUN)$/.test(slot) ? null : Number(slot);
}
function currentMonthStart() {
  const now = new Date();
  return new Date(now.getFullYear(), now.getMonth(), 1, 0, 0, 0);
}
function currentMonthEnd() {
  const now = new Date();
  return new Date(now.getFullYear(), now.getMonth() + 1, 0, 23, 59, 59);
}
function isThisMonth(date) {
  const now = new Date();
  return date.getFullYear() === now.getFullYear() && date.getMonth() === now.getMonth();
}
// Bootlegger's fiscal year runs March–February (established elsewhere in
// BOS), so fiscal quarters are Mar–May, Jun–Aug, Sep–Nov, Dec–Feb —
// NOT calendar-year quarters. currentQuarterStart/End give the bounds of
// whichever fiscal quarter today falls in.
function currentQuarterStart() {
  const now = new Date();
  const fiscalMonthIndex = (now.getMonth() + 10) % 12; // shift so March = 0
  const quarterStartMonth = now.getMonth() - (fiscalMonthIndex % 3);
  const d = new Date(now.getFullYear(), quarterStartMonth, 1, 0, 0, 0);
  return d;
}
function currentQuarterEnd() {
  const start = currentQuarterStart();
  return new Date(start.getFullYear(), start.getMonth() + 3, 0, 23, 59, 59);
}
function isThisQuarter(date) {
  const start = currentQuarterStart(), end = currentQuarterEnd();
  return date >= start && date <= end;
}
// A café is "at risk" if it has NOT been confirmed-visited this month AND
// has no scheduled visit remaining this month to still get it done.
// Deliberately anchored to actual monthly confirmation status (not a
// forward-looking cadence check) — a café with a confirmed visit already
// this month is on track regardless of when its NEXT visit is scheduled,
// and a café with zero confirmed visits is at risk even if a future visit
// is scheduled next month, since that doesn't help this month's cycle.
function isAtRisk(confirmedThisMonthCount, remainingScheduledThisMonthCount) {
  return confirmedThisMonthCount === 0 && remainingScheduledThisMonthCount === 0;
}
// A non-outlying café should get a scheduled visit every single month —
// if it has ZERO scheduled days for the current period at all (not just
// "hasn't happened yet", genuinely never put on the schedule), that's a
// deeper problem than "at risk" and gets flagged distinctly. Outlying
// cafés run a longer (~6 week) cadence, so a zero-scheduled month is
// sometimes expected for them and never counts as out of cycle.
function isOutOfCycle(site, scheduledThisPeriodCount) {
  if (site.outlying) return false;
  return scheduledThisPeriodCount === 0;
}

function fsmOptionsFor(managerFilter) {
  const keys = managerFilter ? [managerFilter] : Object.keys(REGION_GROUPS);
  const opts = [];
  keys.forEach(mk => {
    ROSTER[mk].forEach(p => opts.push({ value: mk + '|' + p.label, label: mk + ' · ' + displayLabel(mk, p.label) }));
    (SUPPORT_TEAM_PLANS[mk] || []).forEach(p => opts.push({ value: mk + '|' + p.label, label: mk + ' · ' + p.label + ' (Support)' }));
    (VIRTUAL_ROSTER_ROWS[mk] || []).forEach(p => opts.push({ value: mk + '|' + p.label, label: mk + ' · ' + p.label + ' (New café support)' }));
  });
  // Real names first, anonymous FSM-N placeholders last — makes an actual
  // person ("filter Charlene and see her cafés only") easy to find instead
  // of buried among unrenamed slots.
  opts.sort((a, b) => {
    const aAnon = /^FSM \d+$/.test(a.label.split(' · ')[1]);
    const bAnon = /^FSM \d+$/.test(b.label.split(' · ')[1]);
    if (aAnon !== bAnon) return aAnon ? 1 : -1;
    return a.label.localeCompare(b.label);
  });
  return opts;
}

        <option value="">All Regions</option>
        <option value="Franlo" ${DIR_FILTER_MANAGER==='Franlo'?'selected':''}>Franlo's Team (WC/EC/Namibia)</option>
        <option value="Tarryn" ${DIR_FILTER_MANAGER==='Tarryn'?'selected':''}>Tarryn's Team (GP/LP/MP/FS/KZN/NC/NW)</option>
      </select>
      <select id="dirFsmFilter"><option value="">All Support Members</option></select>
      <select id="dirStatusFilter">
        <option value="">All Statuses</option>
        <option value="ontrack" ${DIR_STATUS_FILTER==='ontrack'?'selected':''}>On Track</option>
        <option value="atrisk" ${DIR_STATUS_FILTER==='atrisk'?'selected':''}>At Risk</option>
        <option value="outofcycle" ${DIR_STATUS_FILTER==='outofcycle'?'selected':''}>Out of Cycle (monthly missed visit)</option>
      </select>
      <input type="text" id="dirSearch" placeholder="Search café..." value="${DIR_SEARCH.replace(/"/g,'&quot;')}">
      <select id="dirCafeSelect" style="min-width:220px;">
        <option value="">— Jump to a café —</option>
        ${allSiteNames.map(s => `<option value="${s.id}" ${String(DIR_EXPANDED)===String(s.id)?'selected':''}>${s.name}</option>`).join('')}
      </select>
    </div>
    <div class="card" style="padding:0;">
      <table class="data-table">
        <thead><tr><th>Café</th><th>Region</th><th>Support Member</th><th>Scheduled (${DIR_PERIOD==='quarter'?'this quarter':'this month'})</th><th>Confirmed / Actual</th><th>Next Visit</th><th>Status</th></tr></thead>
        <tbody id="dirTableBody"></tbody>
      </table>
    </div>
  `;
  function refreshFsmOptions() {
    const sel = document.getElementById('dirFsmFilter');
    const opts = fsmOptionsFor(DIR_FILTER_MANAGER);
    sel.innerHTML = `<option value="">All Support Members</option>` + opts.map(o => `<option value="${o.value}" ${DIR_FILTER_FSM===o.value?'selected':''}>${o.label}</option>`).join('');
  }
  refreshFsmOptions();
  document.getElementById('dirMgrFilter').addEventListener('change', (e) => { DIR_FILTER_MANAGER = e.target.value; DIR_FILTER_FSM = ''; refreshFsmOptions(); renderDirTable(); });
  document.querySelectorAll('#dirPeriodToggle .segmented-btn').forEach(btn => btn.addEventListener('click', () => {
    DIR_PERIOD = btn.dataset.period;
    renderDirectoryTab();
  }));
  document.getElementById('dirExportPdfBtn').addEventListener('click', () => {
    const kpiHtml = document.getElementById('dirKpiStrip').outerHTML;
    const combinedHtml = document.getElementById('dirCombinedRegion').outerHTML;
    const periodLabel = DIR_PERIOD === 'quarter' ? `This Quarter (${qLabel})` : 'This Month';
    const filterLabel = DIR_FILTER_MANAGER ? (DIR_FILTER_MANAGER === 'Franlo' ? "Franlo's Team" : "Tarryn's Team") : 'All Regions';
    exportToPdf('Café Directory — Summary', `${periodLabel} · ${filterLabel}`, kpiHtml + combinedHtml);
  });
  document.getElementById('dirFsmFilter').addEventListener('change', (e) => { DIR_FILTER_FSM = e.target.value; renderDirTable(); });
  document.getElementById('dirStatusFilter').addEventListener('change', (e) => { DIR_STATUS_FILTER = e.target.value; renderDirTable(); });
  document.getElementById('dirSearch').addEventListener('input', (e) => { DIR_SEARCH = e.target.value; renderDirTable(); });
  document.getElementById('dirCafeSelect').addEventListener('change', (e) => {
    DIR_EXPANDED = e.target.value || null;
    renderDirTable();
    if (DIR_EXPANDED) {
      const row = document.querySelector('tr[data-site="' + DIR_EXPANDED + '"]');
      if (row) row.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  });
  renderDirTable();
}

function renderDirTable() {
  const tbody = document.getElementById('dirTableBody');
  const q = DIR_SEARCH.trim().toLowerCase();
  let sites = SITES.slice();
  if (DIR_FILTER_MANAGER) sites = sites.filter(s => s.manager === DIR_FILTER_MANAGER);
  if (DIR_FILTER_FSM) {
    const [fmgr, flabel] = DIR_FILTER_FSM.split('|');
    sites = sites.filter(s => {
      const stats = cafeVisitStats(s);
      if (stats.managerKey === fmgr && stats.personLabel === flabel) return true;
      if ((stats.visitors || []).some(v => v.managerKey === fmgr && v.personLabel === flabel)) return true;
      // Covers support-team members AND anyone only present via new-café
      // opening support (a virtual roster row with no rotation plan of
      // its own) — their only link to a café is an OPENING_SUPPORT entry.
      return Object.values(OPENING_SUPPORT).some(dayEntries =>
        (dayEntries || []).some(e => e.managerKey === fmgr && e.personLabel === flabel && e.cafeId === s.id));
    });
  }
  if (q) sites = sites.filter(s => s.name.toLowerCase().includes(q));
  sites.sort((a, b) => a.name.localeCompare(b.name));

  const nowAbsDay = nowAbsDayIndex();
  const periodStart = DIR_PERIOD === 'quarter' ? currentQuarterStart() : currentMonthStart();
  const periodEnd = DIR_PERIOD === 'quarter' ? currentQuarterEnd() : currentMonthEnd();
  const isThisPeriod = DIR_PERIOD === 'quarter' ? isThisQuarter : isThisMonth;

  let kpiScheduled = 0, kpiConfirmed = 0, kpiRescheduled = 0, kpiAtRisk = 0, kpiOutOfCycle = 0;
  const rows = sites.map(site => {
    const stats = cafeVisitStats(site);
    const upcoming = stats.scheduledDays.filter(d => d >= nowAbsDay); // for "Next Visit" — genuinely upcoming, regardless of period
    // Scheduled this period = every day scheduled that falls within the
    // current month/quarter, whether that date has already passed or
    // not — matching "Scheduled = current period" rather than only
    // counting visits still in the future.
    const scheduledThisMonth = stats.scheduledDays.filter(d => { const dt = absDayToDate(d); return dt >= periodStart && dt <= periodEnd; });
    const remainingScheduledThisMonth = scheduledThisMonth.filter(d => d >= nowAbsDay);
    const confirmed = (stats.visitors || []).flatMap(v => confirmedVisitsForSite(site, v.managerKey, v.personLabel));
    const confirmedThisMonth = confirmed.filter(c => isThisPeriod(c.scheduledDate));
    const rescheduledThisMonth = scheduledThisMonth.filter(d => {
      const entries = stats.managerKey ? getCellEntriesByAbsDay(stats.managerKey, stats.personLabel, d, ROSTER[stats.managerKey].find(p=>p.label===stats.personLabel).plan) : [];
      return entries.some(e => e.text === site.name && e.status === 'rescheduled');
    });
    const outOfCycle = isOutOfCycle(site, scheduledThisMonth.length);
    const atRisk = !outOfCycle && isAtRisk(confirmedThisMonth.length, remainingScheduledThisMonth.length);
    kpiScheduled += scheduledThisMonth.length;
    kpiConfirmed += confirmedThisMonth.length;
    kpiRescheduled += rescheduledThisMonth.length;
    if (atRisk) kpiAtRisk++;
    if (outOfCycle) kpiOutOfCycle++;
    const nextDay = upcoming.length ? upcoming[0] : null;
    return { site, stats, scheduledThisMonth, confirmed, confirmedThisMonth, nextDay, atRisk, outOfCycle };
  });

  document.getElementById('dirKpiStrip').innerHTML = `
    <div><div class="card-label">Scheduled (${DIR_PERIOD==='quarter'?'This Quarter':'This Month'})</div><div class="card-value">${kpiScheduled}</div></div>
    <div><div class="card-label">Confirmed (${DIR_PERIOD==='quarter'?'This Quarter':'This Month'})</div><div class="card-value" style="color:var(--green);">${kpiConfirmed}</div></div>
    <div><div class="card-label">Rescheduled (${DIR_PERIOD==='quarter'?'This Quarter':'This Month'})</div><div class="card-value" style="color:var(--amber);">${kpiRescheduled}</div></div>
    <div><div class="card-label">At Risk of Missing Cycle</div><div class="card-value" style="color:var(--red);">${kpiAtRisk}</div></div>
    <div><div class="card-label">Out of Cycle (monthly missed visit)</div><div class="card-value" style="color:#b71c1c;">${kpiOutOfCycle}</div></div>
    <div><div class="card-label">Completion %</div><div class="card-value" style="color:${kpiScheduled ? (kpiConfirmed/kpiScheduled >= 0.8 ? 'var(--green)' : kpiConfirmed/kpiScheduled >= 0.5 ? 'var(--gold)' : 'var(--red)') : 'var(--grey-500)'};">${kpiScheduled ? Math.round((kpiConfirmed/kpiScheduled)*100) + '%' : '—'}</div></div>
  `;

  // Both-regions-combined figure — independent of whatever region/FSM
  // filter is currently applied above, always reflecting the full
  // national picture for the month, per Franlo's request that this sit
  // in the same view as the matrix rather than the weekly tab.
  const combinedFranlo = monthlyStatsFor('Franlo');
  const combinedTarryn = monthlyStatsFor('Tarryn');
  const combinedScheduled = combinedFranlo.scheduled + combinedTarryn.scheduled;
  const combinedConfirmed = combinedFranlo.confirmed + combinedTarryn.confirmed;
  const combinedPct = combinedScheduled ? Math.round((combinedConfirmed / combinedScheduled) * 100) : null;
  document.getElementById('dirCombinedRegion').innerHTML = `
    <div class="card" style="padding:10px 16px;display:flex;align-items:center;gap:16px;border-left:3px solid var(--black);">
      <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--grey-500);">Both Regions Combined — This Month</div>
      <div style="font-size:20px;font-weight:700;color:${combinedPct===null ? 'var(--grey-500)' : combinedPct>=80 ? 'var(--green)' : combinedPct>=50 ? 'var(--gold)' : 'var(--red)'};">${combinedPct===null?'—':combinedPct+'%'}</div>
      <div style="font-size:11px;color:var(--grey-500);">${combinedConfirmed} confirmed of ${combinedScheduled} scheduled (Franlo: ${combinedFranlo.confirmed}/${combinedFranlo.scheduled} · Tarryn: ${combinedTarryn.confirmed}/${combinedTarryn.scheduled})</div>
    </div>`;

  const statusFilteredRows = DIR_STATUS_FILTER
    ? rows.filter(r => DIR_STATUS_FILTER === 'outofcycle' ? r.outOfCycle : DIR_STATUS_FILTER === 'atrisk' ? r.atRisk : (!r.atRisk && !r.outOfCycle))
    : rows;
  tbody.innerHTML = statusFilteredRows.map(({ site, stats, scheduledThisMonth, confirmed, confirmedThisMonth, nextDay, atRisk, outOfCycle }) => {
    const row = `<tr data-site="${site.id}" style="${outOfCycle ? 'background:#ffcdd2;' : atRisk ? 'background:var(--red-bg);' : ''}">
      <td><b>${site.name}</b></td>
      <td>${site.region}${site.outlying ? ' <span class="badge amber" style="margin-left:4px;">outlying</span>' : ''}</td>
      <td>${stats.personLabel ? (stats.managerKey + ' · ' + displayLabel(stats.managerKey, stats.personLabel)) : '—'}</td>
      <td>${scheduledThisMonth.length}</td>
      <td>${confirmedThisMonth.length ? `<span class="badge green">${confirmedThisMonth.length} confirmed</span>` : '<span class="badge grey">0 confirmed</span>'}</td>
      <td>${nextDay !== null ? fmtShort(absDayToDate(nextDay)) : '—'}</td>
      <td>${outOfCycle ? '<span class="badge" style="background:#b71c1c;color:#fff;">OUT OF CYCLE</span>' : atRisk ? '<span class="badge red">AT RISK</span>' : '<span class="badge green">ON TRACK</span>'}</td>
    </tr>`;
    const detailRow = String(DIR_EXPANDED) === String(site.id) ? `<tr><td colspan="7" style="padding:0;background:var(--grey-100);">${buildDirExpandedHtml(site, stats)}</td></tr>` : '';
    return row + detailRow;
  }).join('') || '<tr><td colspan="7" class="empty-state">No cafés match this filter.</td></tr>';

  document.querySelectorAll('#dirTableBody tr[data-site]').forEach(row => {
    row.addEventListener('click', () => {
      DIR_EXPANDED = String(DIR_EXPANDED) === row.dataset.site ? null : row.dataset.site;
      const sel = document.getElementById('dirCafeSelect');
      if (sel) sel.value = DIR_EXPANDED || '';
      renderDirTable();
    });
  });
}

function buildDirExpandedHtml(site, stats) {
  const nowAbsDay = nowAbsDayIndex();
  const confirmed = (stats.visitors || []).flatMap(v => confirmedVisitsForSite(site, v.managerKey, v.personLabel))
    .sort((a, b) => new Date(b.confirmedAt) - new Date(a.confirmedAt));
  const upcoming = stats.scheduledDays.filter(d => d >= nowAbsDay).slice(0, 10);

  // Opening-support days for this café, if it's a new café with an
  // active CPA-linked support schedule — grouped so it reads as "who's
  // covering which week" rather than a flat list of every single day.
  const openingDays = Object.keys(OPENING_SUPPORT)
    .filter(iso => (OPENING_SUPPORT[iso] || []).some(e => e.cafeId === site.id))
    .sort()
    .map(iso => ({ iso, entries: OPENING_SUPPORT[iso].filter(e => e.cafeId === site.id) }));
  const openingSupportHtml = openingDays.length ? `
    <div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--grey-200);">
      <div style="font-size:10px;font-weight:700;color:var(--grey-500);text-transform:uppercase;margin-bottom:8px;">New Café Opening Support Schedule</div>
      <div style="max-height:180px;overflow-y:auto;">
        ${openingDays.map(d => `<div style="font-size:12px;padding:4px 0;border-bottom:1px solid var(--grey-100);display:flex;justify-content:space-between;">
          <span>${fmtDayDate(new Date(d.iso + 'T00:00:00'))}</span>
          <span style="color:var(--grey-500);">${d.entries.map(e => e.personLabel).join(', ')}</span>
        </div>`).join('')}
      </div>
    </div>` : '';

  return `
    <div style="padding:16px 20px;">
      <div class="section-title">${site.name} — Visit History &amp; Schedule</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">
        <div>
          <div style="font-size:10px;font-weight:700;color:var(--grey-500);text-transform:uppercase;margin-bottom:8px;">Confirmed / Actual Visits</div>
          ${confirmed.length ? confirmed.map(c => `<div style="font-size:12px;padding:5px 0;border-bottom:1px solid var(--grey-200);">${new Date(c.confirmedAt).toLocaleDateString('en-ZA')} <span style="color:var(--grey-500);">— by ${c.confirmedBy}</span></div>`).join('') : '<div class="empty-state">No confirmed visits logged yet.</div>'}
        </div>
        <div>
          <div style="font-size:10px;font-weight:700;color:var(--grey-500);text-transform:uppercase;margin-bottom:8px;">Upcoming Scheduled Visits</div>
          ${upcoming.length ? upcoming.map(d => `<div style="font-size:12px;padding:5px 0;border-bottom:1px solid var(--grey-200);">${fmtDayDate(absDayToDate(d))}</div>`).join('') : '<div class="empty-state">Nothing scheduled — check the café is still assigned to a support member.</div>'}
        </div>
      </div>
      ${openingSupportHtml}
      <div style="margin-top:10px;font-size:10px;color:var(--grey-500);">Assigned to: ${stats.managerKey || '—'} team · ${stats.personLabel ? displayLabel(stats.managerKey, stats.personLabel) : '—'} · Zone: ${site.zone} · Franchisee: ${site.franchisee || '—'}</div>
    </div>
  `;
}
</script>
</body>
</html>
