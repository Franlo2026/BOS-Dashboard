<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOS — Support Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap');
:root {
  --gold: #c8ae79; --gold-light: rgba(200,174,121,0.12);
  --black: #1a1a1a; --white: #ffffff;
  --grey-100: #f7f7f7; --grey-200: #ebebeb; --grey-300: #d4d4d4; --grey-500: #999999; --grey-700: #555555;
  --green: #2e7d32; --green-bg: rgba(46,125,50,0.10);
  --amber: #e65100; --amber-bg: rgba(230,81,0,0.10);
  --red: #c62828; --red-bg: rgba(198,40,40,0.10);
  --teal: #0e7c86; --teal-bg: rgba(14,124,134,0.10);
  --font: 'Montserrat', Arial, sans-serif;
}
* , *::before, *::after { box-sizing: border-box; margin:0; padding:0; }
body { font-family: var(--font); background: var(--grey-100); color: var(--black); min-height:100vh; }
nav.topnav { background: var(--black); height: 52px; position: sticky; top:0; z-index: 50; display:flex; align-items:center; justify-content:space-between; padding: 0 24px; }
.brand { color: var(--white); font-weight:700; font-size:13px; letter-spacing:0.2em; text-transform:uppercase; white-space:nowrap; }
.topnav a.backlink { color: var(--gold); text-decoration:none; font-size:11px; border:1px solid var(--gold); padding:6px 12px; border-radius:3px; }
.container { max-width: 1280px; margin:0 auto; padding: 28px 24px 60px; }
.page-header { display:flex; align-items:flex-end; justify-content:space-between; border-bottom: 1px solid var(--gold); padding-bottom: 14px; margin-bottom: 24px; flex-wrap:wrap; gap:10px; }
.page-title { font-size:18px; font-weight:700; text-transform:uppercase; letter-spacing:0.03em; }
.page-subtitle { font-size:11px; color:var(--grey-500); text-transform:uppercase; letter-spacing:0.06em; margin-top:4px; }
.period-badge { border:1px solid var(--gold); background:var(--gold-light); color:var(--gold); font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; padding:6px 12px; }
.card { background:var(--white); border:1px solid var(--grey-200); padding:20px 22px; margin-bottom:16px; }
.section-title { font-size:11px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; margin-bottom:14px; }
.segmented { display:flex; border:1px solid var(--grey-200); background:var(--white); margin-bottom:16px; }
.segmented-btn { flex:1; text-align:center; padding:12px 16px; background:var(--white); color:var(--grey-500); border:none; border-right:1px solid var(--grey-200); font-family:var(--font); font-size:11px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; cursor:pointer; }
.segmented-btn:last-child{ border-right:none; }
.segmented-btn.active { background:var(--black); color:var(--gold); }
.segmented-btn:not(.active):hover { color:var(--black); }
.kpi-strip { display:grid; grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); background:var(--white); border:1px solid var(--grey-200); margin-bottom:16px; }
.kpi-strip > div { padding:16px 20px; border-right:1px solid var(--grey-200); }
.kpi-strip > div:last-child{ border-right:none; }
.card-label { font-size:9px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:var(--grey-500); margin-bottom:6px; }
.card-value { font-size:24px; font-weight:700; color:var(--black); }
.card-sub { font-size:10px; color:var(--grey-500); margin-top:4px; text-transform:uppercase; letter-spacing:0.04em; }
.badge { font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; padding:3px 8px; border-radius:2px; }
.badge.green { background:var(--green-bg); color:var(--green); }
.badge.amber { background:var(--amber-bg); color:var(--amber); }
.badge.red { background:var(--red-bg); color:var(--red); }
.badge.grey { background:var(--grey-200); color:var(--grey-700); }
.badge.teal { background:var(--teal-bg); color:var(--teal); }
.badge.gold { background:var(--gold-light); color:#8a7238; }
.btn { display:inline-flex; align-items:center; gap:6px; padding:8px 14px; font-family:var(--font); font-size:11px; font-weight:700; letter-spacing:0.04em; text-transform:uppercase; cursor:pointer; border:none; border-radius:2px; }
.btn-gold { background:var(--gold); color:var(--black); }
.btn-black { background:var(--black); color:var(--gold); }
.btn-outline { background:transparent; color:var(--black); border:1px solid var(--black); }
.btn-mini { padding:5px 10px; font-size:10px; }
.btn:hover{ opacity:0.85; } .btn:disabled{ opacity:0.4; cursor:not-allowed; }
table.data-table { width:100%; border-collapse:collapse; font-size:12px; }
.data-table thead th { font-weight:700; font-size:10px; letter-spacing:0.06em; text-transform:uppercase; padding:8px 10px; border-bottom:1px solid var(--black); text-align:left; color:var(--black); cursor:pointer; user-select:none; }
.data-table tbody td { padding:9px 10px; border-bottom:1px solid var(--grey-200); vertical-align:middle; }
.data-table tbody tr:hover { background: var(--grey-100); cursor:pointer; }
.filter-row { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; align-items:center; }
.filter-row select, .filter-row input { width:auto; min-width:150px; font-family:var(--font); font-size:13px; padding:9px 10px; border:1px solid var(--grey-300); background:var(--white); }
.empty-state { color:var(--grey-500); font-size:12px; padding:24px 0; text-align:center; }
.toast { position:fixed; bottom:24px; right:24px; background:var(--black); color:var(--gold); padding:12px 20px; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; display:none; z-index:100; }

/* week grid */
.week-grid { display:grid; grid-template-columns: 160px repeat(7, 1fr); border:1px solid var(--grey-200); background:var(--white); }
.week-grid-head { display:contents; }
.week-grid-head > div { background:var(--grey-100); font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; padding:10px 8px; border-bottom:1px solid var(--black); color:var(--grey-700); }
.week-grid-head .date-sub { display:block; font-weight:400; color:var(--grey-500); font-size:9px; margin-top:2px; text-transform:none; letter-spacing:0; }
.fsm-row-name { padding:12px 10px; border-top:1px solid var(--grey-200); font-weight:700; font-size:12px; background:var(--grey-100); }
.fsm-row-name .sub { font-weight:400; color:var(--grey-500); font-size:10px; margin-top:2px; }
.fsm-name-edit { cursor:pointer; border-bottom:1px dashed var(--grey-300); }
.fsm-name-edit:hover { color:#8a7238; border-bottom-color:var(--gold); }
.day-cell { border-top:1px solid var(--grey-200); border-left:1px solid var(--grey-200); padding:6px; min-height:64px; vertical-align:top; }
.cafe-chip { background:var(--white); border:1px solid var(--grey-300); border-radius:3px; padding:6px 8px; margin-bottom:5px; font-size:11px; cursor:pointer; position:relative; }
.cafe-chip:hover { border-color:var(--gold); }
.cafe-chip.confirmed { border-left:3px solid var(--green); }
.cafe-chip.rescheduled { border-left:3px solid var(--amber); }
.cafe-chip.franchisee { background:var(--gold-light); border-color:var(--gold); font-weight:700; }
.chip-actions { display:flex; gap:4px; margin-top:6px; flex-wrap:wrap; }
.chip-actions button { flex:1; font-size:9px; padding:4px 5px; border:1px solid var(--grey-300); background:var(--white); cursor:pointer; text-transform:uppercase; letter-spacing:0.02em; font-family:var(--font); font-weight:700; border-radius:2px; }
.chip-actions button:hover { background:var(--grey-100); }
.chip-actions button.confirmBtn { color:var(--green); border-color:var(--green); }
.chip-actions button.rescheduleBtn { color:var(--amber); border-color:var(--amber); }
.chip-actions button.removeBtn { color:var(--red); border-color:var(--red); }
.admin-day-label, .support-day-label { font-size:10px; font-weight:700; text-align:center; padding:8px 2px; }
.admin-day-label { color:var(--gold); }
.support-day-label { color:var(--teal); }
.add-cafe-btn { width:100%; font-size:9.5px; padding:5px; border:1px dashed var(--grey-300); background:transparent; color:var(--grey-500); cursor:pointer; font-family:var(--font); border-radius:2px; }
.add-cafe-btn:hover { border-color:var(--gold); color:var(--black); }
.cafe-search-box { position:relative; }
.cafe-search-results { position:absolute; top:100%; left:0; right:0; background:#fff; border:1px solid var(--grey-300); max-height:160px; overflow-y:auto; z-index:30; box-shadow:0 4px 10px rgba(0,0,0,0.1); }
.cafe-search-results div { padding:7px 9px; font-size:11px; cursor:pointer; border-bottom:1px solid var(--grey-100); }
.cafe-search-results div:hover { background:var(--grey-100); }

@media (max-width: 900px) {
  .week-grid { grid-template-columns: 110px repeat(7, minmax(90px,1fr)); overflow-x:auto; }
  .container { padding: 16px 12px 50px; }
  .kpi-strip { grid-template-columns: repeat(2,1fr); }
}
</style>
</head>

<script>
window.storage = {
  async get(key) {
    const token = localStorage.getItem('bos_token');
    const res = await fetch('/api/storage/' + encodeURIComponent(key), { headers: token ? { 'Authorization': 'Bearer ' + token } : {} });
    if (res.status === 404) return null;
    if (!res.ok) throw new Error('storage get failed: ' + res.status);
    return res.json();
  },
  async set(key, value) {
    const token = localStorage.getItem('bos_token');
    const res = await fetch('/api/storage/' + encodeURIComponent(key), {
      method: 'POST',
      headers: Object.assign({ 'Content-Type': 'application/json' }, token ? { 'Authorization': 'Bearer ' + token } : {}),
      body: JSON.stringify({ value })
    });
    if (!res.ok) throw new Error('storage set failed: ' + res.status);
    return res.json();
  }
};

async function checkBosSession() {
  const token = localStorage.getItem('bos_token');
  if (!token) return null;
  try {
    const res = await fetch('/api/me', { headers: { 'Authorization': 'Bearer ' + token } });
    if (!res.ok) { localStorage.removeItem('bos_token'); return null; }
    return await res.json();
  } catch (e) { return null; }
}

checkBosSession().then(me => {
  if (!me) {
    document.getElementById('gateMsg').textContent = 'Sign in on the main BOS Dashboard first — this page shares that login.';
    document.getElementById('gateLink').style.display = 'block';
    return;
  }
  document.getElementById('bosGate').style.display = 'none';
  document.getElementById('topNav').style.display = 'flex';
  document.getElementById('app').style.display = 'block';
  window.__ME = me;
  startApp();
});

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>{ t.style.display='none'; }, 2600);
}

function chipIdFor(managerKey, personLabel, weekNum, dayIdx, idx) {
  return cellKey(managerKey, personLabel, slotKeyFor(weekNum, dayIdx)) + '::' + idx;
}

// Confirming a visit here should count toward the main BOS Dashboard's
// "Visit Frequency" KPI too, not just live in this tool's own confirmation
// log — that KPI reads from the shared `visits` table (the same one the
// GRIND "+ Log Café Visit" form writes to), so posting a lightweight record
// there is what actually links the two. The café name is all that KPI
// checks (not the fsm field), so this works regardless of whether the
// visitor is a support member or Franlo/Tarryn themselves. A franchisee
// check-in doesn't map to a single café cleanly enough to log this way, so
// only real café visits get posted.
async function logConfirmedVisitToDashboard(managerKey, personLabel, text) {
  if (text.startsWith('🤝')) return; // franchisee check-in, not a café visit
  const token = localStorage.getItem('bos_token');
  if (!token) return;
  try {
    await fetch('/api/visits', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({
        fsm: displayLabel(managerKey, personLabel),
        store: text,
        date: new Date().toISOString().slice(0, 10),
        type: 'Support Visit',
        notes: 'Confirmed via Support Schedule',
        // Still counts toward the Visit Frequency KPI (same store/date is all
        // that calculation checks), but this tag lets the Visit Reports list
        // filter it out — a schedule confirmation isn't a GRIND report, and
        // showing both side by side for the same café/date looked like a
        // duplicate visit even though they're really two different things.
        source: 'scheduler-confirmation',
      })
    });
  } catch (e) { /* best-effort — the local confirmation above already succeeded */ }
}

const MIN_OUTLYING_DAYS = 3;
const ROTATION_HORIZON = 300;

/* ============================================================
   ROTATION ENGINE
   ============================================================ */
function zonePhaseOffset(zoneName, period) {
  let hash = 0;
  for (let i = 0; i < zoneName.length; i++) hash = (hash * 31 + zoneName.charCodeAt(i)) % 100000;
  return hash % period;
}

function buildPlan(storesWithMeta, horizonDays, slotsPerDay) {
  if (!storesWithMeta.length) return Array.from({ length: horizonDays }, () => []);
  const lastVisited = {};
  storesWithMeta.forEach((s, i) => { lastVisited[s.id] = -Math.round((i / storesWithMeta.length) * s.period); });

  const zoneGroups = {};
  storesWithMeta.forEach(s => { if (s.outlying) (zoneGroups[s.zone] = zoneGroups[s.zone] || []).push(s); });
  Object.keys(zoneGroups).forEach(zone => {
    const period = zoneGroups[zone][0].period;
    const offset = -zonePhaseOffset(zone, period);
    zoneGroups[zone].forEach(s => { lastVisited[s.id] = offset; });
  });
  const localStores = storesWithMeta.filter(s => !s.outlying);

  let activeZone = null, zoneActiveDaysCount = 0, zoneVisitedThisTrip = new Set();
  let fillCursor = 0;
  const plan = [];

  for (let day = 0; day < horizonDays; day++) {
    if (day % 5 === 0) { plan.push([]); continue; } // Monday = admin day

    if (!activeZone) {
      for (const zone of Object.keys(zoneGroups)) {
        if (zoneGroups[zone].some(s => day - lastVisited[s.id] >= s.period)) {
          activeZone = zone; zoneActiveDaysCount = 0; zoneVisitedThisTrip = new Set();
          break;
        }
      }
    }

    const chosen = [];
    if (activeZone) {
      for (const s of zoneGroups[activeZone]) {
        if (chosen.length >= slotsPerDay) break;
        if (!zoneVisitedThisTrip.has(s.id)) chosen.push(s);
      }
      let fillerIdx = 0;
      while (chosen.length < slotsPerDay) {
        chosen.push(zoneGroups[activeZone][fillerIdx % zoneGroups[activeZone].length]);
        fillerIdx++;
      }
    } else {
      const eligible = localStores
        .filter(s => day - lastVisited[s.id] >= s.period)
        .sort((a, b) => ((day - lastVisited[b.id]) / b.period) - ((day - lastVisited[a.id]) / a.period));
      if (eligible.length) chosen.push(eligible[0]);
      while (chosen.length < slotsPerDay) {
        const remaining = eligible.filter(s => !chosen.includes(s));
        if (!remaining.length) break;
        const sameZone = remaining.find(s => s.zone && chosen.some(c => c.zone === s.zone));
        chosen.push(sameZone || remaining[0]);
      }
      while (chosen.length < slotsPerDay) {
        let picked = null;
        for (let tries = 0; tries < localStores.length; tries++) {
          const candidate = localStores[fillCursor % localStores.length];
          fillCursor++;
          if (!chosen.includes(candidate)) { picked = candidate; break; }
        }
        if (!picked) break;
        chosen.push(picked);
      }
    }

    chosen.forEach(s => {
      lastVisited[s.id] = day;
      if (activeZone && s.zone === activeZone) zoneVisitedThisTrip.add(s.id);
    });
    plan.push(chosen.map(s => s.name));

    if (activeZone) {
      zoneActiveDaysCount++;
      const allVisited = zoneGroups[activeZone].every(s => zoneVisitedThisTrip.has(s.id));
      // A zone with only one café (e.g. Hermanus, Laguna Mall) is a single
      // day trip, not a multi-day expedition — the 3-day minimum is there
      // to justify travel for a multi-stop cluster like Garden Route, not
      // to pad out a lone, nearby outlying town.
      const minDaysForThisZone = zoneGroups[activeZone].length >= 2 ? MIN_OUTLYING_DAYS : 1;
      if (zoneActiveDaysCount >= minDaysForThisZone && allVisited) activeZone = null;
    }
  }
  return plan;
}

function allocateStores(allStores, personCount) {
  const zoneGroups = {};
  const locals = [];
  allStores.forEach(s => {
    if (s.outlying) (zoneGroups[s.zone] = zoneGroups[s.zone] || []).push(s);
    else locals.push(s);
  });
  const buckets = Array.from({ length: personCount }, () => []);
  const leastLoaded = () => buckets.map((b, i) => ({ i, len: b.length })).sort((a, b) => a.len - b.len)[0].i;
  Object.values(zoneGroups).sort((a, b) => b.length - a.length).forEach(group => {
    buckets[leastLoaded()].push(...group);
  });
  locals.forEach(s => { buckets[leastLoaded()].push(s); });
  return buckets;
}

function franchiseeVisitPlan(managerKey, horizonDays) {
  const group = REGION_GROUPS[managerKey];
  const groupSiteIds = new Set(SITES.filter(s => group.regions.includes(s.region)).map(s => s.id));
  const relevant = FRANCHISEES.filter(f => f.sites.some(id => groupSiteIds.has(id)));
  const plan = Array.from({ length: horizonDays }, () => []);
  relevant.forEach((f, idx) => {
    let nextDue = Math.round((idx / relevant.length) * FRANCHISEE_PERIOD);
    // FRANCHISEE_PERIOD (65) is a multiple of 5, so a phase that lands on a
    // "Monday" (nextDue % 5 === 0) would land there on EVERY cycle forever
    // — adding a multiple of 65 never changes that remainder. Shifting the
    // phase once here (rather than skip-checking each cycle) means this
    // franchisee just permanently lands on Tuesday instead of never being
    // scheduled at all.
    if (nextDue % 5 === 0) nextDue += 1;
    while (nextDue < horizonDays) {
      const siteId = f.sites.find(id => groupSiteIds.has(id));
      const site = SITES.find(s => s.id === siteId);
      plan[nextDue].push('🤝 ' + f.name + ' (at ' + (site ? site.name : '?') + ')');
      nextDue += FRANCHISEE_PERIOD;
    }
  });
  return plan;
}

// Builds each region's roster directly from BOS's real, current
// fsmStores/managers assignments — Sipho Mabaso's row shows exactly his
// real cafés under his real name, from the very first render. This
// replaces the old anonymous "FSM 1..N" load-balanced split entirely,
// which required Franlo to manually rename each bucket to match a real
// person and had no connection to their actual assigned portfolio — that
// mismatch was the root cause of cafés like "Liam Smith" appearing twice
// (once as a renamed anonymous bucket, once as a fallback virtual row,
// since the two systems couldn't recognize each other as the same
// person). With real names as the label from the start, there's nothing
// left to fall out of sync.
async function buildRosterFromFsmStores(){
  const token = localStorage.getItem('bos_token');
  const authHeader = token ? { 'Authorization': 'Bearer ' + token } : {};
  let fsmStoresData = {}, managersData = {};
  try {
    const res = await fetch('/api/reference-data', { headers: authHeader });
    if (res.ok) { const ref = await res.json(); fsmStoresData = ref.fsmStores || {}; managersData = ref.managers || {}; }
  } catch (e) { /* fall through to empty rosters if this fails */ }

  const newRoster = {};
  Object.keys(REGION_GROUPS).forEach(mgrKey => {
    const canonicalMgr = MANAGER_KEY_TO_CANONICAL[mgrKey] || mgrKey;
    const fsmNames = managersData[canonicalMgr] || [];
    newRoster[mgrKey] = fsmNames.map(fsmName => {
      const cafeNames = fsmStoresData[fsmName] || [];
      const sites = cafeNames.map(n => SITES.find(s => s.name === n)).filter(Boolean);
      const withMeta = sites.map(s => ({ id: s.id, name: s.name, zone: s.zone, outlying: s.outlying, period: s.outlying ? CADENCE.outlying : CADENCE.local }));
      return { label: fsmName, sites, plan: buildPlan(withMeta, ROTATION_HORIZON, 2) };
    });
  });
  ROSTER = newRoster;
}

// Franlo/Tarryn's own café visits — every café in their region, flat
// quarterly cadence (not the monthly/6-weekly cadence support/FSM get).
// Deliberately tagged outlying:false for all of them here — a manager's
// quarterly sweep doesn't need the multi-day outlying-trip machinery,
// just a steady round-robin (still zone-paired within a day where two
// due cafés happen to share a zone, since that logic lives in the normal
// "local" branch regardless).
const MANAGER_CAFE_PLANS = {};
Object.keys(REGION_GROUPS).forEach(key => {
  const groupSites = SITES.filter(s => REGION_GROUPS[key].regions.includes(s.region));
  const withMeta = groupSites.map(s => ({ id: s.id, name: s.name, zone: s.zone, outlying: false, period: MANAGER_CAFE_PERIOD }));
  MANAGER_CAFE_PLANS[key] = buildPlan(withMeta, ROTATION_HORIZON, 2);
});
const FRANCHISEE_PLANS = {};
Object.keys(REGION_GROUPS).forEach(key => { FRANCHISEE_PLANS[key] = franchiseeVisitPlan(key, ROTATION_HORIZON); });

// Merges the manager's own quarterly café rotation with their franchisee
// check-in schedule into one array, so the manager's row can use the exact
// same getCellEntries/findNextOpenSlot/getEffectivePlan machinery as every
// other row instead of needing special-cased logic.
const MANAGER_COMBINED_PLANS = {};
Object.keys(REGION_GROUPS).forEach(key => {
  MANAGER_COMBINED_PLANS[key] = MANAGER_CAFE_PLANS[key].map((names, absDay) => names.concat(FRANCHISEE_PLANS[key][absDay] || []));
});

// ---------- Support team visit tier ----------
// A third tier alongside FSM-level (own portfolio, zone/outlying cadence)
// and manager-level (flat quarterly regional sweep): named support staff
// who additionally cover their manager's ENTIRE region on their own
// independent rotation — cadence varies by café rather than being flat,
// since each region has a "core" area visited monthly and everywhere else
// quarterly.
const SUPPORT_MONTHLY_PERIOD = 20;   // ≈ monthly, same value CADENCE.local uses
const SUPPORT_QUARTERLY_PERIOD = 65; // ≈ quarterly, same value MANAGER_CAFE_PERIOD uses
const SUPPORT_TEAM_ROSTER = {
  // Johannes Moloto isn't tied to either region in BOS's own data — placed
  // here to balance support capacity across the two teams. Move him to
  // Franlo's list instead if that's not the right call.
  Tarryn: ['Siphesihle Gwadela', 'Mini Mohale', 'Johannes Moloto'],
  Franlo: ['Aphiwe Mqakayi', 'Addright Chigama'],
};
// Tarryn's support visits Gauteng cafés monthly (region-wide), everything
// else in her region quarterly. Franlo's support visits Cape Town-based
// cafés monthly (by the site's own "city" field — Laguna Mall and Hermanus
// are already tagged city:"Cape Town" in SITES despite being geographically
// outlying, so they're correctly swept up here with no special-casing
// needed), everything else in his region quarterly.
function isSupportMonthlySite(managerKey, site) {
  if (managerKey === 'Tarryn') return site.region === 'Gauteng';
  if (managerKey === 'Franlo') return site.city === 'Cape Town';
  return false;
}
const SUPPORT_TEAM_PLANS = {}; // managerKey -> [{label, sites, subtitle, plan}]
Object.keys(REGION_GROUPS).forEach(key => {
  const groupSites = SITES.filter(s => REGION_GROUPS[key].regions.includes(s.region));
  const monthlyCount = groupSites.filter(s => isSupportMonthlySite(key, s)).length;
  SUPPORT_TEAM_PLANS[key] = (SUPPORT_TEAM_ROSTER[key] || []).map(personName => {
    const withMeta = groupSites.map(s => ({
      id: s.id, name: s.name, zone: s.zone, outlying: false,
      period: isSupportMonthlySite(key, s) ? SUPPORT_MONTHLY_PERIOD : SUPPORT_QUARTERLY_PERIOD,
    }));
    return {
      label: personName,
      sites: groupSites,
      subtitle: `Support — ${monthlyCount} monthly, ${groupSites.length - monthlyCount} quarterly`,
      plan: buildPlan(withMeta, ROTATION_HORIZON, 2),
    };
  });
});
const SUPPORT_TEAM_NAMES = new Set(Object.values(SUPPORT_TEAM_ROSTER).flat());

/* ============================================================
   WEEK / DATE HELPERS
   ============================================================ */
const YEAR_ANCHOR = new Date(2026, 0, 5); // first Monday of 2026 (week 1)
function weekStartDate(weekNum) {
  const d = new Date(YEAR_ANCHOR);
  d.setDate(d.getDate() + (weekNum - 1) * 7);
  return d;
}
function currentWeekNum() {
  const now = new Date();
  const diffDays = Math.round((now - YEAR_ANCHOR) / 86400000);
  return Math.floor(diffDays / 7) + 1;
}
// Same math as currentWeekNum, but for any arbitrary picked date rather
// than "now" — this is what lets the jump-to-date picker land on the
// correct week regardless of how far past or future it is.
function weekNumForDate(date) {
  const diffDays = Math.round((date - YEAR_ANCHOR) / 86400000);
  return Math.floor(diffDays / 7) + 1;
}
function absoluteWeekdayIndex(weekNum, dayIdx) { return (weekNum - 1) * 5 + dayIdx; } // dayIdx 0..4 = Mon..Fri only feeds the plan array
function fmtShort(d) { return d.toLocaleDateString('en-ZA', { day: '2-digit', month: 'short' }); }
function addDays(d, n){ const r = new Date(d); r.setDate(r.getDate() + n); return r; }
function isoOf(d){ return d.toISOString().slice(0, 10); }
function absDayForDate(date){
  const wn = weekNumForDate(date);
  const dayIdx = date.getDay() - 1; // Mon(1)->0 .. Fri(5)->4; caller only passes weekdays
  return absoluteWeekdayIndex(wn, dayIdx);
}

// Currently-known real people not yet tied to any roster row (an FSM
// bucket via NAME_OVERRIDES, or a support-team row) still need a manager
// to file their new-café support entries under. This covers the org
// structure as it stands — extend it if a new person is added.
const KNOWN_PERSON_MANAGER = {
  'Raabia Isaacs': 'Franlo', 'Charlene v Heerden': 'Franlo', 'Liam Smith': 'Franlo',
  'Aphiwe Mqakayi': 'Franlo', 'Addright Chigama': 'Franlo',
  'Sipho Mabaso': 'Tarryn', 'Tshepo Goqo': 'Tarryn',
  'Siphesihle Gwadela': 'Tarryn', 'Mini Mohale': 'Tarryn',
};
// Finds which existing weekly-view row a real name belongs to, so a new
// café's opening-support entry lands "next to their name" on the same row
// they already appear on elsewhere — not a duplicate row.
function findRosterRowForName(realName){
  for (const mk of Object.keys(ROSTER)) {
    if ((ROSTER[mk] || []).some(p => p.label === realName)) return { managerKey: mk, personLabel: realName };
  }
  for (const mk of Object.keys(SUPPORT_TEAM_PLANS)) {
    if ((SUPPORT_TEAM_PLANS[mk] || []).some(p => p.label === realName)) return { managerKey: mk, personLabel: realName };
  }
  for (const key of Object.keys(NAME_OVERRIDES)) {
    if (NAME_OVERRIDES[key] === realName) {
      const [mk, label] = key.split('|');
      return { managerKey: mk, personLabel: label };
    }
  }
  if (KNOWN_PERSON_MANAGER[realName]) return { managerKey: KNOWN_PERSON_MANAGER[realName], personLabel: realName };
  return null; // unresolvable — no safe row to file this under, skip
}

// Auto-populates the New Café Opening Support calendar from each
// pipeline café's CPA dates and its allocated support team (set in New
// Café Ops). Handover through end of Week 1 post-opening: every allocated
// member covers every weekday. Weeks 2-4: one member per week, rotating
// through the allocated list. Entries this function creates are tagged
// `auto:true` so re-running it (whenever allocations or dates change)
// only ever replaces its own prior output — anything added manually via
// the calendar's own "+ Add" form is never touched.
let VIRTUAL_ROSTER_ROWS = {}; // managerKey -> [{label, sites:[], subtitle, plan:[]}] — for people who have new-café support duties but no existing FSM/support row yet
function ensureVirtualRosterRow(managerKey, personLabel){
  const alreadyReal = (ROSTER[managerKey] || []).some(p => p.label === personLabel || NAME_OVERRIDES[managerKey+'|'+p.label] === personLabel)
    || (SUPPORT_TEAM_PLANS[managerKey] || []).some(p => p.label === personLabel);
  if (alreadyReal) return;
  VIRTUAL_ROSTER_ROWS[managerKey] = VIRTUAL_ROSTER_ROWS[managerKey] || [];
  if (VIRTUAL_ROSTER_ROWS[managerKey].some(p => p.label === personLabel)) return;
  VIRTUAL_ROSTER_ROWS[managerKey].push({
    label: personLabel, sites: [], subtitle: 'New café opening support only — not yet on a named FSM slot',
    plan: Array.from({ length: ROTATION_HORIZON }, () => []),
  });
}
async function generateNewCafeSupportEntries(){
  VIRTUAL_ROSTER_ROWS = {};
  Object.keys(OPENING_SUPPORT).forEach(iso => {
    OPENING_SUPPORT[iso] = (OPENING_SUPPORT[iso] || []).filter(e => {
      // Self-heal: drop anything auto-generated, AND anything (regardless
      // of origin) that no longer resolves to a real café — an entry
      // showing "?" instead of a café name is never useful to anyone and
      // usually means a stale record from an earlier version of this
      // generator that keyed cafés differently.
      if (e.auto) return false;
      const resolves = SITES.some(s => s.id === e.cafeId);
      return resolves;
    });
    if (!OPENING_SUPPORT[iso].length) delete OPENING_SUPPORT[iso];
  });
  // Only clear a prior auto-written override key if every entry in it is
  // still purely auto-generated — the moment a user confirms/reschedules
  // one of these chips it's no longer "purely auto" and is left alone, so
  // regeneration never undoes a real interaction.
  NEWCAFE_AUTO_KEYS.forEach(k => {
    const entries = OVERRIDES[k];
    if (entries && entries.every(e => e.source === 'newcafe-auto' && e.status === '')) delete OVERRIDES[k];
  });
  const newAutoKeys = new Set();

  NEWCAFE_STORES.forEach(store => {
    const members = NEWCAFE_ALLOCATIONS[store.name];
    if (!members || !members.length || !store.openDate) return;
    const openDate = new Date(store.openDate + 'T00:00:00');
    if (isNaN(openDate)) return;
    const handoverDate = store.handoverDate ? new Date(store.handoverDate + 'T00:00:00') : addDays(openDate, -7);
    if (isNaN(handoverDate)) return;
    const matchedSite = SITES.find(s => s.name === store.name);
    if (!matchedSite) return; // not resolvable to a real café — never generate a "?" entry
    const cafeId = matchedSite.id;
    const chipText = store.name + ' 🆕';

    function addEntry(date, personName){
      const dow = date.getDay();
      if (dow === 0) return; // Sunday only — Fri and Sat both covered for a new opening
      const resolved = findRosterRowForName(personName);
      if (!resolved) return;
      ensureVirtualRosterRow(resolved.managerKey, resolved.personLabel);
      const iso = isoOf(date);

      // Calendar view (New Café Opening Support tab)
      OPENING_SUPPORT[iso] = OPENING_SUPPORT[iso] || [];
      if (!OPENING_SUPPORT[iso].some(e => e.managerKey===resolved.managerKey && e.personLabel===resolved.personLabel && e.cafeId===cafeId)) {
        OPENING_SUPPORT[iso].push({ managerKey: resolved.managerKey, personLabel: resolved.personLabel, cafeId, auto: true, cafeName: store.name });
      }

      // Weekly view + confirm/reschedule/remove — Saturday needs the
      // grid's own special key format ("W{week}-SAT"), not the plain
      // weekday absDay number, or the chip is written somewhere the
      // weekly view never actually looks.
      const wn = weekNumForDate(date);
      const overrideKey = dow === 6
        ? cellKey(resolved.managerKey, resolved.personLabel, 'W' + wn + '-SAT')
        : cellKey(resolved.managerKey, resolved.personLabel, String(absDayForDate(date)));
      newAutoKeys.add(overrideKey);
      const existing = OVERRIDES[overrideKey] || (dow === 6 ? [] : getCellEntriesByAbsDay(resolved.managerKey, resolved.personLabel, absDayForDate(date), []));
      const already = existing.some(e => e.source === 'newcafe-auto' && e.text === chipText);
      if (!already) {
        OVERRIDES[overrideKey] = existing.concat([{ id: 'newcafe-' + iso + '-' + cafeId, text: chipText, status: '', source: 'newcafe-auto' }]);
      }
    }

    // Period 1 — Handover through end of Week 1 post-opening: everyone allocated, every weekday.
    const week1End = addDays(openDate, 7);
    for (let d = new Date(handoverDate); d <= week1End; d = addDays(d, 1)) {
      members.forEach(m => addEntry(d, m));
    }
    // Period 2 — Weeks 2-4: one allocated member per week, rotating.
    for (let wk = 2; wk <= 4; wk++) {
      const person = members[(wk - 2) % members.length];
      const weekStart = addDays(openDate, 7 * (wk - 1) + 1);
      for (let i = 0; i < 7; i++) addEntry(addDays(weekStart, i), person);
    }
  });

  NEWCAFE_AUTO_KEYS = Array.from(newAutoKeys);
  saveOpeningSupport();
  saveOverrides();
  try { await window.storage.set('newcafe-support-autokeys-v1', JSON.stringify(NEWCAFE_AUTO_KEYS)); } catch (e) {}
}
function fmtDayDate(d) { return d.toLocaleDateString('en-ZA', { weekday: 'short' }).toUpperCase() + ' ' + fmtShort(d); }

/* ============================================================
   PERSISTED STATE (overrides + confirmations)
   ============================================================ */
let OVERRIDES = {};   // cellKey -> [{id, text, status}]   status: '' | 'confirmed' | 'rescheduled'
let CONFIRM_LOG = {}; // visitKey -> { confirmedAt, confirmedBy }
let NAME_OVERRIDES = {}; // "managerKey|FSM label" -> assigned person's name
let NEWCAFE_STORES = [];      // extraStores from New Café Ops (Handover/Opening dates)
let NEWCAFE_ALLOCATIONS = {}; // storeName -> [assigned support member real names]
async function loadState() {
  try { const r = await window.storage.get('support-schedule-overrides-v1'); OVERRIDES = JSON.parse((r && r.value) || '{}'); } catch (e) { OVERRIDES = {}; }
  try { const r = await window.storage.get('support-schedule-confirmations-v1'); CONFIRM_LOG = JSON.parse((r && r.value) || '{}'); } catch (e) { CONFIRM_LOG = {}; }
  try { const r = await window.storage.get('support-schedule-names-v1'); NAME_OVERRIDES = JSON.parse((r && r.value) || '{}'); } catch (e) { NAME_OVERRIDES = {}; }
  try { const r = await window.storage.get('opening-support-schedule-v1'); OPENING_SUPPORT = JSON.parse((r && r.value) || '{}'); } catch (e) { OPENING_SUPPORT = {}; }
  try { const r = await window.storage.get('dashboard-stores-v1'); NEWCAFE_STORES = JSON.parse((r && r.value) || '[]'); } catch (e) { NEWCAFE_STORES = []; }
  try { const r = await window.storage.get('support-allocations-v1'); NEWCAFE_ALLOCATIONS = JSON.parse((r && r.value) || '{}'); } catch (e) { NEWCAFE_ALLOCATIONS = {}; }
  try { const r = await window.storage.get('newcafe-support-autokeys-v1'); NEWCAFE_AUTO_KEYS = JSON.parse((r && r.value) || '[]'); } catch (e) { NEWCAFE_AUTO_KEYS = []; }
  await generateNewCafeSupportEntries();
  await ensureEnabledUsersVisible();
}
// Guards against exactly the "Addright Chigama not visible on Scheduler"
// class of bug: a real person only ever appearing here through a
// NAME_OVERRIDE on an anonymous FSM slot is fragile — if that override
// was never set (or resets), they silently vanish from every scheduler
// view even though they're a genuine, currently-active team member. This
// pulls the same canonical "who's actually active" signal used elsewhere
// (BOS's own trainers list, reflecting real fsmStores/support structure,
// plus published login accounts) and guarantees each one has a visible
// row somewhere — never silently dropped again.
async function ensureEnabledUsersVisible(){
  const token = localStorage.getItem('bos_token');
  const authHeader = token ? { 'Authorization': 'Bearer ' + token } : {};
  let canonicalNames = [];
  let fsmStoreKeys = new Set();
  try {
    const res = await fetch('/api/reference-data', { headers: authHeader });
    if (res.ok) {
      const ref = await res.json();
      canonicalNames = canonicalNames.concat(ref.trainers || []);
      fsmStoreKeys = new Set(Object.keys(ref.fsmStores || {}));
    }
  } catch (e) { /* reference-data unavailable this load — fall through */ }
  try {
    const res = await fetch('/api/storage/' + encodeURIComponent('active-user-roster'), { headers: authHeader });
    if (res.ok) { const r = await res.json(); canonicalNames = canonicalNames.concat(JSON.parse(r.value || '[]')); }
  } catch (e) { /* no roster published yet */ }
  const skip = new Set(['administrator']);
  Array.from(new Set(canonicalNames)).forEach(name => {
    if (!name || skip.has(name.trim().toLowerCase())) return;
    // Anyone who's literally an fsmStores key already has their café
    // portfolio represented (via the anonymous FSM-N bucket split) — they
    // aren't actually invisible, just not labeled with their real name
    // yet. Creating a virtual row for them would duplicate that portfolio
    // under a second identity, which is exactly the bug this is meant to
    // prevent, not cause.
    if (fsmStoreKeys.has(name)) return;
    const resolved = findRosterRowForName(name);
    const mk = resolved ? resolved.managerKey : KNOWN_PERSON_MANAGER[name];
    if (!mk) return; // no reliable way to place someone we don't recognize at all
    ensureVirtualRosterRow(mk, resolved ? resolved.personLabel : name);
  });
}
async function saveOverrides() { try { await window.storage.set('support-schedule-overrides-v1', JSON.stringify(OVERRIDES)); } catch (e) { toast('Could not save — check connection'); } }
async function saveConfirmations() { try { await window.storage.set('support-schedule-confirmations-v1', JSON.stringify(CONFIRM_LOG)); } catch (e) { toast('Could not save — check connection'); } }
async function saveNameOverrides() { try { await window.storage.set('support-schedule-names-v1', JSON.stringify(NAME_OVERRIDES)); } catch (e) { toast('Could not save — check connection'); } }
async function saveOpeningSupport() { try { await window.storage.set('opening-support-schedule-v1', JSON.stringify(OPENING_SUPPORT)); } catch (e) { toast('Could not save — check connection'); } }

function cellKey(managerKey, personLabel, slot) { return managerKey + '|' + personLabel + '|' + slot; }
function visitKey(managerKey, personLabel, slot, cafeName) { return managerKey + '|' + personLabel + '|' + slot + '|' + cafeName; }
// Weekday slots are keyed by their absolute weekday index (a plain number,
// as a string). Weekend slots get their own distinct 'W<week>-SAT'/'-SUN'
// key — dayIdx 5/6 must NEVER be run through absoluteWeekdayIndex, since
// (week-1)*5+6 mathematically collides with the following week's Tuesday
// slot ((week)*5+1) — a Sunday override would silently corrupt next week's
// Tuesday schedule.
function slotKeyFor(weekNum, dayIdx) {
  if (dayIdx === 5) return 'W' + weekNum + '-SAT';
  if (dayIdx === 6) return 'W' + weekNum + '-SUN';
  return String(absoluteWeekdayIndex(weekNum, dayIdx));
}

function getCellEntries(managerKey, personLabel, dayIdx, weekNum, planArr) {
  const slot = slotKeyFor(weekNum, dayIdx);
  const k = cellKey(managerKey, personLabel, slot);
  if (OVERRIDES[k] !== undefined) return OVERRIDES[k];
  if (dayIdx >= 5) return []; // Sat/Sun manual-only, no auto-plan fallback
  const absDay = absoluteWeekdayIndex(weekNum, dayIdx);
  const names = planArr[absDay] || [];
  return names.map((n, i) => ({ id: 'auto' + i, text: n, status: '' }));
}
function getCellEntriesByAbsDay(managerKey, personLabel, absDay, planArr) {
  const k = cellKey(managerKey, personLabel, String(absDay));
  if (OVERRIDES[k] !== undefined) return OVERRIDES[k];
  const names = planArr[absDay] || [];
  return names.map((n, i) => ({ id: 'auto' + i, text: n, status: '' }));
}
function setCellEntries(managerKey, personLabel, dayIdx, weekNum, entries) {
  const slot = slotKeyFor(weekNum, dayIdx);
  OVERRIDES[cellKey(managerKey, personLabel, slot)] = entries;
  saveOverrides();
}
function setCellEntriesByAbsDay(managerKey, personLabel, absDay, entries) {
  OVERRIDES[cellKey(managerKey, personLabel, String(absDay))] = entries;
  saveOverrides();
}

// Scans forward from the day after the given one for the next weekday
// (skipping Mondays, which are always admin-only) where this person has
// fewer than 2 cafés already scheduled — that's where a rescheduled visit
// actually lands, rather than just being labeled "rescheduled" in place.
function findNextOpenSlot(managerKey, personLabel, planArr, fromAbsDay) {
  // The rotation engine deliberately never leaves a working day under-full
  // (every non-Monday day is packed to 2 cafés already), so a day with
  // genuinely spare room is the exception, not the rule. Look for one over
  // the next couple of weeks; if there isn't one, just use the very next
  // working day as an extra (3rd) stop rather than reporting failure —
  // a real reschedule usually does mean "tack it onto a day I'm already
  // going to be working," even if that makes it a slightly fuller day.
  let fallback = null;
  for (let absDay = fromAbsDay + 1; absDay < fromAbsDay + 15; absDay++) {
    if (absDay % 5 === 0) continue; // Monday admin day
    if (fallback === null) fallback = absDay;
    const entries = getCellEntriesByAbsDay(managerKey, personLabel, absDay, planArr);
    if (entries.length < 2) return absDay;
  }
  return fallback;
}

// Merges persisted overrides into the raw deterministic plan, so the Café
// Directory (and anything else counting "scheduled visits") reflects actual
// reschedules/additions/removals instead of just the untouched rotation.
function getEffectivePlan(managerKey, personLabel, planArr) {
  const effective = planArr.map(names => names.slice());
  const prefix = managerKey + '|' + personLabel + '|';
  Object.keys(OVERRIDES).forEach(k => {
    if (!k.startsWith(prefix)) return;
    const absDay = parseInt(k.slice(prefix.length), 10);
    if (isNaN(absDay) || absDay % 5 === 0) return; // Sat/Sun overrides don't feed the weekday plan array
    effective[absDay] = OVERRIDES[k].map(e => e.text);
  });
  return effective;
}

   APP STATE
   ============================================================ */
let ACTIVE_TAB = 'weekly';
let ACTIVE_MANAGER = 'Franlo';
let VIEW_WEEK = currentWeekNum();
let OPEN_CHIP = null; // cellKey+index of the chip whose actions are expanded
let RESCHEDULE_CHIP = null; // cellKey+index currently showing the reschedule date picker
let DIR_FILTER_MANAGER = '';
let DIR_FILTER_FSM = '';
let DIR_SEARCH = '';
let DIR_EXPANDED = null;
let OS_REGION = 'all'; // 'all' | 'Franlo' | 'Tarryn'
let OS_MONTH = new Date().getMonth();
let OS_YEAR = new Date().getFullYear();
let OPENING_SUPPORT = {}; // dateISO -> [{managerKey, personLabel, cafeId, notes}]

function startApp() {
  buildRosterFromFsmStores().then(() => loadState().then(render));
}

function render() {
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="page-header">
      <div><div class="page-title">Support Schedule</div><div class="page-subtitle">Regional support team rosters &amp; café coverage</div></div>
      <div class="period-badge">${window.__ME.displayName || window.__ME.username}</div>
    </div>
    <div class="segmented" id="mainTabs">

      <button class="segmented-btn ${ACTIVE_TAB==='directory'?'active':''}" data-tab="directory">Café Directory</button>
      <button class="segmented-btn ${ACTIVE_TAB==='franchisees'?'active':''}" data-tab="franchisees">Franchisee Directory</button>
    </div>
    <div id="tabBody"></div>
  `;
  document.querySelectorAll('#mainTabs .segmented-btn').forEach(b => b.addEventListener('click', () => { ACTIVE_TAB = b.dataset.tab; render(); }));
  if (ACTIVE_TAB === 'weekly') renderWeeklyTab();
  else if (ACTIVE_TAB === 'opening') renderOpeningSupportTab();
  else if (ACTIVE_TAB === 'franchisees') renderFranchiseeTab();
  else renderDirectoryTab();
}

/* ============================================================
   NEW CAFÉ OPENING SUPPORT TAB
   Month view, split by Franlo's / Tarryn's region, full support team
   (reuses the same ROSTER/NAME_OVERRIDES as Weekly Schedule), with a
   café picker per assignment. Persisted separately from the weekly
   rotation so it doesn't interfere with the normal route plan.
   ============================================================ */
function osMonthLabel() { return new Date(OS_YEAR, OS_MONTH, 1).toLocaleString('en-GB', { month: 'long', year: 'numeric' }); }
function osDaysInMonth() { return new Date(OS_YEAR, OS_MONTH + 1, 0).getDate(); }
function osDateISO(day) { return `${OS_YEAR}-${String(OS_MONTH+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`; }
function osFirstWeekday() { const d = new Date(OS_YEAR, OS_MONTH, 1).getDay(); return d === 0 ? 6 : d - 1; } // Mon=0

function osSupportRoster(managerKey) {
  return ROSTER[managerKey].map(p => ({ label: p.label, name: displayLabel(managerKey, p.label) }));
}
// Only cafés currently inside their opening-support window (Handover
// through end of Week 4 post-opening) count as "active" — a café that
// opened months ago shouldn't keep cluttering this view forever.
function activeNewCafeOpenings(){
  const today = new Date(); today.setHours(0,0,0,0);
  return NEWCAFE_STORES.filter(store => {
    if (!store.openDate) return false;
    const openDate = new Date(store.openDate + 'T00:00:00');
    if (isNaN(openDate)) return false;
    const handoverDate = store.handoverDate ? new Date(store.handoverDate + 'T00:00:00') : addDays(openDate, -7);
    const supportEnd = addDays(openDate, 28);
    return today >= handoverDate && today <= supportEnd;
  });
}
// This tab is reserved for people genuinely tied to a live café opening —
// its assigned FSM (from the New Café dashboard) plus whoever's been
// selected as support on that café — not the general FSM/support roster.
function osActiveRosterByManager(){
  const byManager = {};
  Object.keys(REGION_GROUPS).forEach(mk => byManager[mk] = []);
  const seen = {}; // managerKey|name -> true, avoid listing the same person twice
  activeNewCafeOpenings().forEach(store => {
    const people = [];
    if (store.fsm) people.push(store.fsm);
    (NEWCAFE_ALLOCATIONS[store.name] || []).forEach(m => people.push(m));
    people.forEach(name => {
      const resolved = findRosterRowForName(name);
      const mk = resolved ? resolved.managerKey : KNOWN_PERSON_MANAGER[name];
      if (!mk) return;
      const dedupeKey = mk + '|' + name;
      if (seen[dedupeKey]) {
        const existing = byManager[mk].find(e => e.name === name);
        if (existing && !existing.cafes.includes(store.name)) existing.cafes.push(store.name);
        return;
      }
      seen[dedupeKey] = true;
      byManager[mk].push({ name, cafes: [store.name] });
    });
  });
  return byManager;
}
function osSitesFor(managerKey) {
  return SITES.filter(s => REGION_GROUPS[managerKey].regions.includes(s.region)).sort((a,b) => a.name.localeCompare(b.name));
}

    document.getElementById('osCalendarWrap').innerHTML = `

        ${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d => `<div style="background:var(--grey-100);padding:6px;text-align:center;font-size:10px;font-weight:700;color:var(--grey-500);">${d}</div>`).join('')}
        ${cells.map(day => {

          const iso = osDateISO(day);

          return `<div style="background:white;min-height:90px;padding:6px;cursor:pointer;" data-os-day="${day}">
            <div style="font-size:11px;font-weight:700;margin-bottom:4px;">${day}</div>

              const site = SITES.find(s => s.id === e.cafeId);
              const color = e.managerKey === 'Franlo' ? 'var(--gold)' : 'var(--teal, #2a7d7d)';
              return `<div style="font-size:9px;background:rgba(0,0,0,0.05);border-left:2px solid ${color};padding:2px 4px;margin-bottom:2px;display:flex;justify-content:space-between;gap:4px;">
                <span>${displayLabel(e.managerKey, e.personLabel).split(' — ')[1] || e.personLabel} · ${site?site.name:'?'}</span>

  function renderAddForm(day) {

    document.getElementById('osAddFormWrap').innerHTML = `
      <div class="card" style="margin-top:12px;">
        <div class="section-title">Add Opening Support — ${new Date(iso+'T00:00:00').toLocaleDateString('en-GB',{weekday:'long', day:'numeric', month:'long'})}</div>
        <div class="filter-row">
          <select id="osFormRegion">

      document.getElementById('osFormCafe').innerHTML = osSitesFor(mk).map(s => `<option value="${s.id}">${s.name}</option>`).join('');

      const personLabel = document.getElementById('osFormPerson').value;
      const cafeId = document.getElementById('osFormCafe').value;

      OPENING_SUPPORT[iso].push({ managerKey: mk, personLabel, cafeId, notes });
      saveOpeningSupport();
      document.getElementById('osAddFormWrap').innerHTML = '';
      renderCalendar();
      toast('Support assignment added');

  document.getElementById('osPrevMonth').addEventListener('click', () => { OS_MONTH--; if (OS_MONTH < 0) { OS_MONTH = 11; OS_YEAR--; } renderOpeningSupportTab(); });
  document.getElementById('osNextMonth').addEventListener('click', () => { OS_MONTH++; if (OS_MONTH > 11) { OS_MONTH = 0; OS_YEAR++; } renderOpeningSupportTab(); });
  document.getElementById('osRegionFilter').addEventListener('change', (e) => { OS_REGION = e.target.value; renderOpeningSupportTab(); });

  document.querySelectorAll('[data-os-editname]').forEach(el => {
    el.addEventListener('click', () => {
      const [mgrKey, personLabel] = el.dataset.osEditname.split('|');
      const current = NAME_OVERRIDES[mgrKey + '|' + personLabel] || '';
      const wrap = el.parentElement;
      wrap.innerHTML = `<span style="color:var(--grey-500);">${personLabel}:</span> <input type="text" class="fsm-name-input" value="${current.replace(/"/g,'&quot;')}" placeholder="Assign a name..." style="font-size:12px;font-weight:700;width:160px;padding:2px 4px;border:1px solid var(--gold);">`;
      const input = wrap.querySelector('input');
      input.focus(); input.select();
      const commit = () => {
        const val = input.value.trim();
        if (val) NAME_OVERRIDES[mgrKey + '|' + personLabel] = val;
        else delete NAME_OVERRIDES[mgrKey + '|' + personLabel];
        saveNameOverrides();
        renderOpeningSupportTab();
      };
      input.addEventListener('blur', commit);
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') input.blur(); });

  renderCalendar();
}

function renderWeeklyTab() {

  const body = document.getElementById('tabBody');
  const group = REGION_GROUPS[ACTIVE_MANAGER];
  const weekStart = weekStartDate(VIEW_WEEK);
  const days = Array.from({ length: 7 }, (_, i) => { const d = new Date(weekStart); d.setDate(weekStart.getDate() + i); return d; });
  const roster = ROSTER[ACTIVE_MANAGER].concat(SUPPORT_TEAM_PLANS[ACTIVE_MANAGER] || []).concat(VIRTUAL_ROSTER_ROWS[ACTIVE_MANAGER] || []);
  const franchisePlan = MANAGER_COMBINED_PLANS[ACTIVE_MANAGER];

  // Reusable so the same scheduled/confirmed math backs both this region's
  // KPI strip and the always-visible both-regions-combined summary below.
  function weekStatsFor(mgrKey, weekNum){
    const mgrRoster = ROSTER[mgrKey].concat(SUPPORT_TEAM_PLANS[mgrKey] || []).concat(VIRTUAL_ROSTER_ROWS[mgrKey] || []);
    const mgrPlan = MANAGER_COMBINED_PLANS[mgrKey];
    let scheduled = 0, confirmed = 0, rescheduled = 0;
    [{ label: MANAGER_LABEL, plan: mgrPlan }, ...mgrRoster].forEach(person => {
      for (let i = 0; i < 5; i++) {
        getCellEntries(mgrKey, person.label, i, weekNum, person.plan).forEach(e => {
          scheduled++;
          if (e.status === 'confirmed') confirmed++;
          if (e.status === 'rescheduled') rescheduled++;
        });
      }
    });
    return { scheduled, confirmed, rescheduled };
  }

  const thisRegionStats = weekStatsFor(ACTIVE_MANAGER, VIEW_WEEK);
  const scheduledCount = thisRegionStats.scheduled, confirmedCount = thisRegionStats.confirmed, rescheduledCount = thisRegionStats.rescheduled;
  const franloStats = ACTIVE_MANAGER === 'Franlo' ? thisRegionStats : weekStatsFor('Franlo', VIEW_WEEK);
  const tarrynStats = ACTIVE_MANAGER === 'Tarryn' ? thisRegionStats : weekStatsFor('Tarryn', VIEW_WEEK);
  const combinedScheduled = franloStats.scheduled + tarrynStats.scheduled;
  const combinedConfirmed = franloStats.confirmed + tarrynStats.confirmed;
  const combinedPct = combinedScheduled ? Math.round((combinedConfirmed / combinedScheduled) * 100) : null;

  const groupSites = SITES.filter(s => group.regions.includes(s.region));

  body.innerHTML = `
    <div class="card" style="padding:10px 16px;margin-bottom:12px;display:flex;align-items:center;gap:16px;border-left:3px solid var(--black);">
      <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--grey-500);">Both Regions Combined — This Week</div>
      <div style="font-size:20px;font-weight:700;color:${combinedPct===null ? 'var(--grey-500)' : combinedPct>=80 ? 'var(--green)' : combinedPct>=50 ? 'var(--gold)' : 'var(--red)'};">${combinedPct===null?'—':combinedPct+'%'}</div>
      <div style="font-size:11px;color:var(--grey-500);">${combinedConfirmed} confirmed of ${combinedScheduled} scheduled (Franlo: ${franloStats.confirmed}/${franloStats.scheduled} · Tarryn: ${tarrynStats.confirmed}/${tarrynStats.scheduled})</div>
    </div>
    <div class="segmented" id="mgrTabs">
      <button class="segmented-btn ${ACTIVE_MANAGER==='Franlo'?'active':''}" data-mgr="Franlo">Franlo's Team (WC · EC · Namibia)</button>
      <button class="segmented-btn ${ACTIVE_MANAGER==='Tarryn'?'active':''}" data-mgr="Tarryn">Tarryn's Team (GP · LP · MP · FS · KZN · NC · NW)</button>
    </div>
    <div class="kpi-strip">
      <div><div class="card-label">Cafés in Region</div><div class="card-value">${groupSites.length}</div></div>
      <div><div class="card-label">Scheduled This Week</div><div class="card-value">${scheduledCount}</div></div>
      <div><div class="card-label">Confirmed</div><div class="card-value" style="color:var(--green);">${confirmedCount}</div></div>
      <div><div class="card-label">Rescheduled</div><div class="card-value" style="color:var(--amber);">${rescheduledCount}</div></div>
      <div><div class="card-label">Completion %</div><div class="card-value" style="color:${scheduledCount ? (confirmedCount/scheduledCount >= 0.8 ? 'var(--green)' : confirmedCount/scheduledCount >= 0.5 ? 'var(--gold)' : 'var(--red)') : 'var(--grey-500)'};">${scheduledCount ? Math.round((confirmedCount/scheduledCount)*100) + '%' : '—'}</div><div class="card-sub">confirmed vs scheduled this cycle</div></div>
    </div>
    <div class="card" style="padding:0;">
      <div style="display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--grey-200);">
        <div class="section-title" style="margin-bottom:0;">Week ${VIEW_WEEK} · ${fmtShort(days[0])} – ${fmtShort(days[6])}</div>
        <div style="display:flex;gap:8px;align-items:center;">
          <input type="date" id="jumpToDateInput" style="font-size:11px;padding:5px 6px;border:1px solid var(--grey-300);">
          <button class="btn btn-outline btn-mini" id="prevWeekBtn">&larr; Prev</button>
          <button class="btn btn-outline btn-mini" id="thisWeekBtn">This Week</button>
          <button class="btn btn-outline btn-mini" id="nextWeekBtn">Next &rarr;</button>
        </div>
      </div>
      <div style="overflow-x:auto;">
        <div class="week-grid" id="weekGrid"></div>
      </div>
    </div>
    <div style="font-size:10px;color:var(--grey-500);padding:8px 2px;">Local cafés ≈ monthly · outlying ≈ every 6 weeks (minimum 3 consecutive days per outlying trip) · franchisee check-ins ≈ quarterly. Click any café to confirm, reschedule, or remove it. Changes save automatically.</div>
  `;
  document.querySelectorAll('#mgrTabs .segmented-btn').forEach(b => b.addEventListener('click', () => { ACTIVE_MANAGER = b.dataset.mgr; VIEW_WEEK = currentWeekNum(); render(); }));
  document.getElementById('prevWeekBtn').addEventListener('click', () => { VIEW_WEEK--; renderWeeklyTab(); });
  document.getElementById('thisWeekBtn').addEventListener('click', () => { VIEW_WEEK = currentWeekNum(); renderWeeklyTab(); });
  document.getElementById('nextWeekBtn').addEventListener('click', () => { VIEW_WEEK++; renderWeeklyTab(); });
  const jumpInput = document.getElementById('jumpToDateInput');
  jumpInput.value = weekStartDate(VIEW_WEEK).toISOString().slice(0, 10);
  jumpInput.addEventListener('change', () => {
    if (!jumpInput.value) return;
    const picked = new Date(jumpInput.value + 'T00:00:00');
    VIEW_WEEK = weekNumForDate(picked);
    renderWeeklyTab();
  });

  renderWeekGrid(days, roster, franchisePlan, groupSites);
}

const MANAGER_LABEL = '__MANAGER__';
function displayLabel(managerKey, personLabel) {
  if (personLabel === MANAGER_LABEL) return managerKey;
  const name = NAME_OVERRIDES[managerKey + '|' + personLabel];
  return name ? personLabel + ' — ' + name : personLabel;
}

function renderWeekGrid(days, roster, franchisePlan, groupSites) {
  const grid = document.getElementById('weekGrid');
  let html = `<div class="week-grid-head"><div>Support Member</div>`;
  days.forEach((d, i) => {
    html += `<div>${d.toLocaleDateString('en-ZA',{weekday:'short'}).toUpperCase()}<span class="date-sub">${fmtShort(d)}</span></div>`;
  });
  html += `</div>`;

  const franchiseeOptions = FRANCHISEES
    .filter(f => f.sites.some(id => SITES.find(s => s.id === id && REGION_GROUPS[ACTIVE_MANAGER].regions.includes(s.region))))
    .map(f => {
      const siteId = f.sites.find(id => SITES.find(s => s.id === id));
      const site = SITES.find(s => s.id === siteId);
      return '🤝 ' + f.name + ' (at ' + (site ? site.name : '?') + ')';
    });
  const managerAddOptions = groupSites.map(s => s.name).concat(franchiseeOptions);

  html += renderPersonRow(ACTIVE_MANAGER, MANAGER_LABEL, 'Regional Manager — quarterly café visits & franchisee check-ins', franchisePlan, managerAddOptions);
  roster.forEach(person => {
    html += renderPersonRow(ACTIVE_MANAGER, person.label, person.subtitle || (person.sites.length + ' cafés assigned'), person.plan, person.sites.map(s => s.name));
  });

  grid.innerHTML = html;
  wireWeekGridEvents(roster, groupSites, franchisePlan);
  wireFsmNameEditing();
}

function renderPersonRow(managerKey, personLabel, subtitle, planArr, addOptions) {
  const isManager = personLabel === MANAGER_LABEL;
  const isNamedAlready = isManager || SUPPORT_TEAM_NAMES.has(personLabel) || !/^FSM \d+$/.test(personLabel);
  let html = `<div class="fsm-row-name">
      <span class="${isNamedAlready ? '' : 'fsm-name-edit'}" ${isNamedAlready ? '' : `data-editname="${managerKey}|${personLabel}"`}>${displayLabel(managerKey, personLabel)}</span>
      <div class="sub">${subtitle}</div>
    </div>`;
  for (let i = 0; i < 7; i++) {
    const entries = getCellEntries(managerKey, personLabel, i, VIEW_WEEK, planArr);
    const slot = slotKeyFor(VIEW_WEEK, i);
    const ck = cellKey(managerKey, personLabel, slot);
    let cellHtml = '';
    if (entries.length === 0 && i === 0) cellHtml = `<div class="admin-day-label">Admin Day</div>`;
    if (entries.length === 0 && i >= 5) cellHtml = `<div class="support-day-label">Support Day</div>`;
    entries.forEach((e, idx) => {
      const chipId = ck + '::' + idx;
      const isOpen = OPEN_CHIP === chipId;
      const isRescheduling = RESCHEDULE_CHIP === chipId;
      const isFranchiseeEntry = e.text.startsWith('🤝');
      const chipClass = isFranchiseeEntry ? 'cafe-chip franchisee' : ('cafe-chip ' + (e.status || ''));
      let actionsHtml = '';
      if (isRescheduling) {
        const absDayNow = absoluteWeekdayIndex(VIEW_WEEK, i);
        const plan = personLabel === MANAGER_LABEL ? planArr : planArr;
        const suggested = findNextOpenSlot(managerKey, personLabel, planArr, absDayNow);
        const defaultDate = suggested !== null ? absDayToInputValue(suggested) : '';
        actionsHtml = `<div class="chip-actions" style="flex-direction:column;align-items:stretch;">
          <input type="date" class="reschedDateInput" value="${defaultDate}" style="font-size:11px;padding:5px;border:1px solid var(--grey-300);margin-bottom:4px;">
          <div style="display:flex;gap:4px;">
            <button class="rescheduleMoveBtn" data-mgr="${managerKey}" data-person="${personLabel}" data-week="${VIEW_WEEK}" data-dayidx="${i}" data-idx="${idx}" style="flex:1;color:var(--green);border-color:var(--green);">Move</button>
            <button class="rescheduleCancelBtn" style="flex:1;">Cancel</button>
          </div>
        </div>`;
      } else if (isOpen) {
        actionsHtml = `<div class="chip-actions">
          <button class="confirmBtn" data-act="confirm" data-mgr="${managerKey}" data-person="${personLabel}" data-week="${VIEW_WEEK}" data-dayidx="${i}" data-idx="${idx}">Confirm</button>
          <button class="rescheduleBtn" data-act="reschedule" data-mgr="${managerKey}" data-person="${personLabel}" data-week="${VIEW_WEEK}" data-dayidx="${i}" data-idx="${idx}">Reschedule</button>
          <button class="removeBtn" data-act="remove" data-mgr="${managerKey}" data-person="${personLabel}" data-week="${VIEW_WEEK}" data-dayidx="${i}" data-idx="${idx}">Remove</button>
        </div>`;
      }
      cellHtml += `<div class="${chipClass}" data-chip="${chipId}" data-mgr="${managerKey}" data-person="${personLabel}" data-week="${VIEW_WEEK}" data-dayidx="${i}" data-idx="${idx}">
        ${e.text}
        ${e.status==='confirmed' ? '<span class="badge green" style="margin-left:4px;">✓</span>' : ''}
        ${e.status==='rescheduled' ? '<span class="badge amber" style="margin-left:4px;">↻</span>' : ''}
        ${actionsHtml}
      </div>`;
    });
    const addLabel = isManager ? '+ Add Visit' : '+ Add Café';
    cellHtml += `<button class="add-cafe-btn" data-mgr="${managerKey}" data-person="${personLabel}" data-week="${VIEW_WEEK}" data-dayidx="${i}">${addLabel}</button>`;
    html += `<div class="day-cell">${cellHtml}</div>`;
  }
  return html;
}

function wireWeekGridEvents(roster, groupSites, franchisePlan) {
  function planFor(personLabel) {
    return personLabel === MANAGER_LABEL ? franchisePlan : (roster.find(p => p.label === personLabel) || {}).plan;
  }
  document.querySelectorAll('.cafe-chip[data-chip]').forEach(chip => {
    chip.addEventListener('click', (e) => {

      const entries = getCellEntries(mgrKey, personLabel, dayIdx, weekNum, plan).slice();
      const moved = entries[idx];
      entries.splice(idx, 1);
      setCellEntries(mgrKey, personLabel, dayIdx, weekNum, entries);
      const targetEntries = getCellEntriesByAbsDay(mgrKey, personLabel, targetAbsDay, plan).slice();
      targetEntries.push({ id: 'resched' + Date.now(), text: moved.text, status: 'rescheduled' });
      setCellEntriesByAbsDay(mgrKey, personLabel, targetAbsDay, targetEntries);

function franchiseeManagerKey(franchisee) {
  for (const mgrKey of Object.keys(REGION_GROUPS)) {
    if (franchisee.sites.some(id => SITES.find(s => s.id === id && REGION_GROUPS[mgrKey].regions.includes(s.region)))) return mgrKey;
  }
  return null;
}
function franchiseeVisitStats(franchisee) {
  const mgrKey = franchiseeManagerKey(franchisee);
  if (!mgrKey) return { managerKey: null, scheduledDays: [] };
  const plan = getEffectivePlan(mgrKey, MANAGER_LABEL, MANAGER_COMBINED_PLANS[mgrKey]);
  const marker = '🤝 ' + franchisee.name + ' (at ';
  const scheduledDays = [];
  plan.forEach((names, absDay) => { if (names.some(n => n.startsWith(marker))) scheduledDays.push(absDay); });
  return { managerKey: mgrKey, scheduledDays };
}
function confirmedVisitsForFranchisee(franchisee, managerKey) {
  const prefix = managerKey + '|' + MANAGER_LABEL + '|';
  const marker = '🤝 ' + franchisee.name + ' (at ';
  return Object.entries(CONFIRM_LOG)
    .filter(([k]) => k.startsWith(prefix) && k.split('|').slice(3).join('|').startsWith(marker))
    .map(([k, v]) => v);
}
function isFranchiseeAtRisk(upcomingDays, nowAbsDay) {
  if (!upcomingDays.length) return true;
  return (upcomingDays[0] - nowAbsDay) > FRANCHISEE_PERIOD;
}

function renderFrTable() {
  const tbody = document.getElementById('frTableBody');
  const q = FR_SEARCH.trim().toLowerCase();

  if (FR_FILTER_MANAGER) franchisees = franchisees.filter(f => franchiseeManagerKey(f) === FR_FILTER_MANAGER);
  if (q) franchisees = franchisees.filter(f => f.name.toLowerCase().includes(q) || f.sites.some(id => { const s = SITES.find(x => x.id === id); return s && s.name.toLowerCase().includes(q); }));
  franchisees.sort((a, b) => a.name.localeCompare(b.name));

  const nowAbsDay = nowAbsDayIndex();
  const monthEnd = currentMonthEnd();

  let kpiScheduled = 0, kpiConfirmed = 0, kpiRescheduled = 0, kpiAtRisk = 0;
  const rows = franchisees.map(f => {
    const stats = franchiseeVisitStats(f);
    const upcoming = stats.scheduledDays.filter(d => d >= nowAbsDay);
    const scheduledThisMonth = upcoming.filter(d => absDayToDate(d) <= monthEnd);
    const confirmed = confirmedVisitsForFranchisee(f, stats.managerKey);
    const confirmedThisMonth = confirmed.filter(c => isThisMonth(new Date(c.confirmedAt)));
    const rescheduledThisMonth = scheduledThisMonth.filter(d => {
      if (!stats.managerKey) return false;
      const entries = getCellEntriesByAbsDay(stats.managerKey, MANAGER_LABEL, d, MANAGER_COMBINED_PLANS[stats.managerKey]);
      return entries.some(e => e.text.startsWith('🤝 ' + f.name + ' (at ') && e.status === 'rescheduled');
    });
    const atRisk = isFranchiseeAtRisk(upcoming, nowAbsDay);
    kpiScheduled += scheduledThisMonth.length;
    kpiConfirmed += confirmedThisMonth.length;
    kpiRescheduled += rescheduledThisMonth.length;
    if (atRisk) kpiAtRisk++;

      <td>${stats.managerKey || '—'}</td>
      <td>${scheduledThisMonth.length}</td>
      <td>${confirmed.length ? `<span class="badge green">${confirmed.length} confirmed</span>` : '<span class="badge grey">0 confirmed</span>'}</td>
      <td>${nextDay !== null ? fmtShort(absDayToDate(nextDay)) : '—'}</td>
      <td>${atRisk ? '<span class="badge red">AT RISK</span>' : '<span class="badge green">ON TRACK</span>'}</td>
    </tr>`;
    const detailRow = FR_EXPANDED === f.id ? `<tr><td colspan="7" style="padding:0;background:var(--grey-100);">${buildFrExpandedHtml(f, stats)}</td></tr>` : '';
    return row + detailRow;
  }).join('') || '<tr><td colspan="7" class="empty-state">No franchisees match this filter.</td></tr>';

  document.querySelectorAll('#frTableBody tr[data-franchisee]').forEach(row => {
    row.addEventListener('click', () => {
