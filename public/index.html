                <input type="text" id="commentInput_${completeId}" placeholder="Add a note, update, or question..." style="flex:1;">
                <button class="btn btn-outline btn-mini actCommentBtn" data-id="${completeId}" data-ops="${a._isOpsTask?'1':'0'}">Add</button>
              </div>
            </div>
          </div>
          ${a._isOpsTask && a.resolutionComment ? `<div style="margin-top:8px;font-size:10px;color:var(--grey-500);">Resolution note: "${a.resolutionComment}"</div>` : ''}
          ${editLog.length ? `
          <div style="margin-top:8px;">
            <div style="font-size:10.5px;color:var(--grey-500);cursor:pointer;" data-toggle-editlog="${editId}">🕓 ${editLog.length} edit${editLog.length===1?'':'s'} — click to view history</div>
            <div id="editlog_${editId}" style="display:none;margin-top:6px;">
              ${editLog.slice().reverse().map(e => `<div style="font-size:11px;padding:4px 0;border-bottom:1px solid var(--grey-200);"><b>${e.editedBy}</b> <span style="color:var(--grey-500);">· ${new Date(e.editedAt).toLocaleString('en-ZA')}</span><br>Changed <b>${e.field}</b>: "${e.oldValue ?? '—'}" → "${e.newValue ?? '—'}"</div>`).join('')}
            </div>
          </div>` : ''}
        </div>`;
      }).join('') : `<div class="empty-state">${subTab==='completed' ? 'No completed tasks match this filter.' : subTab==='nonconformance' ? 'No non-conformances match this filter.' : 'No open tasks match this filter.'}</div>`;

    document.querySelectorAll('[data-toggle-editlog]').forEach(el => el.addEventListener('click', () => {
      const box = document.getElementById('editlog_' + el.dataset.toggleEditlog);
      box.style.display = box.style.display === 'none' ? 'block' : 'none';
    }));
    wireSendUpdateEmailButtons();
    document.querySelectorAll('.actEditToggleBtn').forEach(btn => btn.addEventListener('click', () => {
      const form = document.getElementById('editForm_' + btn.dataset.id);
      form.style.display = form.style.display === 'none' ? 'block' : 'none';
    }));
    document.querySelectorAll('[id^="editPhoto_"]').forEach(input => input.addEventListener('change', async (e) => {
      const id = input.id.replace('editPhoto_', '');
      const files = Array.from(e.target.files || []);
      if (!files.length) return;
      const grid = document.getElementById('editPhotoGrid_' + id);
      const initial = JSON.parse(grid.dataset.initial || '[]');
      currentEditPhotos(id, initial);
      const MAX = 6;
      const room = Math.max(0, MAX - editPhotoPending[id].length);
      if (files.length > room) toast(`Up to ${MAX} photos per task`);
      for (const file of files.slice(0, room)) {
        try { editPhotoPending[id].push(await resizeImageFileForEdit(file, 1280, 0.7)); }
        catch (err) { toast('Could not read one of those photos'); }
      }
      renderEditPhotoGrid(id);
      e.target.value = '';
    }));
    document.querySelectorAll('.editPhotoRemoveBtn').forEach(btn => btn.addEventListener('click', () => {
      const id = btn.dataset.id;
      const grid = document.getElementById('editPhotoGrid_' + id);
      const initial = JSON.parse(grid.dataset.initial || '[]');
      currentEditPhotos(id, initial);
      editPhotoPending[id].splice(parseInt(btn.dataset.idx, 10), 1);
      renderEditPhotoGrid(id);
    }));
    document.querySelectorAll('.actSaveEditBtn').forEach(btn => btn.addEventListener('click', async () => {
      const id = btn.dataset.id;
      btn.disabled = true;
      try {
        if (btn.dataset.ops === '1') {
          const body = {
            department: document.getElementById('editDept_' + id).value,
            cafe: document.getElementById('editCafe_' + id).value,
            responsiblePerson: document.getElementById('editResp_' + id).value || null,
            submitterName: document.getElementById('editSubmitter_' + id).value,
            comments: document.getElementById('editComments_' + id).value,
          };
          if (Object.prototype.hasOwnProperty.call(editPhotoPending, id)) {
            body.photoUrls = editPhotoPending[id];
          }
          await apiPatch('/api/ops-tasks/' + id, body);
          delete editPhotoPending[id];
          await loadOpsTasksForTracker();
        } else {
          await apiPatch('/api/actions/' + id, {
            store: document.getElementById('editStore_' + id).value,
            fsm: document.getElementById('editFsm_' + id).value,
            pillar: document.getElementById('editPillar_' + id).value,
            owner: document.getElementById('editOwner_' + id).value,
            description: document.getElementById('editDescription_' + id).value,
          });
          await refreshState();
        }
        toast('Task updated');
        render();
      } catch(e) { toast(e.message || 'Could not save changes'); btn.disabled = false; }
    }));

    document.querySelectorAll('.actOpsPhotoThumb').forEach(img => img.addEventListener('click', () => {
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:9999;display:flex;align-items:center;justify-content:center;cursor:zoom-out;';
      overlay.innerHTML = `<img src="${img.dataset.src}" style="max-width:92vw;max-height:92vh;border-radius:6px;">`;
      overlay.addEventListener('click', () => overlay.remove());
      document.body.appendChild(overlay);
    }));
    document.querySelectorAll('.actOpsCompleteBtn').forEach(btn => btn.addEventListener('click', async () => {
      const comment = prompt('Add a comment about how this was resolved (optional):');
      if (comment === null) return; // cancelled
      btn.disabled = true;
      try { await apiPatch('/api/ops-tasks/' + btn.dataset.id + '/complete', { comment: comment.trim() || undefined }); await loadOpsTasksForTracker(); render(); }
      catch(e) { toast(e.message || 'Could not complete task'); btn.disabled = false; }
    }));

    document.querySelectorAll('[data-toggle-comments]').forEach(el => el.addEventListener('click', () => {
      const box = document.getElementById('comments_' + el.dataset.toggleComments);
      box.style.display = box.style.display === 'none' ? 'block' : 'none';
    }));
    document.querySelectorAll('.actCompleteBtn, .actResolveBtn').forEach(btn => btn.addEventListener('click', async () => {
      const comment = prompt('Add a closing comment before marking this task complete:');
      if (comment === null) return; // cancelled
      if (!comment.trim()) { toast('A comment is required to close a task'); return; }
      btn.disabled = true;
      try { await apiPatch('/api/actions/' + btn.dataset.id, { status: 'closed', comment: comment.trim() }); await refreshState(); render(); }
      catch(e) { toast(e.message || 'Could not update — check connection and try again'); btn.disabled = false; }
    }));
    document.querySelectorAll('.actReopenBtn').forEach(btn => btn.addEventListener('click', async () => {
      const comment = prompt('Add a comment explaining why this task is being reopened:');
      if (comment === null) return;
      if (!comment.trim()) { toast('A comment is required to reopen a task'); return; }
      btn.disabled = true;
      try { await apiPatch('/api/actions/' + btn.dataset.id, { status: 'open', comment: comment.trim() }); await refreshState(); render(); }
      catch(e) { toast(e.message || 'Could not reopen — check connection and try again'); btn.disabled = false; }
    }));
    document.querySelectorAll('.actEscalateBtn').forEach(btn => btn.addEventListener('click', async () => {
      const comment = prompt('Why is this being escalated to Franlo / Tarryn?');
      if (comment === null) return;
      if (!comment.trim()) { toast('A comment is required to escalate a task'); return; }
      btn.disabled = true;
      try { await apiPatch('/api/actions/' + btn.dataset.id, { status: 'escalated', comment: comment.trim() }); await refreshState(); render(); toast('Escalated — this no longer counts against overdue, and now needs Franlo/Tarryn to action it.'); }
      catch(e) { toast(e.message || 'Could not escalate — check connection and try again'); btn.disabled = false; }
    }));
    document.querySelectorAll('.actExtendBtn').forEach(btn => btn.addEventListener('click', async () => {
      const newDate = document.getElementById('extendDate_' + btn.dataset.id).value;
      if (!newDate) { toast('Pick a new due date first'); return; }
      btn.disabled = true;
      try {
        if (btn.dataset.ops === '1') {
          await apiPatch('/api/ops-tasks/' + btn.dataset.id, { dueDateOverride: newDate, note: 'Due date updated to ' + newDate });
          await loadOpsTasksForTracker();
        } else {
          await apiPatch('/api/actions/' + btn.dataset.id, { dueDate: newDate, comment: 'Due date updated to ' + newDate });
          await refreshState();
        }
        render();
      }
      catch(e) { toast(e.message || 'Could not update due date'); btn.disabled = false; }
    }));
    document.querySelectorAll('.actCommentBtn').forEach(btn => btn.addEventListener('click', async () => {
      const input = document.getElementById('commentInput_' + btn.dataset.id);
      const text = input.value.trim();
      if (!text) { toast('Write an update before adding it'); return; }
      btn.disabled = true;
      try {
        if (btn.dataset.ops === '1') {
          await apiPatch('/api/ops-tasks/' + btn.dataset.id, { note: text });
          await loadOpsTasksForTracker();
        } else {
          await apiPatch('/api/actions/' + btn.dataset.id, { comment: text });
          await refreshState();
        }
        render();
        setTimeout(() => { const box = document.getElementById('comments_' + btn.dataset.id); if (box) box.style.display = 'block'; }, 0);
      }
      catch(e) { toast(e.message || 'Could not add update'); btn.disabled = false; }
    }));
  }

  function exportCsv(){
    const rows = filteredRows();
    const header = ['Store','FSM','Pillar','Description','Owner','Due Date','Status'];
    const csvRows = rows.map(a => [a.store,a.fsm,a.pillar,a.description,a.owner,a.dueDate,a.status].map(v => `"${String(v||'').replace(/"/g,'""')}"`).join(','));
    const csv = [header.join(','), ...csvRows].join('\n');
    const blob = new Blob([csv], { type:'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (subTab==='completed' ? 'completed-tasks-' : 'open-tasks-') + todayISO() + '.csv';
    a.click();
  }

  document.getElementById('actFsm').addEventListener('change', render);
  document.getElementById('actPillar').addEventListener('change', render);
  document.getElementById('actStatus').addEventListener('change', render);
  document.getElementById('actRegion').addEventListener('change', render);
  document.getElementById('actSearch').addEventListener('input', render);
  wireDateRangeFilter('tasks', render);
  document.querySelectorAll('#taskSubTab .segmented-btn').forEach(btn => btn.addEventListener('click', () => {
    subTab = btn.dataset.sub;
    document.querySelectorAll('#taskSubTab .segmented-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    render();
  }));
  document.getElementById('actClear').addEventListener('click', () => {
    document.getElementById('actFsm').value=''; document.getElementById('actPillar').value='';
    document.getElementById('actStatus').value=''; document.getElementById('actSearch').value='';
    document.getElementById('actRegion').value='';
    setDateRange('tasks', '', '');
    viewActions();
  });
  document.getElementById('actRefresh').addEventListener('click', async () => { await refreshState(); await loadOpsTasksForTracker(); render(); });
  document.getElementById('actExportCsv').addEventListener('click', exportCsv);
  document.getElementById('actExportPdf').addEventListener('click', () => window.print());
  const ncSummaryBtn = document.getElementById('ncSummaryBtn');
  if (ncSummaryBtn) ncSummaryBtn.addEventListener('click', () => {
    // A shorter, aggregate report — just café name and how many
    // non-conformances were logged per café within the current date
    // range, rather than the full detailed list below.
    const ncRows = filteredRows(); // already scoped to non-conformances via the subtab filter
    const byStore = {};
    ncRows.forEach(a => { byStore[a.store] = (byStore[a.store] || 0) + 1; });
    const sortedStores = Object.keys(byStore).sort((a,b) => byStore[b] - byStore[a]);
    const { from, to } = getDateRange('tasks');
    const periodLabel = (from || to) ? `${from || 'earliest'} to ${to || 'today'}` : 'All time';
    const rowsHtml = sortedStores.map(store => `<tr><td style="padding:8px 10px;border-bottom:1px solid #ebebeb;">${store}</td><td style="padding:8px 10px;border-bottom:1px solid #ebebeb;text-align:right;font-weight:700;">${byStore[store]}</td></tr>`).join('');
    document.getElementById('ncSummaryPrintArea').innerHTML = `
      <div style="padding:24px;font-family:Arial,Helvetica,sans-serif;">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;padding-bottom:12px;border-bottom:2px solid #c8ae79;">
          <img src="${BOOTLEGGER_LOGO_DATA_URI}" alt="Bootlegger" style="height:36px;width:auto;">
        </div>
        <div style="font-size:20px;font-weight:700;margin-bottom:2px;">Non-Conformances by Café</div>
        <div style="font-size:12px;color:#666;margin-bottom:16px;">${periodLabel} · ${sortedStores.length} café(s) · ${ncRows.length} total non-conformance(s)</div>
        <table style="width:100%;border-collapse:collapse;font-size:13px;">
          <thead><tr><th style="text-align:left;padding:8px 10px;border-bottom:2px solid #1a1a1a;">Café</th><th style="text-align:right;padding:8px 10px;border-bottom:2px solid #1a1a1a;">Non-Conformances Logged</th></tr></thead>
          <tbody>${rowsHtml || '<tr><td colspan="2" style="padding:12px 10px;color:#999;">No non-conformances logged in this period.</td></tr>'}</tbody>
        </table>
      </div>`;
    // Everything else on this page (logo header, page header, KPI strip,
    // overdue banner, filters/subtabs card) needs hiding for this print —
    // otherwise those would print above the summary too, since only
    // .no-print-tagged elements are hidden automatically.
    const app = document.getElementById('app');
    const siblingsToHide = Array.from(app.children).filter(el => el.id !== 'ncSummaryPrintArea');
    siblingsToHide.forEach(el => el.dataset.ncHidden = el.style.display || 'unset');
    siblingsToHide.forEach(el => el.style.display = 'none');
    document.getElementById('ncSummaryPrintArea').style.display = 'block';
    window.print();
    document.getElementById('ncSummaryPrintArea').style.display = 'none';
    siblingsToHide.forEach(el => { el.style.display = el.dataset.ncHidden === 'unset' ? '' : el.dataset.ncHidden; delete el.dataset.ncHidden; });
  });

  render();
  loadOpsTasksForTracker().then(render);
}

/* ============================================================
   VIEW: LTL AUDITS
   ============================================================ */
function viewLTL(){
  document.getElementById('app').innerHTML = `
    <div class="page-header">
      <div><div class="page-title">LTL Audit Dashboard</div><div class="page-subtitle">Looks, Tastes, Like — Brand Standards Audit</div></div>
      <div class="period-badge">AT-RISK THRESHOLD &lt;85%</div>
    </div>
    <div class="grid-2-1">
      <div class="card">
        <div class="section-title">Per-FSM Average LTL Score</div>
        <div id="ltlAvg"></div>
      </div>
      <div class="card">
        <div class="section-title">Open NCs Aged &gt; 7 Days</div>
        <div id="ltlAging"></div>
      </div>
    </div>
    <div class="section-divider"></div>
    <div class="card" id="ltlRiskCard">
      <div class="section-title">Stores At Risk — Below 85% and Overdue NC</div>
      <div id="ltlRisk"></div>
    </div>
    <div class="section-divider"></div>
    <div class="card" id="ltlUploadCard">
      <div class="section-title">Upload Audit Report</div>
      <div class="wrap-copy" style="margin-bottom:10px;">CSV with columns: fsm, store, date, score, cspi, ncRaised, ncClosed, notes. Header row required.</div>
      <input type="file" id="ltlFileInput" accept=".csv">
      <div id="ltlUploadPreview" style="margin-top:10px;"></div>
      <button class="btn btn-gold" id="ltlUploadBtn" style="margin-top:10px;" disabled>Upload Report</button>
    </div>
    <div class="section-divider"></div>
    <div class="card"><div class="section-title">Audit History</div><div id="ltlHistory"></div></div>
  `;

  let pendingRows = [];

  function parseCsv(text){
    const lines = text.split(/\r?\n/).filter(l => l.trim().length);
    if (!lines.length) return [];
    const header = lines[0].split(',').map(h => h.trim().toLowerCase());
    return lines.slice(1).map(line => {
      const cells = line.split(',').map(c => c.trim());
      const row = {};
      header.forEach((h,i) => row[h] = cells[i] !== undefined ? cells[i] : '');
      return row;
    });
  }

  document.getElementById('ltlFileInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const rows = parseCsv(reader.result);
        const valid = rows.filter(r => r.fsm && r.store && r.date && r.score !== '');
        pendingRows = valid;
        document.getElementById('ltlUploadPreview').innerHTML = valid.length
          ? `<div class="empty-state" style="padding:6px 0;color:var(--green);">${valid.length} row(s) ready to upload (of ${rows.length} in file).</div>
             <table class="data-table"><thead><tr><th>FSM</th><th>Store</th><th>Date</th><th>Score</th></tr></thead>
             <tbody>${valid.slice(0,10).map(r=>`<tr><td>${r.fsm}</td><td>${r.store}</td><td>${r.date}</td><td>${r.score}</td></tr>`).join('')}</tbody></table>
             ${valid.length>10?`<div style="font-size:11px;color:var(--grey-500);">+ ${valid.length-10} more</div>`:''}`
          : '<div class="empty-state" style="color:var(--red);">No valid rows found — check the column headers match fsm, store, date, score.</div>';
        document.getElementById('ltlUploadBtn').disabled = valid.length === 0;
      } catch(err) {
        document.getElementById('ltlUploadPreview').innerHTML = '<div class="empty-state" style="color:var(--red);">Could not read this file as CSV.</div>';
      }
    };
    reader.readAsText(file);
  });

  document.getElementById('ltlUploadBtn').addEventListener('click', async () => {
    const btn = document.getElementById('ltlUploadBtn');
    btn.disabled = true; btn.textContent = 'Uploading...';
    let ok = 0, failed = 0;
    for (const r of pendingRows) {
      try {
        await apiPost('/api/ltl', { fsm:r.fsm, store:r.store, date:r.date, score:Number(r.score), cspi:Number(r.cspi||0), ncRaised:Number(r.ncraised||r.ncRaised||0), ncClosed:Number(r.ncclosed||r.ncClosed||0), notes:r.notes||'' });
        ok++;
      } catch(e) { failed++; }
    }
    await refreshState();
    toast(`Uploaded ${ok} audit(s)${failed?`, ${failed} failed`:''}`);
    viewLTL();
  });

  function renderAll(){
    const avgByFsm = FSM_LIST.map(f => {
      const audits = STATE.ltlAudits.filter(a=>a.fsm===f);
      const avg = audits.length ? audits.reduce((s,a)=>s+Number(a.score),0)/audits.length : null;
      return { f, avg, count: audits.length };
    });
    document.getElementById('ltlAvg').innerHTML = avgByFsm.map(x => `
      <div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--grey-200);font-size:12px;">
        <span>${x.f}</span>
        <span>
          <span class="rag-text ${x.avg===null?'na':(x.avg<85?'red':'green')}">${x.avg===null?'No audits':fmtPct(x.avg,0)+' ('+x.count+')'}</span>
          ${x.avg!==null && x.avg<85 ? '<span class="badge red" style="margin-left:6px;">AT RISK</span>' : ''}
        </span>
      </div>`).join('');

    const aging = STATE.ltlAudits.filter(a => Number(a.ncRaised) > Number(a.ncClosed) && daysAgo(a.date) > 7);
    document.getElementById('ltlAging').innerHTML = aging.length ? `<ul class="flag-list">${aging.map(a=>`<li><span>${a.store} (${a.fsm})</span><span class="rag-text red">${a.ncRaised-a.ncClosed} open, ${daysAgo(a.date)}d</span></li>`).join('')}</ul>` : '<div class="empty-state">No aged NCs.</div>';

    // Stores at risk: latest score < 85 AND has an aged open NC
    const latestByStore = {};
    [...STATE.ltlAudits].sort((a,b)=>a.date.localeCompare(b.date)).forEach(a => { latestByStore[a.store] = a; });
    const agingStores = new Set(aging.map(a=>a.store));
    const atRisk = Object.values(latestByStore).filter(a => Number(a.score) < 85 && agingStores.has(a.store));
    document.getElementById('ltlRisk').innerHTML = atRisk.length ? `
      <table class="data-table">
        <thead><tr><th>Store</th><th>FSM</th><th>Latest Score</th><th>Open NCs</th><th>NC Age</th><th></th></tr></thead>
        <tbody>${atRisk.map(a => {
          const agedEntry = aging.find(x=>x.store===a.store);
          return `<tr>
            <td>${a.store}</td><td>${a.fsm}</td>
            <td class="rag-text red">${fmtPct(Number(a.score),0)}</td>
            <td class="rag-text red">${agedEntry.ncRaised-agedEntry.ncClosed}</td>
            <td>${daysAgo(agedEntry.date)}d</td>
            <td><button class="btn btn-outline btn-mini sendUpdateEmailBtn" data-store="${escapeHtmlVR2(a.store)}" data-subject="BOS LTL Audit Update — ${escapeHtmlVR2(a.store)}" data-body="LTL score is currently ${fmtPct(Number(a.score),0)}, with ${agedEntry.ncRaised-agedEntry.ncClosed} non-conformance(s) still open (${daysAgo(agedEntry.date)} days aged).">✉</button></td>
          </tr>`;
        }).join('')}</tbody>
      </table>` : '<div class="empty-state">No stores currently below 85% with an aged open NC.</div>';
    wireSendUpdateEmailButtons();

    const hist = [...STATE.ltlAudits].sort((a,b)=>b.date.localeCompare(a.date));
    document.getElementById('ltlHistory').innerHTML = hist.length ? `
      <table class="data-table">
        <thead><tr><th>Date</th><th>Store</th><th>FSM</th><th>LTL</th><th>CSPI</th><th>NCs</th></tr></thead>
        <tbody>${hist.map(a => `<tr><td>${a.date}</td><td>${a.store}</td><td>${a.fsm}</td><td class="rag-text ${Number(a.score)<85?'red':'green'}">${a.score}</td><td>${a.cspi}</td><td>${a.ncClosed}/${a.ncRaised} closed</td></tr>`).join('')}</tbody>
      </table>` : '<div class="empty-state">No audits logged yet.</div>';
  }
  renderAll();
}

/* ============================================================

        <button class="btn btn-outline no-print" id="trCopy" style="margin-top:12px;">Copy Wrap-Up</button>
      </div>
    </div>
    <div class="section-divider"></div>
    <div class="card">
      <div class="section-title">Visit Log</div>
      <div class="filter-row">
        <select id="trFilterTrainer"><option value="">All Trainers</option>${DATA.trainers.map(t=>`<option>${t}</option>`).join('')}</select>
        <select id="trFilterFollowup"><option value="">All Follow-Up</option><option value="done">Done</option><option value="return">Return Visit</option><option value="escalate">Escalate</option></select>
      </div>

    </div>
  `;
  let lastWrapup = null;
  function renderHistory(){
    const tf = document.getElementById('trFilterTrainer').value, ff = document.getElementById('trFilterFollowup').value;
    let rows = STATE.trainerVisits.filter(v => (!tf||v.trainer===tf) && (!ff||v.followUp===ff));
    rows.sort((a,b)=>b.date.localeCompare(a.date));
    document.getElementById('trHistory').innerHTML = rows.length ? `
      <table class="data-table">
        <thead><tr><th>Date</th><th>Trainer</th><th>Store</th><th>Duration</th><th>Follow-Up</th></tr></thead>
        <tbody>${rows.map(v => `<tr><td>${v.date}</td><td>${v.trainer}</td><td>${v.store}</td><td>${v.durationMin} min</td><td><span class="badge ${v.followUp==='done'?'green':(v.followUp==='return'?'amber':'red')}">${v.followUp.toUpperCase()}</span></td></tr>`).join('')}</tbody>
      </table>` : '<div class="empty-state">No trainer visits logged yet.</div>';
  }
  document.getElementById('trFilterTrainer').addEventListener('change', renderHistory);
  document.getElementById('trFilterFollowup').addEventListener('change', renderHistory);
  document.getElementById('trSave').addEventListener('click', async () => {
    const v = {
      trainer: document.getElementById('trTrainer').value, store: document.getElementById('trStore').value,
      date: document.getElementById('trDate').value, durationMin: document.getElementById('trDuration').value,
      issuesFound: document.getElementById('trIssues').value, areasCovered: document.getElementById('trAreas').value,
      beforeNotes: document.getElementById('trBefore').value, afterNotes: document.getElementById('trAfter').value,
      followUp: document.getElementById('trFollowup').value
    };
    try {
      await apiPost('/api/trainer-visits', v);
      await refreshState();
      const followUpText = { done:'No further action required.', return:'A return visit has been scheduled to reinforce training.', escalate:'This has been escalated to the store\'s FSM for follow-up.' }[v.followUp];
      lastWrapup = `BOOTLEGGER COFFEE — TRAINER WRAP-UP\n\nStore: ${v.store}\nTrainer: ${v.trainer}\nDate: ${v.date}\nDuration: ${v.durationMin} minutes\n\nIssues Found:\n${v.issuesFound || '—'}\n\nTraining Areas Covered:\n${v.areasCovered || '—'}\n\nBefore: ${v.beforeNotes || '—'}\nAfter: ${v.afterNotes || '—'}\n\nFollow-Up: ${v.followUp.toUpperCase()}\n${followUpText}\n\n— Sent via BOS Dashboard`;
      document.getElementById('trWrapup').textContent = lastWrapup;
      toast('Trainer visit logged');
      renderHistory();
    } catch(e) { toast('Could not save — check connection and try again'); }
  });
  document.getElementById('trCopy').addEventListener('click', () => {
    if (!lastWrapup) { toast('Log a visit first'); return; }
    navigator.clipboard.writeText(lastWrapup).then(()=>toast('Wrap-up copied to clipboard'));
  });
  renderHistory();
}

/* ============================================================
   ADMIN DATA UPLOADS
   Lets an admin refresh Trade/Turnover, LTL, B-Better, Flow &
   Social/Google data from a file, without a code deploy. Data lives
   in /api/storage (same generic KV store used elsewhere in BOS);
   on load, any uploaded override replaces the data baked into this
   page at build time. Until something's been uploaded for a given
   type, BOS just keeps using the embedded data as before.
   ============================================================ */
const UPLOAD_TYPES = [
  { key:'turnover', label:'Trade / Turnover (Silo)', accept:'.csv,.xlsx,.xls', ready:true,
    desc:'One row per store. Columns: store_name, store_type, fsm, is_new_store, sales_mtd, inv_mtd, sales_mtd_py, inv_mtd_py, sales_lastmonth, inv_lastmonth, sales_lastmonth_py, inv_lastmonth_py, sales_fytd, inv_fytd, sales_fytd_py, inv_fytd_py.',
    note:'No live Silo connection yet — Railway needs its own Google Cloud credentials for that, which is a separate setup step. In the meantime, ask Claude: "Pull today\'s Silo trade data in BOS upload format" — it can query Silo directly and hand you a CSV in this exact shape, ready to drop in here.' },
  { key:'ltl', label:'LTL Audits', accept:'.xlsx,.xls', ready:true,
    desc:'The ECAS compliance export, as-is (Customer, Site Type, Site, Audit Type, Audited By, Audit Date, Score %, Risk %, ...).',
    note:'Each row becomes a real audit entry via the same endpoint the LTL tab\'s own upload uses — repeat audits for the same café keep only the most recent one.' },
  { key:'bbetter', label:'B.Better Training', accept:'.xlsx,.xls', ready:true,
    desc:'The Beeline "Groups" export, as-is (Group, Classification, Location kind, Completion %, Members, Avg progress %, FSM, Region, Store Type, ...).',
    note:'Only rows where Classification="Location" and Location kind="SITE" are used — everything else in that export (roles, the network-wide container row) is skipped automatically.' },
  { key:'flow', label:'Flow (Recipe & Cleaning)', accept:'.csv,.xlsx,.xls', ready:true,
    desc:'The KeyTech Flow monthly report, as-is (site_name, shot_count, met_recipe_percent, bean_usage_kg, cleaning_score_percent, ...).',
    note:'This is a single month\'s snapshot, not MTD-vs-previous — whatever was previously "current" automatically becomes "previous month" when a new upload lands, so month-over-month still shows correctly.' },
  { key:'social', label:'Social / Google Places', accept:'.xlsx,.xls', ready:true,
    desc:'The "#1 [Brand]" sheet from the Google ratings export, as-is (Store, Live Page Score, Brand Review Avg.).',
    note:'This export doesn\'t include a review count, only the live star rating and the network brand average — a review-count tracker would need a different source.' },
  { key:'cspi', label:'CSPI (Customer Sentiment)', accept:'.csv,.xlsx,.xls', ready:true,
    desc:'One row per store. Required: store_name, category (all_day or xs_kiosk_petrol), month_label (e.g. "Jul"), score, ytd_score. Optional (updates Google Rating & Mystery Diner KPIs too): cafe_visit, google, mystery_diner, complaints, cafe_visit_ytd, google_ytd, mystery_diner_ytd, complaints_ytd.',
    note:'The source Performance Indicator workbook is multi-tab and too complex to parse in-browser — ask Claude: \"generate this month\'s CSPI report and the BOS upload CSV\" — it runs the cspi-report-bootlegger skill and hands you both the branded report and this flat CSV, including the component columns. Each upload is a single new month\'s snapshot; the 3-month rolling window (shown on Cafe Status) shifts forward automatically, same as Flow.' },
];
const UPLOAD_META = {}; // key -> { uploadedAt, uploadedBy, rows }

function mutateReplace(target, source){
  Object.keys(target).forEach(k => delete target[k]);
  Object.assign(target, source);
}

async function loadDataUploadOverrides(){
  for (const t of UPLOAD_TYPES) {
    try {
      const meta = await apiGet('/api/storage/bos-upload-meta-' + t.key);
      UPLOAD_META[t.key] = JSON.parse(meta.value || 'null');
    } catch (e) { UPLOAD_META[t.key] = null; }
  }
  try {
    if (UPLOAD_META.turnover) {
      const r = await apiGet('/api/storage/bos-upload-data-turnover');
      const parsed = JSON.parse(r.value);
      mutateReplace(TURNOVER_DATA, parsed.TURNOVER_DATA);
      mutateReplace(BRAND_AVGS, parsed.BRAND_AVGS);
    }
  } catch (e) { /* keep embedded data if this fails */ }
  try {
    if (UPLOAD_META.bbetter) {
      const r = await apiGet('/api/storage/bos-upload-data-bbetter');
      mutateReplace(BB_DATA, JSON.parse(r.value));
    }
  } catch (e) { /* keep embedded data if this fails */ }
  try {
    if (UPLOAD_META.social) {
      const r = await apiGet('/api/storage/bos-upload-data-social');
      mutateReplace(GOOGLE_DATA, JSON.parse(r.value));
    }
  } catch (e) { /* keep embedded data if this fails */ }
  try {
    if (UPLOAD_META.flow) {
      const r = await apiGet('/api/storage/bos-upload-data-flow');
      mutateReplace(FLOW_DATA, JSON.parse(r.value));
    }
  } catch (e) { /* keep embedded data if this fails */ }
  try {
    if (UPLOAD_META.cspi) {
      const r = await apiGet('/api/storage/bos-upload-data-cspi');
      mutateReplace(CSPI_DATA, JSON.parse(r.value));
    }
  } catch (e) { /* keep embedded data if this fails */ }
  try {
    if (UPLOAD_META.cspi) {
      const r = await apiGet('/api/storage/bos-upload-data-cspi-components');
      mutateReplace(CSPI_COMPONENTS, JSON.parse(r.value));
    }
  } catch (e) { /* keep embedded data if this fails — e.g. an older upload made before this component breakdown existed */ }
}

function uploadSpi(sales, inv){ return inv ? Math.round((sales/inv)*100)/100 : null; }
function uploadGrowth(cur, py){ return (cur==null || py==null || py===0) ? null : Math.round(((cur-py)/py)*10000)/10000; }

function parseTurnoverUploadRows(rows){
  const TURNOVER_DATA_NEW = {};
  const typeGroups = {};
  rows.forEach(r => {
    const name = String(r.store_name || r.Store || '').trim();
    if (!name) return;
    const num = (v) => (v===''||v==null) ? 0 : Number(v);
    const isNew = String(r.is_new_store||'').toLowerCase() === 'true' || String(r.is_new_store) === '1';
    const d = {
      store_type: String(r.store_type||'Full Store').trim(),
      fsm: String(r.fsm||'').trim(),
      is_new_store: isNew,
      sales_mtd: num(r.sales_mtd), inv_mtd: num(r.inv_mtd),
      sales_mtd_py: num(r.sales_mtd_py), inv_mtd_py: num(r.inv_mtd_py),
      sales_lastmonth: num(r.sales_lastmonth), inv_lastmonth: num(r.inv_lastmonth),
      sales_lastmonth_py: num(r.sales_lastmonth_py), inv_lastmonth_py: num(r.inv_lastmonth_py),
      sales_fytd: num(r.sales_fytd), inv_fytd: num(r.inv_fytd),
      sales_fytd_py: num(r.sales_fytd_py), inv_fytd_py: num(r.inv_fytd_py),
    };
    d.sales_mtd_growth = uploadGrowth(d.sales_mtd, d.sales_mtd_py);
    d.inv_mtd_growth = uploadGrowth(d.inv_mtd, d.inv_mtd_py);
    d.sales_lastmonth_growth = uploadGrowth(d.sales_lastmonth, d.sales_lastmonth_py);
    d.inv_lastmonth_growth = uploadGrowth(d.inv_lastmonth, d.inv_lastmonth_py);
    d.sales_fytd_growth = uploadGrowth(d.sales_fytd, d.sales_fytd_py);
    d.inv_fytd_growth = uploadGrowth(d.inv_fytd, d.inv_fytd_py);
    d.sales_fytd_avg_monthly = Math.round((d.sales_fytd/4)*100)/100;
    d.inv_fytd_avg_monthly = Math.round((d.inv_fytd/4)*10)/10;
    d.spi_mtd = uploadSpi(d.sales_mtd, d.inv_mtd);
    d.spi_mtd_py = uploadSpi(d.sales_mtd_py, d.inv_mtd_py);
    d.spi_mtd_growth = uploadGrowth(d.spi_mtd, d.spi_mtd_py);
    d.spi_lastmonth = uploadSpi(d.sales_lastmonth, d.inv_lastmonth);
    d.spi_lastmonth_py = uploadSpi(d.sales_lastmonth_py, d.inv_lastmonth_py);
    d.spi_lastmonth_growth = uploadGrowth(d.spi_lastmonth, d.spi_lastmonth_py);
    d.spi_fytd = uploadSpi(d.sales_fytd, d.inv_fytd);
    d.spi_fytd_py = uploadSpi(d.sales_fytd_py, d.inv_fytd_py);
    d.spi_fytd_growth = uploadGrowth(d.spi_fytd, d.spi_fytd_py);
    TURNOVER_DATA_NEW[name] = d;
    const g = typeGroups[d.store_type] || (typeGroups[d.store_type] = { sales_mtd:0, inv_mtd:0, sales_lastmonth:0, inv_lastmonth:0, sales_fytd:0, inv_fytd:0, n:0 });
    g.sales_mtd += d.sales_mtd; g.inv_mtd += d.inv_mtd;
    g.sales_lastmonth += d.sales_lastmonth; g.inv_lastmonth += d.inv_lastmonth;
    g.sales_fytd += d.sales_fytd; g.inv_fytd += d.inv_fytd; g.n++;
  });
  const BRAND_AVGS_NEW = {};
  Object.entries(typeGroups).forEach(([st, g]) => {
    if (!g.n) return;
    BRAND_AVGS_NEW[st] = {
      n_stores: g.n,
      sales_mtd: Math.round((g.sales_mtd/g.n)*100)/100, inv_mtd: Math.round((g.inv_mtd/g.n)*10)/10, spi_mtd: uploadSpi(g.sales_mtd, g.inv_mtd),
      sales_lastmonth: Math.round((g.sales_lastmonth/g.n)*100)/100, inv_lastmonth: Math.round((g.inv_lastmonth/g.n)*10)/10, spi_lastmonth: uploadSpi(g.sales_lastmonth, g.inv_lastmonth),
      sales_fytd: Math.round(((g.sales_fytd/g.n)/4)*100)/100, inv_fytd: Math.round(((g.inv_fytd/g.n)/4)*10)/10, spi_fytd: uploadSpi(g.sales_fytd, g.inv_fytd),
    };
  });
  return { TURNOVER_DATA: TURNOVER_DATA_NEW, BRAND_AVGS: BRAND_AVGS_NEW };
}

// The real Beeline export is a "Groups" report — most rows are NOT cafés
// (container rows like "All Locations", role-based groups like "All-Rounder").
// A real per-café row has Classification=='Location' and Location kind=='SITE'.
function parseBBetterUploadRows(rows){
  const BB_DATA_NEW = {};
  rows.forEach(r => {
    if (String(r['Classification']||'').trim() !== 'Location') return;
    if (String(r['Location kind']||'').trim() !== 'SITE') return;
    const name = String(r['Group']||'').trim();
    if (!name) return;
    BB_DATA_NEW[name] = {
      completion: Number(r['Completion %']) || 0,
      members: Number(r['Members']) || 0,
      avgProgress: Number(r['Avg progress %']) || 0,
      fsm: String(r['FSM']||'').trim(),
      region: String(r['Region']||'').trim(),
      storeType: String(r['Store Type']||'').trim(),
    };
  });
  return BB_DATA_NEW;
}

// Some real-world exports (this Google one, and the LTL one) have a blank or
// title row above the actual header row. Scan the first few rows for one
// that contains all of the expected column names, and build objects from
// there instead of assuming row 0 is the header.
function findHeaderRowIndex(aoa, requiredCols){
  for (let i = 0; i < Math.min(aoa.length, 6); i++) {
    const row = (aoa[i]||[]).map(c => String(c==null?'':c).trim());
    if (requiredCols.every(rc => row.includes(rc))) return i;
  }
  return -1;
}
function rowsFromAOA(aoa, requiredCols){
  const headerIdx = findHeaderRowIndex(aoa, requiredCols);
  if (headerIdx === -1) return null;
  const headers = aoa[headerIdx].map(c => String(c==null?'':c).trim());
  return aoa.slice(headerIdx+1)
    .map(row => { const obj = {}; headers.forEach((h,i) => { if (h) obj[h] = row[i]; }); return obj; })
    .filter(o => Object.values(o).some(v => v!=='' && v!=null));
}

// Google/"Social Places" export: Store, Live Page Score, Brand Review Avg. —
// on a sheet named like "#1 <Brand>", with a blank row above the header and
// a network-wide "Bootlegger" summary row to skip. Store names are prefixed
// "Bootlegger " — strip that to match BOS's own store names.
function parseGoogleUploadRows(aoa){
  const rows = rowsFromAOA(aoa, ['Store', 'Live Page Score', 'Brand Review Avg.']);
  if (!rows) return null;
  const GOOGLE_DATA_NEW = {};
  rows.forEach(r => {
    let name = String(r['Store']||'').trim();
    if (!name || name === 'Bootlegger') return; // blank / network-wide row
    name = name.replace(/^Bootlegger\s+/i, '').trim();
    GOOGLE_DATA_NEW[name] = {
      live_score: r['Live Page Score']===''? null : Number(r['Live Page Score']),
      brand_avg: r['Brand Review Avg.']===''? null : Number(r['Brand Review Avg.']),
    };
  });
  return GOOGLE_DATA_NEW;
}

// LTL/ECAS export: Customer, Site Type, Site, Request No., Audit Type,
// Audited By, Step, Audit Date, Score %, Risk %, Process Status, Action —
// again with a title row above the real header. Site names are prefixed
// "Bootlegger " same as above. A store can appear more than once across the
// date range (repeat audits) — keep only the most recent one per store.
// Unlike Trade/B-Better this doesn't replace a static blob; each row becomes
// a real audit record via the same /api/ltl endpoint the manual LTL upload
// already uses, so it shows up in the LTL Audit Dashboard like any other entry.
function parseLTLUploadRows(aoa){
  const rows = rowsFromAOA(aoa, ['Site', 'Score %', 'Audit Date']);
  if (!rows) return null;
  const byStore = {};
  rows.forEach(r => {
    let site = String(r['Site']||'').trim();
    if (!site) return;
    site = site.replace(/^Bootlegger\s+/i, '').trim();
    const dv = r['Audit Date'];
    let dateStr = '';
    if (dv instanceof Date) dateStr = dv.toISOString().slice(0,10);
    else dateStr = String(dv||'').slice(0,10);
    const scoreRaw = Number(r['Score %']) || 0;
    const score = scoreRaw <= 1 ? scoreRaw*100 : scoreRaw;
    const riskRaw = Number(r['Risk %']) || 0;
    const risk = riskRaw <= 1 ? riskRaw*100 : riskRaw;
    const existing = byStore[site];
    if (!existing || dateStr > existing.date) {
      byStore[site] = {
        store: site, date: dateStr,
        score: Math.round(score*10)/10, risk: Math.round(risk*10)/10,
        auditor: String(r['Audited By']||''),
      };
    }
  });
  return Object.values(byStore);
}

// KeyTech Flow monthly export: a few metadata rows (period/date range,
// organisation) above the real header, a "Bootlegger " prefix on every site
// name, and a TOTALS row at the bottom to skip. This is a single month's
// snapshot — it doesn't include a "previous month" figure of its own, so
// whatever FLOW_DATA already holds as "current" becomes "previous" as part
// of applying this upload (see handleDataUpload), the same way a new month
// naturally rolls forward.
// The KeyTech Flow export uses its own short names, and — importantly —
// Cafe Status looks Flow data up by STORES.store_name directly (no alias
// resolution there), which isn't always the same target the Trade-data
// resolveAlias() points to (e.g. Trade's "Hoedspruit" alias resolves to
// "Hoedspruit XS", but the café directory's actual store_name is just
// "Hoedspruit"). Kept separate from resolveAlias for that reason.
const FLOW_ALIASES = {
  'Woodlands': 'Woodland Hills', 'Cavendish': 'Cavendish Mall', 'Preller': 'Preller Walk',
  'Winchester Hills': 'Winchester Hill XS', 'TEMSA N12': 'N12 East', 'Windhoek XS': 'FNB',
  'Simmonds Temsa': 'Simmonds', 'Laguna': 'Laguna Mall XS', 'N1 City Value Centre': 'N1 Value Centre (XS)',
  'Mall Of Africa': 'Mall of Africa XS', 'Hoedspruit XS': 'Hoedspruit', 'Durbanville Temsa': 'Durbanville',
  'Plattekloof': 'Plattekloof Village', 'XS Sandkraal': 'Sandkraal XS', 'Paarl TE': 'Paarl Mall',
  'Pineworx': 'PineworX (XS)', 'Middelburg': 'Middleburg XS', 'Thabazimbi TEMSA': 'Thabazimbi',
  'Yellowoods': 'Yellowoods Centre', 'Kimberley': 'Lennox Kimberly',
  'Delta Central': 'Delta Central XS', 'Cape Gate': 'Cape Gate XS', 'Hermanus XS': 'Hermanus Kiosk',
  'Paardevlei': 'Paardevlei XS', 'Clearwater': 'Clearwater Mall XS', 'Westlake': 'Westlake XS',
  'Welgelee Plein': 'Welgelee Plein XS', 'Musgrave': 'Musgrave Centre', 'Steiltes': 'TEMSA Steiltes',
  'Foreshore': 'Foreshore XS', 'Bram Fischer': 'Bram Fischer XS', 'Sunninghill': 'Sunninghill Village XS',
  'Milkwood': 'Milkwood Square Centre',
  // 'Route N4' is a genuine gap — not present anywhere in the café directory
  // (same class of issue as the earlier TEMSA Steiltes / Sea Point High
  // gaps) — left unmapped rather than guessed at.
};
function parseFlowUploadRows(aoa){
  const rows = rowsFromAOA(aoa, ['site_name', 'met_recipe_percent', 'cleaning_score_percent']);
  if (!rows) return null;
  const FLOW_DATA_NEW = {};
  rows.forEach(r => {
    let name = String(r['site_name']||'').trim();
    if (!name || name.toUpperCase() === 'TOTALS') return;
    name = name.replace(/^Bootlegger\s+/i, '').trim();
    if (name === 'Training Centre') return; // internal site, not a café
    name = FLOW_ALIASES[name] || name;
    const recipe = r['met_recipe_percent']===''||r['met_recipe_percent']==null ? null : Number(r['met_recipe_percent'])/100;
    const cleaning = r['cleaning_score_percent']===''||r['cleaning_score_percent']==null ? null : Number(r['cleaning_score_percent'])/100;
    FLOW_DATA_NEW[name] = {
      mtd_recipe: recipe,
      cleaning_score: cleaning,
      shot_count: r['shot_count']===''||r['shot_count']==null ? null : Number(r['shot_count']),
      bean_usage_kg: r['bean_usage_kg']===''||r['bean_usage_kg']==null ? null : Number(r['bean_usage_kg']),
    };
  });
  return FLOW_DATA_NEW;
}

// CSPI is generated from a multi-tab Excel workbook (see the
// cspi-report-bootlegger skill) — too complex to parse reliably in the
// browser. Instead this expects the simple flat CSV Claude produces
// alongside the branded report: store_name, category, month_label, score,
// ytd_score. Each upload is a single new month's snapshot; the rolling
// 3-month window shifts forward the same way Flow's does.
function parseCspiUploadRows(rows){
  const CSPI_DATA_NEW = {};
  const CSPI_COMPONENTS_NEW = {};
  rows.forEach(r => {
    const name = String(r.store_name || r.Store || r.Branch || '').trim();
    if (!name) return;
    const num = (v) => (v===''||v==null) ? null : Number(v);
    const monthLabel = String(r.month_label || r.Month || '').trim() || null;
    const score = num(r.score);
    const ytd = num(r.ytd_score);
    const type = String(r.category || r.type || '').trim() || (CSPI_DATA[name] ? CSPI_DATA[name].type : null);
    const prior = CSPI_DATA[name];
    CSPI_DATA_NEW[name] = {
      m1: prior ? prior.m2 : null, m1_label: prior ? prior.m2_label : null,
      m2: prior ? prior.m3 : null, m2_label: prior ? prior.m3_label : null,
      m3: score, m3_label: monthLabel,
      ytd: ytd,
      type: type,
    };
    // Component breakdown — only added to CSPI_COMPONENTS if the upload
    // actually includes these columns (an older-format upload with just
    // score/ytd_score still updates CSPI_DATA above, just not this).
    const cafeVisit = num(r.cafe_visit); const google = num(r.google); const mysteryDiner = num(r.mystery_diner); const complaints = num(r.complaints);
    const cafeVisitYtd = num(r.cafe_visit_ytd); const googleYtd = num(r.google_ytd); const mysteryDinerYtd = num(r.mystery_diner_ytd); const complaintsYtd = num(r.complaints_ytd);
    if (google !== null || mysteryDiner !== null) {
      CSPI_COMPONENTS_NEW[name] = {
        cafeVisit_jul: cafeVisit, google_jul: google, mysteryDiner_jul: mysteryDiner, complaints_jul: complaints, score_jul: score,
        cafeVisit_ytd: cafeVisitYtd, google_ytd: googleYtd, mysteryDiner_ytd: mysteryDinerYtd, complaints_ytd: complaintsYtd, score_ytd: ytd,
      };
    }
  });
  return { CSPI_DATA: CSPI_DATA_NEW, CSPI_COMPONENTS: CSPI_COMPONENTS_NEW };
}

function readWorkbookRows(file, opts){
  opts = opts || {};
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        if (!window.XLSX) { reject(new Error('Excel reader failed to load — refresh the page and try again')); return; }
        const wb = XLSX.read(new Uint8Array(reader.result), { type:'array', cellDates:true });
        let sheetName = wb.SheetNames[0];
        if (opts.sheetMatch) {
          const found = wb.SheetNames.find(n => n.toLowerCase().includes(opts.sheetMatch.toLowerCase()));
          if (found) sheetName = found;
        }
        const sheet = wb.Sheets[sheetName];
        if (opts.asArray) {
          resolve(XLSX.utils.sheet_to_json(sheet, { header:1, defval:'' }));
        } else {
          resolve(XLSX.utils.sheet_to_json(sheet, { defval:'' }));
        }
      } catch (e) { reject(e); }
    };
    reader.onerror = () => reject(new Error('Could not read that file'));
    reader.readAsArrayBuffer(file);
  });
}

async function handleDataUpload(key, file){
  const meta = { uploadedAt: new Date().toISOString(), uploadedBy: window.__ME ? window.__ME.displayName : ROLE };
  try {
    if (key === 'turnover') {
      const rows = await readWorkbookRows(file);
      if (!rows.length) { toast('No rows found in that file'); return; }
      const parsed = parseTurnoverUploadRows(rows);
      mutateReplace(TURNOVER_DATA, parsed.TURNOVER_DATA);
      mutateReplace(BRAND_AVGS, parsed.BRAND_AVGS);
      await fetch('/api/storage/bos-upload-data-turnover', { method:'POST', headers:Object.assign({'Content-Type':'application/json'}, authHeaders()), body: JSON.stringify({ value: JSON.stringify(parsed) }) });
      meta.rows = Object.keys(parsed.TURNOVER_DATA).length;

    } else if (key === 'bbetter') {
      const rows = await readWorkbookRows(file, { sheetMatch: 'group' });
      if (!rows.length) { toast('No rows found in that file'); return; }
      const parsed = parseBBetterUploadRows(rows);
      if (!Object.keys(parsed).length) { toast('No café-level rows found — expected Classification="Location" and Location kind="SITE" columns from the Beeline Groups report'); return; }
      mutateReplace(BB_DATA, parsed);
      await fetch('/api/storage/bos-upload-data-bbetter', { method:'POST', headers:Object.assign({'Content-Type':'application/json'}, authHeaders()), body: JSON.stringify({ value: JSON.stringify(parsed) }) });
      meta.rows = Object.keys(parsed).length;

    } else if (key === 'social') {
      const aoa = await readWorkbookRows(file, { asArray: true, sheetMatch: '#1' });
      const parsed = parseGoogleUploadRows(aoa);
      if (!parsed) { toast('Could not find the "Store / Live Page Score / Brand Review Avg." header row — is this the "#1 <Brand>" sheet?'); return; }
      mutateReplace(GOOGLE_DATA, parsed);
      await fetch('/api/storage/bos-upload-data-social', { method:'POST', headers:Object.assign({'Content-Type':'application/json'}, authHeaders()), body: JSON.stringify({ value: JSON.stringify(parsed) }) });
      meta.rows = Object.keys(parsed).length;

    } else if (key === 'ltl') {
      const aoa = await readWorkbookRows(file, { asArray: true });
      const parsedRows = parseLTLUploadRows(aoa);
      if (!parsedRows) { toast('Could not find the Site / Score % / Audit Date header row in this file'); return; }
      if (!parsedRows.length) { toast('No audit rows found in that file'); return; }
      let ok = 0, failed = 0;
      for (const r of parsedRows) {
        const fsm = (ALL_STORES.find(s => s.store === r.store) || {}).fsm || '';
        try {
          await apiPost('/api/ltl', { fsm, store: r.store, date: r.date, score: r.score, cspi: 0, ncRaised: 0, ncClosed: 0, notes: r.auditor ? ('Audited by ' + r.auditor) : '' });
          ok++;
        } catch (e) { failed++; }
      }
      await refreshState();
      meta.rows = ok;
      if (failed) meta.notes = failed + ' row(s) failed to save';

    } else if (key === 'flow') {
      const aoa = await readWorkbookRows(file, { asArray: true });
      const parsed = parseFlowUploadRows(aoa);
      if (!parsed) { toast('Could not find the site_name / met_recipe_percent / cleaning_score_percent header row in this file'); return; }
      if (!Object.keys(parsed).length) { toast('No café rows found in that file'); return; }
      // This export is a single month's snapshot with no "previous month"
      // figure of its own — roll whatever FLOW_DATA currently holds as
      // "current" into "previous" before applying the new upload, so the
      // Cafe Status Flow section still shows a month-over-month comparison.
      Object.keys(parsed).forEach(name => {
        const prior = FLOW_DATA[name];
        parsed[name].prev_month_recipe = prior ? prior.mtd_recipe : null;
      });
      mutateReplace(FLOW_DATA, parsed);
      await fetch('/api/storage/bos-upload-data-flow', { method:'POST', headers:Object.assign({'Content-Type':'application/json'}, authHeaders()), body: JSON.stringify({ value: JSON.stringify(parsed) }) });
      meta.rows = Object.keys(parsed).length;

    } else if (key === 'cspi') {
      const rows = await readWorkbookRows(file);
      if (!rows.length) { toast('No rows found in that file'); return; }
      const parsed = parseCspiUploadRows(rows);
      if (!Object.keys(parsed.CSPI_DATA).length) { toast('No café rows found — expected store_name, category, month_label, score, ytd_score columns'); return; }
      mutateReplace(CSPI_DATA, parsed.CSPI_DATA);
      await fetch('/api/storage/bos-upload-data-cspi', { method:'POST', headers:Object.assign({'Content-Type':'application/json'}, authHeaders()), body: JSON.stringify({ value: JSON.stringify(parsed.CSPI_DATA) }) });
      const hasComponents = Object.keys(parsed.CSPI_COMPONENTS).length > 0;
      if (hasComponents) {
        mutateReplace(CSPI_COMPONENTS, parsed.CSPI_COMPONENTS);
        await fetch('/api/storage/bos-upload-data-cspi-components', { method:'POST', headers:Object.assign({'Content-Type':'application/json'}, authHeaders()), body: JSON.stringify({ value: JSON.stringify(parsed.CSPI_COMPONENTS) }) });
      }
      meta.rows = Object.keys(parsed.CSPI_DATA).length;
      meta.notes = hasComponents ? 'includes Google/Mystery Diner breakdown' : 'blended score only — Google Rating & Mystery Diner KPIs unchanged (add cafe_visit/google/mystery_diner/complaints columns to update those too)';

    } else {
      toast('This upload type isn\'t wired up yet — share a sample file and it can be added.');
      return;
    }

    UPLOAD_META[key] = meta;
    await fetch('/api/storage/bos-upload-meta-' + key, { method:'POST', headers:Object.assign({'Content-Type':'application/json'}, authHeaders()), body: JSON.stringify({ value: JSON.stringify(meta) }) });
    toast(`Uploaded — ${meta.rows} row(s) applied${meta.notes?' ('+meta.notes+')':''}`);
    renderUploadCards();
  } catch (e) {
    toast('Could not process that file: ' + e.message);
  }
}

function fmtUploadDate(iso){
  if (!iso) return 'Never';
  const d = new Date(iso);
  return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}) + ' at ' + d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
}

function renderUploadCards(){
  const wrap = document.getElementById('uploadCardsWrap');
  if (!wrap) return;
  wrap.innerHTML = UPLOAD_TYPES.map(t => {
    const meta = UPLOAD_META[t.key];
    return `<div class="card">
      <div class="section-title">${t.label}</div>
      <div style="font-size:11px;color:var(--grey-500);margin-bottom:8px;">${t.desc}</div>
      ${t.note ? `<div style="font-size:10px;color:var(--grey-500);background:var(--grey-100);padding:6px 8px;border-radius:4px;margin-bottom:10px;">${t.note}</div>` : ''}
      <div style="font-size:11px;margin-bottom:10px;"><b>Last updated:</b> ${meta ? fmtUploadDate(meta.uploadedAt) + ' by ' + (meta.uploadedBy||'—') + (meta.rows?` (${meta.rows} rows)`:'') : '<span style="color:var(--grey-500);">Never — using data built into this page</span>'}</div>
      <input type="file" class="uploadFileInput" data-key="${t.key}" accept="${t.accept}" ${t.ready?'':'disabled'} style="font-size:11px;">
    </div>`;
  }).join('');
  document.querySelectorAll('.uploadFileInput').forEach(inp => {
    inp.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) handleDataUpload(inp.dataset.key, file);
    });
  });
}

    </div>
    <div class="filter-row no-print">
      <input type="text" id="vrSearch" placeholder="Search store or FSM...">
      <select id="vrTypeFilter"><option value="">All Types</option><option value="Support Visit">Support Visit</option><option value="Trainer Visit">Trainer Visit</option></select>
    </div>
    ${renderDateRangeFilterHtml('visitreports')}
    <div id="vrTableWrap"></div>
    <div id="vrPrintArea" style="display:none;"></div>
  `;

  // Reports auto-archive after this many days so the Open Jobs view stays
  // focused on current work — this is silent/automatic, no action needed.
  // A manual override (archive early, or pull an old one back) is layered
  // on top via the generic KV storage endpoint, keyed by visit id, so this
  // doesn't need any backend schema change.
  const AUTO_ARCHIVE_HOURS = 48;
  let VR_TAB = 'open';
  let ARCHIVE_OVERRIDES = {};
  let overridesLoaded = false;

  async function loadOverrides(){
    try {
      const r = await apiGet('/api/storage/visit-archive-overrides');
      ARCHIVE_OVERRIDES = JSON.parse(r.value || '{}');
    } catch (e) { ARCHIVE_OVERRIDES = {}; }
    overridesLoaded = true;
  }
  async function saveOverrides(){
    await fetch('/api/storage/visit-archive-overrides', {
      method: 'POST',
      headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders()),
      body: JSON.stringify({ value: JSON.stringify(ARCHIVE_OVERRIDES) }),
    });
  }
  // Hours since this report was actually logged — prefers the precise
  // submission timestamp (set the moment someone hits Submit in
  // log-support-visit.html) over the visit date, since a date alone would
  // round everything to midnight and make the 48-hour window inaccurate
  // (e.g. a report logged at 11pm would look nearly a full day old
  // immediately). Falls back to the visit date for any older record that
  // predates this timestamp being captured.
  function hoursSinceLogged(v){
    const preciseTs = v.fullReport && v.fullReport.meta && v.fullReport.meta.endTime;
    const d = preciseTs ? new Date(preciseTs) : new Date(v.date + 'T00:00:00');
    if (isNaN(d)) return 0;
    return (Date.now() - d.getTime()) / 3600000;
  }
  function daysSince(dateStr){
    const d = new Date(dateStr + 'T00:00:00');
    if (isNaN(d)) return 0;
    return Math.floor((Date.now() - d.getTime()) / 86400000);
  }
  function linkedActionsFor(v){
    return STATE.actions.filter(a => a.visitId === v.id);
  }
  function isArchived(v){
    if (Object.prototype.hasOwnProperty.call(ARCHIVE_OVERRIDES, v.id)) return !!ARCHIVE_OVERRIDES[v.id];
    // A report with tasks still open shouldn't silently drop into Archived
    // just because time passed — it stays in Open Jobs until those tasks
    // are actually closed (or someone archives it manually).
    if (linkedActionsFor(v).some(a => a.status !== 'closed')) return false;
    return hoursSinceLogged(v) >= AUTO_ARCHIVE_HOURS;
  }
  async function toggleArchive(v){
    ARCHIVE_OVERRIDES[v.id] = !isArchived(v);
    await saveOverrides();
    toast(ARCHIVE_OVERRIDES[v.id] ? 'Report archived' : 'Report restored to Open Jobs');
    render();
  }

  // A visit record counts as a genuine report if it has a fullReport
  // object at all — a scheduler confirmation never sends one (see
  // logConfirmedVisitToDashboard in scheduler.html), and an in-progress
  // draft lives in browser-side storage, never in this table, until the
  // person actually clicks Submit. So the mere presence of fullReport is
  // itself proof someone submitted it — checking fullReport.submitted on
  // top of that was actively wrong: the visit-logging form was setting
  // that flag on its LOCAL copy of the report only *after* already
  // sending the (still-false) version to the server, so genuinely
  // submitted reports with no flagged items were incorrectly treated as
  // empty. Linked tasks remain a second, independent signal regardless.
  function hasRealContent(v){
    if (v.fullReport) return true;
    if (linkedActionsFor(v).length > 0) return true;
    return false;
  }

  // ---------- Duplicate finder (admin only) ----------
  // Same store + date + FSM + type showing up more than once almost always
  // means a double-confirm/double-submit, not two genuinely separate visits
  // on the same day — group them and offer to clean up in one click,
  // keeping whichever entry was created last.
  function findDuplicateGroups(){
    const groups = {};
    STATE.visits.filter(hasRealContent).forEach(v => {
      const k = [v.store, v.date, v.fsm, v.type].join('||');
      (groups[k] = groups[k] || []).push(v);
    });
    return Object.values(groups).filter(g => g.length > 1);
  }
  // Scheduler confirmations are a completely different kind of record —
  // they exist to feed the Dashboard's Visit Frequency KPI, not to be a
  // GRIND report. They belong in the same visits table for that purpose,
  // but should never appear anywhere on this page: not in the main list
  // (already excluded via hasRealContent), and not in the cleanup-review
  // panel below either, since there's zero ambiguity about what they are
  // — nothing to review, nothing to decide. Only genuinely unclear
  // records (no fullReport, no source tag — e.g. a pre-existing stub from
  // before this tag even existed) get surfaced for a human to look at.
  function isSchedulerConfirmation(v){
    return v.source === 'scheduler-confirmation';
  }
  function findEmptyReports(){
    return STATE.visits.filter(v => !hasRealContent(v) && !isSchedulerConfirmation(v));
  }
  function findSchedulerConfirmationCount(){
    return STATE.visits.filter(isSchedulerConfirmation).length;
  }
  function reportContentSummary(v){
    const fr = v.fullReport;
    if (!fr) return { hasComments: false, hasPhotos: false, photoCount: 0, itemCount: 0 };
    const comments = Object.values(fr.comments || {}).filter(c => c && String(c).trim());
    const photoCount = Object.values(fr.photos || {}).reduce((sum, arr) => sum + (Array.isArray(arr) ? arr.length : (arr ? 1 : 0)), 0);
    const itemCount = (fr.customItems || []).length + (fr.portion || []).length
      + Object.values(fr.tasting || {}).reduce((sum, arr) => sum + (arr || []).length, 0)
      + Object.keys(fr.nextSteps || {}).length;
    return { hasComments: comments.length > 0, hasPhotos: photoCount > 0, photoCount, itemCount };
  }

  function renderEmptyReportsFinder(){
    if (!isAdmin()) { document.getElementById('vrEmptyWrap').innerHTML = ''; return; }
    const empties = findEmptyReports();
    if (!empties.length) { document.getElementById('vrEmptyWrap').innerHTML = ''; return; }
    document.getElementById('vrEmptyWrap').innerHTML = `
      <div class="card no-print" style="margin-bottom:16px;border-left:3px solid var(--red);">
        <div class="section-title">🧹 ${empties.length} report(s) flagged as having no actual content</div>
        <div style="font-size:12px;color:var(--grey-500);margin-bottom:10px;">Review each one below before deleting anything — deletion is permanent and cannot be undone from within BOS. Nothing is selected by default.</div>
        <div style="max-height:320px;overflow-y:auto;border:1px solid var(--grey-200);">
          <table class="data-table" style="font-size:12px;">
            <thead><tr><th style="width:24px;"></th><th>Date</th><th>Store</th><th>FSM</th><th>Type</th><th>Source / Notes</th><th>Content</th></tr></thead>
            <tbody>
              ${empties.map(v => {
                const src = v.source === 'scheduler-confirmation' ? 'Scheduler confirmation' : (v.notes || '(no notes)');
                return `<tr>
                  <td><input type="checkbox" class="vrEmptySelect" data-id="${v.id}"></td>
                  <td>${v.date}</td><td>${v.store}</td><td>${v.fsm}</td><td>${v.type}</td>
                  <td style="color:var(--grey-500);">${escapeHtmlVR2(src)}</td>
                  <td style="color:var(--grey-500);">${v.fullReport ? 'has fullReport, but no content fields set' : 'no fullReport at all'}</td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>
        <div style="display:flex;gap:8px;margin-top:10px;align-items:center;">
          <button class="btn btn-outline" id="vrEmptySelectAll">Select all</button>
          <button class="btn btn-outline" id="vrEmptyClearSel">Clear selection</button>
          <button class="btn btn-outline" id="vrCleanEmptyBtn" style="color:var(--red);border-color:var(--red);margin-left:auto;">Delete selected (<span id="vrEmptySelCount">0</span>)</button>
        </div>
      </div>`;
    const updateCount = () => {
      const n = document.querySelectorAll('.vrEmptySelect:checked').length;
      document.getElementById('vrEmptySelCount').textContent = n;
    };
    document.querySelectorAll('.vrEmptySelect').forEach(cb => cb.addEventListener('change', updateCount));
    document.getElementById('vrEmptySelectAll').addEventListener('click', () => {
      document.querySelectorAll('.vrEmptySelect').forEach(cb => cb.checked = true); updateCount();
    });
    document.getElementById('vrEmptyClearSel').addEventListener('click', () => {
      document.querySelectorAll('.vrEmptySelect').forEach(cb => cb.checked = false); updateCount();
    });
    document.getElementById('vrCleanEmptyBtn').addEventListener('click', async () => {
      const ids = Array.from(document.querySelectorAll('.vrEmptySelect:checked')).map(cb => cb.dataset.id);
      if (!ids.length) { toast('Nothing selected'); return; }
      if (!confirm(`Delete ${ids.length} selected report(s)? This is permanent and cannot be undone.`)) return;
      try {
        for (const id of ids) { await apiDelete('/api/visits/' + id); STATE.visits = STATE.visits.filter(r => r.id !== id); }
        toast(`Deleted ${ids.length} report(s)`);
        renderEmptyReportsFinder();
        renderDuplicateFinder();
        render();
      } catch (e) { toast(e.message || 'Could not delete selected reports'); }
    });
  }
  function renderDuplicateFinder(){
    if (!isAdmin()) { document.getElementById('vrDupWrap').innerHTML = ''; return; }
    const dupGroups = findDuplicateGroups();
    if (!dupGroups.length) { document.getElementById('vrDupWrap').innerHTML = ''; return; }
    document.getElementById('vrDupWrap').innerHTML = `
      <div class="card no-print" style="margin-bottom:16px;border-left:3px solid var(--amber);">
        <div class="section-title">⚠ ${dupGroups.length} possible duplicate group(s) found</div>
        <div style="font-size:12px;color:var(--grey-500);margin-bottom:10px;">Same store, date, FSM and visit type appearing more than once. Review the content of each before deciding which to keep — nothing is pre-selected.</div>
        ${dupGroups.map((g, gi) => `
          <div style="padding:8px 0;border-bottom:1px solid var(--grey-200);">
            <div style="font-weight:600;font-size:13px;margin-bottom:6px;">${g[0].store} — ${g[0].fsm} — ${g[0].date} — ${g[0].type} <span class="badge amber">${g.length}x</span></div>
            <table class="data-table" style="font-size:11.5px;margin-bottom:6px;">
              <thead><tr><th style="width:24px;"></th><th>ID</th><th>Comments</th><th>Photos</th><th>Items logged</th><th>Notes</th></tr></thead>
              <tbody>
                ${g.map(v => {
                  const c = reportContentSummary(v);
                  return `<tr>
                    <td><input type="checkbox" class="vrDupSelect" data-gi="${gi}" data-id="${v.id}"></td>
                    <td>${v.id}</td>
                    <td>${c.hasComments ? '✓' : '—'}</td>
                    <td>${c.hasPhotos ? c.photoCount : '—'}</td>
                    <td>${c.itemCount || '—'}</td>
                    <td style="color:var(--grey-500);">${escapeHtmlVR2(v.notes || '')}</td>
                  </tr>`;
                }).join('')}
              </tbody>
            </table>
            <button class="btn btn-outline vrDupCleanBtn" data-gi="${gi}" style="color:var(--red);border-color:var(--red);">Delete checked in this group</button>
          </div>`).join('')}
      </div>`;
    document.querySelectorAll('.vrDupCleanBtn').forEach(btn => btn.addEventListener('click', async () => {
      const gi = btn.dataset.gi;
      const ids = Array.from(document.querySelectorAll(`.vrDupSelect[data-gi="${gi}"]:checked`)).map(cb => cb.dataset.id);
      if (!ids.length) { toast('Nothing checked in this group'); return; }
      const g = dupGroups[parseInt(gi, 10)];
      if (ids.length === g.length) { toast('You\'ve checked every copy in this group — leave at least one, or none of this café\'s visit will remain.'); return; }
      if (!confirm(`Delete ${ids.length} selected report(s) from this group? This is permanent and cannot be undone.`)) return;
      try {
        for (const id of ids) { await apiDelete('/api/visits/' + id); STATE.visits = STATE.visits.filter(r => r.id !== id); }
        toast(`Deleted ${ids.length} report(s)`);
        renderDuplicateFinder();
        render();
      } catch (e) { toast(e.message || 'Could not delete duplicates'); }
    }));
  }

  function render(){
    document.querySelectorAll('.vrTabBtn').forEach(b => {
      b.style.fontWeight = b.dataset.tab === VR_TAB ? '600' : '400';
      b.style.background = b.dataset.tab === VR_TAB ? 'var(--grey-100)' : '';
    });
    const search = document.getElementById('vrSearch').value.toLowerCase();
    const typeFilter = document.getElementById('vrTypeFilter').value;
    const rows = [...STATE.visits]
      .filter(hasRealContent)
      .filter(v => dateInRange(v.date, 'visitreports'))
      .filter(v => (!typeFilter || v.type === typeFilter) && (!search || v.store.toLowerCase().includes(search) || v.fsm.toLowerCase().includes(search)))
      .filter(v => VR_TAB === 'archived' ? isArchived(v) : !isArchived(v))
      .sort((a,b) => b.date.localeCompare(a.date));

    document.getElementById('vrTableWrap').innerHTML = rows.length ? `
      <table class="data-table">
        <thead><tr><th>Date</th><th>Store</th><th>FSM</th><th>Type</th><th>Flagged</th><th>Tasks</th><th></th></tr></thead>
        <tbody>${rows.map(v => {
          const fr = v.fullReport;
          const flagCount = fr && fr.nextSteps ? Object.keys(fr.nextSteps).filter(k => fr.nextSteps[k] && fr.nextSteps[k].action).length : null;
          const linkedActions = STATE.actions.filter(a => a.visitId === v.id);
          const open = linkedActions.filter(a => a.status !== 'closed').length;
          return `<tr>
            <td>${v.date}</td><td>${v.store}</td><td>${v.fsm}</td><td>${v.type}</td>
            <td>${flagCount===null ? '—' : flagCount}</td>
            <td>${linkedActions.length}${open ? ` <span class="badge amber">${open} open</span>` : ''}</td>
            <td style="white-space:nowrap;">
              <button class="btn btn-outline vrViewBtn" data-id="${v.id}">View / PDF</button>
              <button class="btn btn-outline sendUpdateEmailBtn" data-store="${escapeHtmlVR2(v.store)}" data-subject="BOS Visit Report Update — ${escapeHtmlVR2(v.store)}" data-body="Regarding the ${escapeHtmlVR2(v.type||'visit')} report logged on ${v.date}${open ? ' — '+open+' task(s) still open from this visit.' : '.'}" data-detail-type="visit" data-detail-id="${escapeHtmlVR2(v.id)}" style="margin-left:4px;">✉</button>
              ${isEditor() && fr ? `<button class="btn btn-outline vrEditBtn" data-id="${v.id}" style="margin-left:4px;">Edit</button>` : ''}
              ${isEditor() ? `<button class="btn btn-outline vrArchiveBtn" data-id="${v.id}" style="margin-left:4px;">${VR_TAB==='archived' ? 'Restore' : 'Archive'}</button>` : ''}
              ${isAdmin() ? `<button class="btn btn-outline vrDeleteBtn" data-id="${v.id}" style="color:var(--red);border-color:var(--red);margin-left:4px;">Delete</button>` : ''}
            </td>
          </tr>`;
        }).join('')}</tbody>
      </table>` : `<div class="empty-state">No ${VR_TAB==='archived'?'archived':'open'} visit reports match this filter.</div>`;

    document.querySelectorAll('.sendUpdateEmailBtn[data-detail-type="visit"]').forEach(btn => {
      const v = rows.find(r => r.id === btn.dataset.detailId);
      if (v) btn._getDetailedReportHtml = () => buildVisitReportHtml(v);
    });
    wireSendUpdateEmailButtons();
    document.querySelectorAll('.vrViewBtn').forEach(btn => btn.addEventListener('click', () => openVisitReport(btn.dataset.id, rows)));
    document.querySelectorAll('.vrEditBtn').forEach(btn => btn.addEventListener('click', () => {
      window.location.href = '/log-support-visit.html?editVisitId=' + encodeURIComponent(btn.dataset.id);
    }));
    document.querySelectorAll('.vrArchiveBtn').forEach(btn => btn.addEventListener('click', () => {
      const v = STATE.visits.find(r => r.id === btn.dataset.id);
      if (v) toggleArchive(v);
    }));
    document.querySelectorAll('.vrDeleteBtn').forEach(btn => btn.addEventListener('click', () => deleteVisitReport(btn.dataset.id)));
  }

  document.querySelectorAll('.vrTabBtn').forEach(btn => btn.addEventListener('click', () => { VR_TAB = btn.dataset.tab; render(); }));
  wireDateRangeFilter('visitreports', render);

  loadOverrides().then(() => { render(); });

  async function deleteVisitReport(id){
    const v = STATE.visits.find(r => r.id === id);
    if (!v) return;
    if (!confirm(`Delete the ${v.type} report for ${v.store} on ${v.date}?\n\nThis removes the report and its photos permanently. Any tasks it already created in the Task Tracker will NOT be deleted — remove those separately if needed.`)) return;
    try {
      await apiDelete('/api/visits/' + id);
      STATE.visits = STATE.visits.filter(r => r.id !== id);
      toast('Visit report deleted');
      render();
    } catch (e) {
      toast(e.message || 'Could not delete visit report');
    }
  }

  function escapeHtmlVR(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  // Mirrors the data model in log-support-visit.html (GRIND_RESET / ADMIN /
  // QC_TASTING_CATS — Service/Coffee/Quality sections were folded into a
  // single GRIND Reset section, and customItems/portion are now flat lists
  // rather than per-section objects) so stored IDs can be turned back into
  // readable labels for the report.
  const VR_GRIND_RESET = [
    { id: 'gr-vibe', text: 'Vibe & feel — flow, control, temp, music on, lighting, customer faces' },
    { id: 'gr-devices', text: 'Devices — MrD & UE tablets on/working, Flow device live to recipe, BBM screens accurate' },
    { id: 'gr-mgmt', text: 'Management presence & control' },
    { id: 'gr-staffing', text: 'Staffing — adequately staffed; mgmt/supervisor on shift & uniformed' },
    { id: 'gr-retail', text: 'Retail & displays — tags, pricing recon, range, appeal, tidiness vs. planogram, incl. cake & pasteis' },
    { id: 'gr-flojet', text: 'Flojet test — works, team can operate, emergency water available (pre-communicate, trade-dependent)' },
    { id: 'gr-plants', text: 'Plants & plant boxes — condition & clean (store dependent)' },
    { id: 'gr-masterfile', text: 'Google, App & Masterfile aligned & up to date — if not, log on task tracker' },
    { id: 'gr-hygiene', text: 'Overall hygiene & cleanliness' },
    { id: 'gr-checklists', text: 'Checklists for all sections and required recipe files/SOP\'s available' },
    { id: 'gr-coffeecheck', text: 'Coffee check (grinder settings and shot time/volume)' },
    { id: 'gr-ordertimes', text: 'Order times check (bar & kitchen)' },
    { id: 'gr-teamq', text: 'Team Question — I asked a question of each department' },
  ];
  const VR_ADMIN = [
    { id: 'a1', text: 'Café status update with franchisee/senior manager — Flow, turnover, B.Better, all KPIs' },
    { id: 'a2', text: 'Check servicing records' },
    { id: 'a3', text: 'Outstanding tasks / non-conformances — Tracker & LTL' },
  ];
  const VR_QC_TASTING_CATS = ['Coffee', 'New Beverages', 'New Dishes', 'Base Sauces'];

  function vrActionLabel(step) {
    if (!step || !step.action) return 'Not yet assigned';
    if (step.action === 'satisfactory') return 'Satisfactory Outcome — No Action ✓';
    if (step.action === 'retrained') return 'Retrained and Rectified ✓';
    if (step.action === 'na') return 'N/A ✓';
    if (step.action === 'tasktracker') return 'Logged on Task Tracker' + (step.owner ? ' — Owner: ' + escapeHtmlVR(step.owner) : '') + (step.dueDate ? ', Due: ' + step.dueDate : '');
    if (step.action === 'nonconformance') return 'Logged as Non-Conformance' + (step.owner ? ' — Owner: ' + escapeHtmlVR(step.owner) : '') + (step.dueDate ? ', Due: ' + step.dueDate : '');
    return 'Not yet assigned';
  }
  function vrPhotosBlock(photos) {
    if (!photos || !photos.length) return '';
    return `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;">` +
      photos.map(src => `<img src="${src}" style="width:72px;height:72px;object-fit:cover;border:1px solid #d4d4d4;border-radius:2px;">`).join('') +
      `</div>`;
  }
  function vrItemBlock(text, id, fr) {
    const step = (fr.nextSteps||{})[id];
    if (step && step.action === 'na') return ''; // N/A items are excluded from the PDF entirely
    const comment = ((fr.comments||{})[id] || '').trim();
    const photos = (fr.photos||{})[id] || [];
    const hasAction = !!(step && step.action);
    const flagged = !!comment || hasAction || photos.length > 0;
    // A question that wasn't opened/selected, and has no comment, action or
    // photo attached, has nothing to report — leave it out of the PDF
    // entirely rather than printing a blank row.
    if (!flagged) return '';
    return `
    <div style="padding:8px 0;border-bottom:1px solid #ebebeb;${hasAction ? 'background:rgba(200,174,121,0.16);border-left:3px solid #c8ae79;padding-left:8px;margin-left:-1px;' : ''}">
      <div style="font-weight:700;font-size:11.5px;">${escapeHtmlVR(text)}</div>
      ${comment ? `<div style="font-size:11px;color:#8f733f;border:1px solid #c8ae79;background:rgba(200,174,121,0.10);padding:5px 8px;margin-top:5px;">${escapeHtmlVR(comment)}</div>` : ''}
      ${vrPhotosBlock(photos)}
      ${hasAction ? `<div style="font-size:10px;color:#1a7a44;margin-top:4px;font-weight:800;">→ ${vrActionLabel(step)}</div>` : ''}
    </div>`;
  }
  // Portion check entries print as plain item/comment text — no boxed
  // comment styling — but still show the next-step action if one was chosen.
  function vrPortionBlock(p, id, fr) {
    const step = (fr.nextSteps || {})[id];
    if (step && step.action === 'na') return ''; // N/A items are excluded from the PDF entirely
    const item = (p.item || '').trim();
    const comment = (p.comment || '').trim();
    const hasAction = !!(step && step.action);
    // Same rule as vrItemBlock — nothing flagged means nothing to print,
    // regardless of whether an item name was typed in.
    if (!comment && !hasAction) return '';
    const label = (p.department ? `[${escapeHtmlVR(p.department)}] ` : '') + (item ? escapeHtmlVR(item) : 'Portion check');
    return `<div style="padding:6px 0;border-bottom:1px solid #ebebeb;font-size:11.5px;${hasAction ? 'background:rgba(200,174,121,0.16);border-left:3px solid #c8ae79;padding-left:8px;margin-left:-1px;' : ''}">
      <b>${label}</b>${comment ? ' — ' + escapeHtmlVR(comment) : ''}
      ${hasAction ? `<div style="font-size:10px;color:#1a7a44;margin-top:2px;font-weight:800;">→ ${vrActionLabel(step)}</div>` : ''}
    </div>`;
  }
  function vrSectionBlock(tag, label, bodyHtml) {
    if (!bodyHtml) return '';
    return `
    <div style="margin-top:16px;border:1px solid #ebebeb;">
      <div style="background:#1a1a1a;color:#fff;padding:8px 14px;display:flex;align-items:center;gap:8px;">
        <span style="background:#c8ae79;color:#1a1a1a;font-size:9px;font-weight:800;padding:2px 7px;text-transform:uppercase;letter-spacing:0.05em;">${escapeHtmlVR(tag)}</span>
        <span style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:0.03em;">${escapeHtmlVR(label)}</span>
      </div>
      <div style="padding:2px 14px;">${bodyHtml}</div>
    </div>`;
  }
  function vrHeader(v) {
    return `
    <div style="background:#1a1a1a;color:#fff;padding:16px 22px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;">
      <div style="font-weight:800;letter-spacing:0.2em;font-size:15px;text-transform:uppercase;">BOOTLEGGER<span style="color:#c8ae79;">.</span></div>
      <div style="font-size:10px;color:#c8ae79;text-transform:uppercase;letter-spacing:0.08em;">GRIND Café Support Summary</div>
    </div>
